[project]
name = "autotrading-api"
version = "0.1.0"
description = "Backend for the Global Market Intelligence platform (API, worker, scheduler)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "boto3>=1.43.108",
    "dramatiq[redis]>=2.2,<3",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrading"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.108",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["autotrading"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "migrations"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# APScheduler 3.x ships no type information.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local stack from `make up` (fails, never skips, when it is down)",
]
