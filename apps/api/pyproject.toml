[project]
name = "autotrading-api"
version = "0.1.0"
description = "Backend for the Global Market Intelligence platform (API, worker, scheduler)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "boto3>=1.43.108",
    "dramatiq[redis]>=2.2,<3",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrading"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.108",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["autotrading"]

# Chinese message text (M3.0c, ADR-038) uses full-width punctuation on purpose.
[tool.ruff.lint.per-file-ignores]
"src/autotrading/domain/delivery.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/repositories/labels.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/repositories/alert_context.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_delivery.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_labels.py" = ["RUF001", "RUF002", "RUF003"]
"tests/integration/test_delivery.py" = ["RUF001", "RUF002", "RUF003"]
"tests/integration/test_backtests.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/domain/twse.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/adapters/twse/*.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/api/taiwan.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_twse.py" = ["RUF001", "RUF002", "RUF003"]
"tests/integration/test_twse.py" = ["RUF001", "RUF002", "RUF003"]
"tests/twse_replay.py" = ["RUF001", "RUF002", "RUF003"]
"tests/fixtures/twse/*.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/domain/finmind.py" = ["RUF001", "RUF002", "RUF003"]
"src/autotrading/adapters/finmind/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_finmind.py" = ["RUF001", "RUF002", "RUF003"]
"tests/integration/test_finmind.py" = ["RUF001", "RUF002", "RUF003"]
"tests/finmind_replay.py" = ["RUF001", "RUF002", "RUF003"]
"tests/fixtures/finmind/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "migrations"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# APScheduler 3.x ships no type information.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local stack from `make up` (fails, never skips, when it is down)",
]
