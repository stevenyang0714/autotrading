name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR runs cancel older runs of the same PR; main runs are never cancelled. (A PR merged right
# after opening used to share main's group and cancel main's run, as on PR #7.)
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  backend:
    name: backend (ruff, mypy, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.22"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: uv.lock  # relative to working-directory
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --strict src/autotrading/domain
      - run: uv run pytest -m "not integration"
      - name: OpenAPI schema is up to date (run `make gen`)
        run: |
          uv run python -m autotrading.openapi_dump ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json

  frontend:
    name: frontend (eslint, tsc, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated glossary and API types are up to date (run `make gen`)
        run: |
          pnpm -s gen
          git diff --exit-code -- src/generated
      - run: pnpm -s lint
      - run: pnpm -s typecheck
      - run: pnpm -s test

  compose-smoke:
    name: compose smoke (make up, integration tests, /health, e2e)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.22"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: uv.lock  # relative to working-directory
      - run: cd apps/api && uv sync --locked
      - run: make up
      - run: make migrate
      # Recorded real SEC data (no network, no SEC_USER_AGENT) for the instrument page e2e tests.
      - run: make sec-replay
      - run: make test-integration
      - run: curl -fsS http://127.0.0.1:8000/health
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: cd apps/web && pnpm install --frozen-lockfile
      - run: cd apps/web && pnpm exec playwright install --with-deps chromium
      - run: make e2e
        env:
          CI: "true"
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Service status on failure
        if: failure()
        run: make ps && docker compose -f infra/docker-compose.yml --project-directory . logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --project-directory . down -v
