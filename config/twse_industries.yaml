# TWSE industry codes (產業別) of the company file t187ap03_L and their names (M3.11, ADR-042 SC2).
# Derived on 2026-11-04 by joining two TWSE OpenAPI files on 公司代號: t187ap03_L (上市公司基本資料,
# the code) and t187ap05_L (上市公司每月營業收入彙總表, the name); every code met exactly one name.
# The names are those of TWSE's 上市公司產業類別劃分暨調整要點 as amended in 2023 (綠能環保, 數位雲端,
# 運動休閒 and 居家生活 added; 觀光事業 renamed 觀光餐旅). Code 19 (綜合) has no listed company today
# and is left out: an unknown code shows as itself. 91 are depositary receipts (存託憑證), which the
# screens leave out (config/screen_rules.yaml). Display only: nothing computes with the names.
version: 0.1.0
reviewed: 2026-11-04
sources:
  - https://openapi.twse.com.tw/v1/opendata/t187ap03_L
  - https://openapi.twse.com.tw/v1/opendata/t187ap05_L
  - https://www.twse.com.tw/staticFiles/announcement/announcement/1120004601-1.pdf
