    access_status: disabled
    update_cadence: per_release
    freshness_sla_seconds: 7200
    enabled: false
    priority: 43
    topics: [news, official, macro]
    rate_limit_per_second: 1
    rate_limit_burst: 1

  - id: bea_releases
