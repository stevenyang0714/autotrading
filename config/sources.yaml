# Source Registry seed (02 §4, M0.3). Loaded by `make migrate` (python -m autotrading.config_sync).
# Only providers named in the specs/ADRs. A source stays `enabled: false` until its adapter ships
# and its license/access check is recorded; disabled sources are not judged for freshness.
# license_status uses the glossary values: public | licensed_personal | licensed_redistribution |
# restricted | unknown. Re-verify provider terms and rate limits before enabling.
version: 0.1.0

sources:
  - id: sec_edgar
    name: SEC EDGAR (submissions and XBRL company facts)
    url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    tier: 1
    license_status: public
    note: Free public API; fair access policy requires a User-Agent with name and email.
    access_status: active           # SEC_USER_AGENT (name + email) set in .env, 2026-10-05
    update_cadence: per_filing
    freshness_sla_seconds: 172800   # 2 days; refreshed daily at 10:00 SGT (M0.5)
    enabled: true                   # M0.5
    priority: 10
    topics: [filings, fundamentals, corporate_actions]
    rate_limit_per_second: 5        # errata E8: well under SEC's 10 requests/second
    rate_limit_burst: 5

  - id: fred
    name: FRED / ALFRED (Federal Reserve Bank of St. Louis)
    url: https://fred.stlouisfed.org/docs/api/fred/
    tier: 1
    license_status: restricted
    note: Free API under FRED terms; some series carry third-party copyright.
    access_status: active           # FRED_API_KEY set in .env, 2026-10-06
    update_cadence: daily
    freshness_sla_seconds: 172800   # 2 days; refreshed daily at 10:15 SGT (M0.6)
    enabled: true                   # M0.6
    priority: 20
    topics: [macro, rates, inflation, labor, credit]
    rate_limit_per_second: 1
    rate_limit_burst: 2

  - id: alpaca_iex
    name: Alpaca Market Data, Basic plan (IEX real-time)
    url: https://docs.alpaca.markets/us/v1.1/docs/about-market-data-api
    tier: 1
    license_status: licensed_personal
    access_status: active           # paper-account data keys in .env; OD-9 Alpaca part verified 2026-10-06
    update_cadence: intraday
    freshness_sla_seconds: 900      # judged during US market hours only (ADR-017)
    enabled: true                   # M0.7 (ADR-004)
    priority: 30
    topics: [prices, quotes, bars]
    rate_limit_per_second: 3
    rate_limit_burst: 5

  - id: massive
    name: Massive (formerly Polygon.io) Stocks
    url: https://www.massive.com/stocks
    tier: 1
    license_status: licensed_personal
    note: Canonical primary price feed; paid. Activated only after the license check (ADR-004).
    access_status: disabled
    update_cadence: intraday
    freshness_sla_seconds: 900
    enabled: false
    priority: 25
    topics: [prices, quotes, bars, financials]
    rate_limit_per_second: 5
    rate_limit_burst: 10

  - id: twse_openapi
    name: TWSE OpenAPI (Taiwan Stock Exchange open data)
    url: https://openapi.twse.com.tw/
    tier: 1
    license_status: public
    note: >-
      Open Government Data License Taiwan 1.0 (https://data.gov.tw/license), free, no key;
      attribution required (provider, year, dataset, the licence sentence and URL), shown on
      every Taiwan page. Only the six OpenAPI files of M3.7 (ADR-039 TW1), each the latest
      session only. The website's dated queries (www.twse.com.tw/rwd) are not used: its terms
      of use (Art. 6) forbid automated download without TWSE's consent. Re-verified 2026-10-22.
    access_status: active           # no credentials needed
    update_cadence: daily
    freshness_sla_seconds: 129600   # 36 hours; three runs a day at 07:40, 09:40, 20:40 SGT
    enabled: true                   # M3.7
    priority: 35
    topics: [prices, valuation, margin, corporate_actions, taiwan]
    rate_limit_per_second: 0.334    # one request every 3 seconds
    rate_limit_burst: 1

  - id: finmind
    name: FinMind (Taiwan market data aggregator, free tier)
    url: https://finmind.github.io/Disclaimer/
    tier: 2
    license_status: licensed_personal
    note: >-
      Supplementary source for Taiwan (M3.7b, ADR-040): per-stock institutional investors and
      foreign shareholding daily, and a one-time history (prices, margin, P/E, ex-dividend
      results) for the 11-code universe before 2026-10-21. M3.11 (ADR-042, approved by Steven
      2026-11-04): prices since 2024 and ex-dividend results of every listed company, once, and
      the institutional flows of the Taiwan screens' candidates daily (at most 150 requests a
      day in all). Free anonymous tier (300 requests
      an hour, no account, no token), personal non-commercial use per
      https://finmind.github.io/Pricing/ and https://finmind.github.io/PrivacyPolicy/:
      attribution 資料來源：FinMind wherever the data shows, no redistribution, no mirror.
      FinMind states its data comes from official open channels but does not name the source
      per dataset, so it stays tier 2 and never overwrites a twse_openapi row. Read 2026-10-26.
    access_status: active           # no credentials needed
    update_cadence: daily
    freshness_sla_seconds: 129600   # 36 hours; flows run daily at 21:30 SGT
    enabled: true                   # M3.7b
    priority: 36
    topics: [flows, ownership, prices, margin, valuation, corporate_actions, taiwan]
    rate_limit_per_second: 0.08     # one request every 12.5 s: 288 an hour under the 300 cap
    rate_limit_burst: 1

  - id: gdelt
    name: GDELT DOC 2.0 API
    url: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
    tier: 2
    license_status: public
    note: >-
      Discovery layer; each news item keeps the tier of its own publisher (config/news_publishers.yaml).
      Terms (gdeltproject.org/about.html, read 2026-10-06): unrestricted use without fee; any use must
      cite the GDELT Project and link to https://www.gdeltproject.org/. Metadata only: no article text.
    access_status: active           # terms checked 2026-10-06 (ADR-018)
    update_cadence: intraday
    freshness_sla_seconds: 7200     # hourly runs (M0.8)
    enabled: true                   # M0.8
    priority: 40
    topics: [news]
    rate_limit_per_second: 0.1      # one request every 10 seconds; GDELT asks for at most one per 5
    rate_limit_burst: 1

  # Official RSS feeds (M0.8, ADR-018): feed URLs in config/news_feeds.yaml. Titles, links, times
  # and short summaries only; full text is stripped before anything is stored. Polled every 30 min.
  - id: sec_press
    name: SEC press releases (RSS)
    url: https://www.sec.gov/news/pressreleases.rss
    tier: 1
    license_status: public
    note: "U.S. government work. SEC fair access policy: User-Agent with name and email."
    access_status: active
    update_cadence: per_release
    freshness_sla_seconds: 7200
    enabled: true
    priority: 41
    topics: [news, official]
    rate_limit_per_second: 1
    rate_limit_burst: 1

  - id: fed_press
    name: Federal Reserve press releases (RSS)
    url: https://www.federalreserve.gov/feeds/press_all.xml
    tier: 1
    license_status: public
    note: U.S. government work.
    access_status: active
    update_cadence: per_release
    freshness_sla_seconds: 7200
    enabled: true
    priority: 42
    topics: [news, official, macro]
    rate_limit_per_second: 1
    rate_limit_burst: 1

  - id: bls_releases
    name: BLS latest releases (RSS)
    url: https://www.bls.gov/feed/bls_latest.rss
    tier: 1
    license_status: public
    note: >-
      Disabled 2026-10-06 (Steven): one rolling "latest numbers" item at a fixed URL, so later
