# Signal convergence and alert rules (M1.7, ADR-028; build spec 02 §16, research report 01 §15).
#
# Each rule set is deterministic and versioned like config/buyback_rules.yaml: a released
# rule_version is immutable (`make migrate` refuses changed content under an existing version,
# and a unit test pins each version's sha256). Every convergence assessment and alert stores the
# rule_version it used.
#
# Levels (01 §15): L0 Information, L1 Watch, L2 Thesis, L3 Trade Candidate, L4 Execution Ready.
# L4 needs a risk check, liquidity, sizing and compliance: unreachable under 0.1.0 and 0.2.0
# (P1-4); since 0.3.0 (M2.3, ADR-031) it needs L3 and the company's standard paper position
# passing the risk rules. Paper only: no level places an order (ADR-008).
# Market-wide alerts: a stress-state change (0.2.0), the paper portfolio's drawdown (0.3.0) and,
# since 0.4.0 (M2.4, ADR-032), a new S3 ETF rotation target; none has a company. 0.5.0 (M3.0,
# ADR-036) reads regime rules 0.2.0 and rotation rules 0.2.0.
#
# Families (02 §2): 2 Corporate Actions (buyback states and statements), 3 Fundamental &
# Valuation (10-K/10-Q filings, valuation support), 4 Earnings (8-K Item 2.02 releases),
# 5 Price / Trend (market confirmation).
version: 0.1.0
rule_sets:
  - rule_version: 0.5.0
    status: active  # active: evaluated with each buyback state assignment; retired: kept for history
    released: "2026-10-19"
    note: >-
      0.4.0 under regime rules 0.2.0 and rotation rules 0.2.0 (ADR-036 D6): the stress-change and
      rotation alerts follow the reviewed stress state. Levels, events and the other alerts are
      unchanged.
    buyback_rule_version: 0.3.0
    event_kinds: [earnings_release, periodic_report, buyback_statement, buyback_state_change]
    buyback_statement_kinds: [new, increase]
    event_lookback_days: 30
    levels:
      watch:
        window_days: 30
        min_items: 2
        min_signals: 1
      thesis:
        buyback_states: [active, high_conviction, trade_ready]
        valuation_conditions: [high_conviction.dcf_discount, high_conviction.fcf_yield]
      trade_candidate:
        market_conditions: [trade_ready.above_average, trade_ready.relative_return]
      execution_ready:  # L4: L3 + the standard paper position passes the risk check
        risk_conditions: [trade_ready.risk_check]
    market_events: [stress_change]
    regime_rule_version: 0.2.0
    portfolio_events: [drawdown]
    risk_rule_version: 0.1.0
    rotation_events: [target_change]
    rotation_rule_version: 0.2.0
  - rule_version: 0.4.0
    status: retired
    released: "2026-10-16"
    note: >-
      0.3.0 plus an alert when the S3 ETF rotation sets a new target (ADR-032 Q2), under rotation
      rules 0.1.0. Levels, events and the other alerts are unchanged.
    buyback_rule_version: 0.3.0
    event_kinds: [earnings_release, periodic_report, buyback_statement, buyback_state_change]
    buyback_statement_kinds: [new, increase]
    event_lookback_days: 30
    levels:
      watch:
        window_days: 30
        min_items: 2
        min_signals: 1
      thesis:
        buyback_states: [active, high_conviction, trade_ready]
        valuation_conditions: [high_conviction.dcf_discount, high_conviction.fcf_yield]
      trade_candidate:
        market_conditions: [trade_ready.above_average, trade_ready.relative_return]
      execution_ready:  # L4: L3 + the standard paper position passes the risk check
        risk_conditions: [trade_ready.risk_check]
    market_events: [stress_change]
    regime_rule_version: 0.1.0
    portfolio_events: [drawdown]
    risk_rule_version: 0.1.0
    rotation_events: [target_change]
    rotation_rule_version: 0.1.0
  - rule_version: 0.3.0
    status: retired
    released: "2026-10-15"
    note: >-
      0.2.0 with L4 Execution Ready reachable for paper decisions (ADR-031 R3, P2-7): L3 and a
      passed standard risk check, read from buyback rules 0.3.0; and the paper portfolio's
      drawdown alert under risk rules 0.1.0 (R4).
    buyback_rule_version: 0.3.0
    event_kinds: [earnings_release, periodic_report, buyback_statement, buyback_state_change]
    buyback_statement_kinds: [new, increase]
    event_lookback_days: 30
    levels:
      watch:
        window_days: 30
        min_items: 2
        min_signals: 1
      thesis:
        buyback_states: [active, high_conviction, trade_ready]
        valuation_conditions: [high_conviction.dcf_discount, high_conviction.fcf_yield]
      trade_candidate:
        market_conditions: [trade_ready.above_average, trade_ready.relative_return]
      execution_ready:  # L4: L3 + the standard paper position passes the risk check
        risk_conditions: [trade_ready.risk_check]
    market_events: [stress_change]
    regime_rule_version: 0.1.0
    portfolio_events: [drawdown]
    risk_rule_version: 0.1.0
  - rule_version: 0.2.0
    status: retired
    released: "2026-10-12"
    note: >-
      0.1.0 (A1-A4, still Claude's defaults to confirm) plus market-wide alerts: a change of the
      stress state under regime rules 0.1.0 raises an alert (ADR-029 R4).
    buyback_rule_version: 0.2.0
    event_kinds: [earnings_release, periodic_report, buyback_statement, buyback_state_change]
    buyback_statement_kinds: [new, increase]
    event_lookback_days: 30
    levels:
      watch:
        window_days: 30
        min_items: 2
        min_signals: 1
      thesis:
        buyback_states: [active, high_conviction]
        valuation_conditions: [high_conviction.dcf_discount, high_conviction.fcf_yield]
      trade_candidate:
        market_conditions: [trade_ready.above_average, trade_ready.relative_return]
    market_events: [stress_change]
    regime_rule_version: 0.1.0
  - rule_version: 0.1.0
    status: retired
    released: "2026-10-12"
    note: >-
      Claude's defaults A1-A4 (ADR-028), released overnight for Steven's review: a change is a
      new rule_version.
    # The buyback state assignments the levels read (their states and condition readings).
    buyback_rule_version: 0.2.0
    # A1: the events that are L0 alerts and count as items.
    event_kinds: [earnings_release, periodic_report, buyback_statement, buyback_state_change]
    buyback_statement_kinds: [new, increase]
    # A3: live evaluations raise event alerts for events since the previous assessment, at most
    # this many days back; backfilled assessments raise none.
    event_lookback_days: 30
    levels:
      watch:  # L1: multiple related signals
        window_days: 30
        min_items: 2
        min_signals: 1
      thesis:  # L2: independent signals + the S1 causal chain (buybacks + value)
        buyback_states: [active, high_conviction]
        valuation_conditions: [high_conviction.dcf_discount, high_conviction.fcf_yield]
      trade_candidate:  # L3: thesis + market confirmation + the S1 strategy trigger
        market_conditions: [trade_ready.above_average, trade_ready.relative_return]
