# Taiwan Stock Exchange trading calendar (M3.7, ADR-039 TW4): weekday closures in Taipei time.
# Source: TWSE OpenAPI /holidaySchedule/holidaySchedule (有價證券集中交易市場開（休）市日期),
# read 2026-10-22 and reviewed by hand; it lists the current year only. Weekend entries of the
# schedule are left out (no weekend session), and so are its 開始交易日 / 最後交易日 lines,
# which are sessions. Add 2027 when TWSE publishes it; the Data Health page warns when today is
# past `covered_until`. Advisory: Taiwan sessions are the days the exchange published a close
# (a typhoon closure is known only when no close comes); this calendar drives the market-open
# display and the expected-session notes, never the stored data.
version: 0.1.0
exchange: XTAI
timezone: Asia/Taipei
regular: {open: "09:00", close: "13:30"}
early_close: "13:30"  # TWSE has no early closes
covered_until: 2026-12-31
holidays:
  - 2026-01-01  # 中華民國開國紀念日
  - 2026-02-12  # 市場無交易，僅辦理結算交割作業
  - 2026-02-13  # 市場無交易，僅辦理結算交割作業
  - 2026-02-16  # 農曆除夕及春節
  - 2026-02-17  # 農曆除夕及春節
  - 2026-02-18  # 農曆除夕及春節
  - 2026-02-19  # 農曆除夕及春節
  - 2026-02-20  # 農曆除夕及春節（補假）
  - 2026-02-27  # 和平紀念日（補假）
  - 2026-04-03  # 兒童節及民族掃墓節（補假）
  - 2026-04-06  # 兒童節及民族掃墓節（補假）
  - 2026-05-01  # 勞動節
  - 2026-06-19  # 端午節
  - 2026-09-25  # 中秋節
  - 2026-09-28  # 孔子誕辰紀念日／教師節
  - 2026-10-09  # 國慶日（補假）
  - 2026-10-26  # 臺灣光復暨金門古寧頭大捷紀念日（補假）
  - 2026-12-25  # 行憲紀念日
# Closures no schedule lists, added when they happen (a typhoon day: the market closes when
# Taipei City stops work). Not compared with the TWSE holiday schedule.
unscheduled_closures:
  - 2026-10-23  # 颱風休市（臺北市停止上班，2026-10-22 公告）
early_closes: []
