# Macro regime and market stress rules (M2.1, ADR-029; build spec 02 §15, research report 01 §14).
#
# Deterministic and versioned like config/buyback_rules.yaml: a released rule_version is
# immutable (`make migrate` refuses changed content under an existing version, and a unit test
# pins each version's sha256). Every regime assessment stores the rule_version it used.
#
# Every input is read as known at the assessment's time T, from the ALFRED vintage public then,
# and as this database held it at its system time S, so a stored regime always recomputes the
# same. The thresholds are defaults, unvalidated (OD-7): Steven reviews them against the history
# since 2016 (R5); a change is a new rule_version. Labels describe conditions; none is a forecast.
#
# Units: percent values in percent (2.0 = 2%); index values in their own units; payrolls in
# thousands of jobs; changes over "a month" compare the latest value with the one at or before
# 30 calendar days earlier.
version: 0.1.0
rule_sets:
  - rule_version: 0.1.0
    status: active  # active: evaluated daily; retired: kept for the stored assessments
    released: "2026-10-12"
    note: >-
      Claude's defaults (ADR-029 R5) for Steven's review against the history since 2016.
    growth:  # UNRATE (Sahm rule), PAYEMS (3-month average change), GDPC1 (annualized)
      sahm_contracting: 0.50
      sahm_slowing: 0.30
      payrolls_contracting: 0
      payrolls_slowing: 100
      gdp_contracting: 0.0
      gdp_slowing: 1.0
    inflation:  # PCEPILFE year on year against the Fed's 2% target; 3-month annualized for direction
      target: 2.0
      near_band: 0.5
      hot: 3.5
      direction_band: 0.25
    policy:  # FEDFUNDS minus core PCE (real rate), T10Y2Y inversion streak, NFCI
      real_rate_tight: 1.5
      real_rate_easy: 0.0
      nfci_tight: 0.0
      nfci_easy: -0.5
      inversion_tight_observations: 60
    credit:  # BAMLH0A0HYM2 when available (from 2023-10), otherwise NFCICREDIT
      hy_calm: 3.5
      hy_normal: 5.0
      hy_stressed: 8.0
      hy_jump: 1.0  # percentage points in a month: at least stressed
      nfci_credit_calm: -0.25
      nfci_credit_normal: 0.25
      nfci_credit_stressed: 1.0
    volatility:  # VIXCLS level; VIXCLS / VXVCLS above 1 is an inverted term structure
      vix_calm: 15
      vix_normal: 20
      vix_elevated: 30
      inversion_ratio: 1.0
    stress:  # flags (02 §15) and the four states (01 §14)
      nfci_flag: 0.0
      stlfsi_flag: 1.0
      drawdown_flag: 10  # % below the highest close of the last 252 sessions (SPY)
      dollar_flag: 3  # % rise in a month (DTWEXBGS)
      oil_flag: 30  # % move either way in a month (DCOILWTICO)
      correlation_sessions: 60  # SPY and TLT daily returns
      correlation_flag: 0.0  # above, while SPY fell over the last 21 sessions
      elevated_flags: 2
      high_flags: 4
      high_vix: 30
      crisis_vix: 40
      crisis_drawdown: 20
