# Macro series registry (M0.6, ADR-015). Loaded by `make migrate` into macro_series; the daily
# FRED refresh (10:15 SGT) ingests every enabled series with all its ALFRED vintages.
# term_id: the glossary term shown for the series (docs/glossary/glossary_seed.yaml, complete).
# position: display order on the Macro page. Edit freely; titles and units come from FRED.
version: 0.1.0
series:
  - {id: CPIAUCSL, term_id: macro_cpi, position: 10}
  - {id: PCEPILFE, term_id: macro_core_pce, position: 20}
  - {id: UNRATE, term_id: macro_unemployment_rate, position: 30}
  - {id: PAYEMS, term_id: macro_nonfarm_payrolls, position: 40}
  - {id: GDPC1, term_id: macro_real_gdp, position: 50}
  - {id: FEDFUNDS, term_id: macro_fed_funds, position: 60}
  - {id: DGS2, term_id: macro_treasury_2y, position: 70}
  - {id: DGS10, term_id: macro_treasury_10y, position: 80}
  - {id: T10Y2Y, term_id: macro_curve_10y_2y, position: 90}
  - {id: BAMLH0A0HYM2, term_id: macro_hy_oas, position: 100}
  - {id: VIXCLS, term_id: macro_vix, position: 110}
  # Regime inputs (M2.1, ADR-029). NFCI, NFCICREDIT and STLFSI4 re-estimate their whole history
  # every week, so they are read from 2015 only (observation_start).
  - {id: VXVCLS, term_id: macro_vix_3m, position: 120}
  - {id: NFCI, term_id: macro_nfci, position: 130, observation_start: 2015-01-01}
  - {id: NFCICREDIT, term_id: macro_nfci_credit, position: 140, observation_start: 2015-01-01}
  - {id: STLFSI4, term_id: macro_stlfsi, position: 150, observation_start: 2015-01-01}
  - {id: DCOILWTICO, term_id: macro_wti_oil, position: 160}
  - {id: DTWEXBGS, term_id: macro_dollar_index, position: 170}
