    related_terms: [catalyst, thesis_card]
    update_cadence: continuous
    methodology_version: 0.1.0
    status: complete

  - term_id: regime
    display_name: Regime
    category: macro
    short_definition: Current macro and market stress state.
    full_definition: "Five dimensions (growth, inflation, policy and liquidity, credit, volatility), the growth x inflation quadrant and the stress state, computed daily and at month ends since 2016 from data known at each date, under a versioned rule set (ADR-029). A stored regime always recomputes the same."
    formula: "state machine: NORMAL | ELEVATED | HIGH | CRISIS"
    unit: state
    example: "As known on 2026-10-06: stress normal; growth slowing, inflation above target (stagflation quadrant)."
    direction: N/A
    interpretation: Higher-stress states reduce new risk and raise hedging.
    why_it_matters: Changes position sizing and strategy eligibility.
    source: "Regime rules (config/regime_rules.yaml); FRED vintages and Alpaca closes"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/regime_rules.yaml
    as_of: "2026-10-13"
    caveats: Detects fragility, does not predict black swans. Thresholds are defaults, unvalidated (OD-7).
    related_terms: [tail_risk, stress_state, regime_quadrant]
    update_cadence: daily
    methodology_version: 0.1.0
    status: complete

  - term_id: tail_risk
    display_name: Tail Risk
    category: risk
    short_definition: Low-probability, high-impact loss or fragility risk.
    formula: "risk class from stress indicators"
    unit: risk class
    direction: N/A
    interpretation: Describes vulnerability to extreme moves.
    why_it_matters: Drives hedging and gross exposure limits.
    caveats: Not a forecast of a specific event.
    related_terms: [regime, expected_shortfall]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: look_ahead_bias
    display_name: "Look-ahead Bias"
    category: methodology
    short_definition: "Future information leaking into a historical test."
    full_definition: "Every backtest reads targets known at their date and recorded by the run's system time, and fills at the next close; a later close, revision or snapshot never changes a stored run (tested)."
    formula: "validation failure"
    unit: "concept"
    example: "Filling a month-end target at that day's close would be look-ahead; it fills at the next close."
    direction: "N/A"
    interpretation: "Inflates backtest results unrealistically."
    why_it_matters: "Backtests with this bias cannot be trusted."
    source: "ADR-012; ADR-033"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/backtest_rules.yaml
    as_of: "2026-10-17"
    update_cadence: "N/A"
    caveats: "Often subtle (e.g. restated data, period end instead of filing date)."
    related_terms: [point_in_time, next_close_fill, survivorship_bias]
    methodology_version: 0.1.0
    status: complete

  - term_id: survivorship_bias
    display_name: "Survivorship Bias"
    category: methodology
    short_definition: "Excluding companies that were delisted or acquired."
    full_definition: "The database holds only today's 10 companies and 8 ETFs (KI-1, KI-16): a backtest on them sees only survivors, so its returns would look better than reality. Performance is withheld until OD-7."
    formula: "validation failure"
    unit: "concept"
    example: "A 2017 universe of today's winners."
    direction: "N/A"
    interpretation: "Makes historical performance look better than reality."
    why_it_matters: "Backtests need universes that include dead names (01 §23)."
    source: "KNOWN_ISSUES KI-1; ADR-029; ADR-033"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/backtest_rules.yaml
    as_of: "2026-10-17"
    update_cadence: "N/A"
    caveats: "Requires a dataset with delisted securities (OD-7)."
    related_terms: [look_ahead_bias, performance_withheld]
    methodology_version: 0.1.0
    status: complete

  - term_id: var
    display_name: VaR
    category: risk
    short_definition: Loss threshold not expected to be exceeded at a stated confidence over a horizon.
    formula: "distribution-dependent; method and confidence shown"
    unit: currency or %
    direction: Higher = more risk
    interpretation: A reference loss level, not the worst case.
    why_it_matters: Common portfolio risk limit input.
    caveats: Underestimates tail losses under non-normal returns.
    related_terms: [expected_shortfall, risk_score]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: expected_shortfall
    display_name: Expected Shortfall
    category: risk
    short_definition: Average loss beyond the VaR threshold.
    formula: "conditional tail loss; method and confidence shown"
    unit: currency or %
    direction: Higher = more risk
    interpretation: How bad losses are when they exceed VaR.
    why_it_matters: Better captures tail risk than VaR alone.
    caveats: Depends on distribution assumptions and sample.
    related_terms: [var, tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: gross_exposure
    display_name: "Gross Exposure"
    category: risk
    short_definition: "Absolute long plus short market value relative to capital."
    full_definition: "The sum of every open paper position's |market value| at the last close known at the date, as a share of the notional capital."
    formula: "sum(|market value|) / capital x 100"
    unit: "percent"
    example: "Two 10,000 USD positions, one short: 20.00%."
    direction: "Higher = more invested"
    interpretation: "How much of the capital is at work."
    why_it_matters: "Feeds the leverage limit."
    source: "Risk rules 0.1.0 (config/risk_rules.yaml); the paper journal; ADR-031"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/risk_rules.yaml
    as_of: "2026-10-15"
    update_cadence: "with each paper TRADE, on demand, and daily (11:00 and 11:10 SGT)"
    caveats: "Says nothing about direction; see net exposure."
    related_terms: [net_exposure, risk_limit_gross]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_exposure
    display_name: "Net Exposure"
    category: risk
    short_definition: "Long minus short market value relative to capital."
    full_definition: "The sum of every open paper position's signed market value (negative for a short) as a share of the notional capital."
    formula: "sum(market value) / capital x 100"
    unit: "percent"
    example: "A 10,000 USD long and a 10,000 USD short: 0.00%."
    direction: "Higher = more net long"
    interpretation: "Which way the book leans."
    why_it_matters: "Market direction risk."
    source: "Risk rules 0.1.0 (config/risk_rules.yaml); the paper journal; ADR-031"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/risk_rules.yaml
    as_of: "2026-10-15"
    update_cadence: "with each paper TRADE, on demand, and daily (11:00 and 11:10 SGT)"
    caveats: "Ignores beta differences between positions; see beta-weighted exposure."
    related_terms: [gross_exposure, beta_exposure]
    methodology_version: 0.1.0
    status: complete

  - term_id: implied_volatility
    display_name: Implied Volatility (IV)
    category: options
    short_definition: Volatility implied by option prices.
    formula: "inferred from option price via pricing model"
    unit: "% annualized"
    direction: Higher = more implied vol
    interpretation: Market's priced expectation of future movement.
    why_it_matters: Context for options trades, hedges and expected move.
    caveats: Affected by liquidity and model choice; differs from realized volatility.
    related_terms: [iv_percentile, skew]
    update_cadence: intraday
    methodology_version: 0.1.0
    status: seed

  - term_id: iv_percentile
    display_name: IV Percentile
    category: options
    short_definition: Current IV's percentile within its historical distribution.
    formula: "percentile(IV history over fixed window)"
    unit: "%"
    direction: Higher = more expensive relative context
    interpretation: Whether options are pricey versus their own history.
    why_it_matters: Helps choose between buying and selling volatility.
    caveats: Window length must be fixed and shown.
    related_terms: [implied_volatility]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: skew
    display_name: Skew
    category: options
    short_definition: Shape of implied volatility across strikes.
    formula: "surface-derived; method shown"
    unit: vol points
    direction: Context dependent
    interpretation: Steep downside skew signals demand for crash protection.
    why_it_matters: Reveals tail-risk pricing.
    caveats: Definitions vary; always show the method.
    related_terms: [implied_volatility, tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

