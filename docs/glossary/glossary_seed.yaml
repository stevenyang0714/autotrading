    category: navigation
    short_definition: "Order preview, risk approval, broker status, fills and audit trail."
    full_definition: "Paper-trading order preview, explicit approval, broker adapter status, fills, reconciliation and the full decision trace; live trading stays off until Phase 6 gates pass (ADR-008)."
    formula: "not a calculation; dashboard defined in build spec 02 §21"
    unit: page
    example: "An order shows its strategy, risk check and approval before it is sent to the paper broker."
    direction: N/A
    interpretation: "Planned for Phase 5; until then the page shows no data, live or simulated."
    why_it_matters: "Execution is gated by strategy eligibility, risk, liquidity and approval."
    source: "Build spec 02 §21; research report 01 §21; ROADMAP dashboard map"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/spec/02_master_build_prompt_v2.md
    as_of: "2026-10-05"
    update_cadence: per release
    caveats: "Contents arrive with Phase 5; scope can change through a roadmap update."
    related_terms: [planned_phase]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 0: SEC XBRL fundamentals (M0.5) ----------
  # Values as reported in 10-K / 10-Q XBRL, unadjusted. Concept priority per metric:
  # apps/api/src/autotrading/adapters/sec/concepts.py (ADR-013).
  - term_id: revenue
    display_name: Revenue
    category: fundamentals
    short_definition: Total sales the company reported for the period, before any costs.
    full_definition: "The top line of the income statement as tagged in the company's XBRL filing. The platform reads, in priority order, us-gaap RevenueFromContractWithCustomerExcludingAssessedTax (ASC 606, since 2018), Revenues, SalesRevenueNet (before 2018) and, for banks, RevenuesNetOfInterestExpense. Quarterly filings also report year-to-date periods; each period is stored separately."
    formula: "reported value of the highest-priority revenue concept in the filing, per period"
    unit: USD
    example: "Apple's FY2025 10-K (year ended 2025-09-27) reports revenue of $416.161 billion."
    direction: Higher = larger business; growth matters more than level
    interpretation: Compare like periods (quarter with quarter, year with year) and look at the change, not the level alone.
    why_it_matters: Revenue growth is the base of most fundamental and earnings analysis.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap revenue concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Concept changes across years (e.g. ASC 606 in 2018) can shift what is included; the source concept is kept with every value.
    related_terms: [gross_profit, operating_income, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: gross_profit
    display_name: Gross Profit
    category: fundamentals
    short_definition: Revenue minus the direct cost of the goods and services sold.
    full_definition: "Read from us-gaap GrossProfit as the company tagged it. Many companies, such as Alphabet, Meta and banks, do not report a gross profit line; the platform then shows it as unavailable and does not compute it from other lines."
    formula: "reported us-gaap:GrossProfit; equals revenue - cost of revenue when reported"
    unit: USD
    example: "Apple's FY2025 10-K reports gross profit of $195.201 billion."
    direction: Higher = more profit before operating expenses
    interpretation: Divide by revenue for gross margin; a falling margin can mean pricing pressure or rising input costs.
    why_it_matters: Shows how much each sale contributes before overheads, research and marketing.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:GrossProfit"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Not reported by every company; cost classification differs between companies.
    related_terms: [revenue, operating_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: operating_income
    display_name: Operating Income
    category: fundamentals
    short_definition: Profit from the core business after operating expenses, before interest and taxes.
    full_definition: "Read from us-gaap OperatingIncomeLoss as reported. Negative values are operating losses. Banks such as JPMorgan do not report this line; it is then unavailable."
    formula: "reported us-gaap:OperatingIncomeLoss"
    unit: USD
    example: "Apple's FY2025 10-K reports operating income of $133.050 billion."
    direction: Higher = more profitable operations
    interpretation: Divide by revenue for operating margin; compare with prior periods to see operating leverage.
    why_it_matters: Separates the profitability of the business from financing and tax effects.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:OperatingIncomeLoss"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: One-off charges are included as reported; no adjustments are made.
    related_terms: [revenue, net_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_income
    display_name: Net Income
    category: fundamentals
    short_definition: Profit attributable to the company's shareholders after all costs, interest and taxes.
    full_definition: "Read from us-gaap NetIncomeLoss, the amount attributable to the parent's shareholders. Profit including non-controlling interests (ProfitLoss) is a different concept and is not used."
    formula: "reported us-gaap:NetIncomeLoss"
    unit: USD
    example: "Apple's FY2025 10-K reports net income of $112.010 billion."
    direction: Higher = more profit for shareholders
    interpretation: Check one-off items and tax effects before reading a change as a trend.
    why_it_matters: The base of earnings per share and of most valuation multiples.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:NetIncomeLoss"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "A later filing may restate a past period (e.g. Apple's FY2008 net income was restated in a January 2010 10-K/A); both versions are kept."
    related_terms: [eps_diluted, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: eps_diluted
    display_name: Diluted EPS
    category: fundamentals
    short_definition: Net income per share, counting shares that options and convertibles could add.
    full_definition: "Read from us-gaap EarningsPerShareDiluted in USD per share as reported. Values tagged with another unit are ignored."
    formula: "reported us-gaap:EarningsPerShareDiluted (net income / diluted weighted average shares)"
    unit: USD per share
    example: "Apple's FY2025 10-K reports diluted EPS of $7.46."
    direction: Higher = more profit per share
    interpretation: Growth in EPS faster than net income means the share count is shrinking.
    why_it_matters: The per-share profit that price-to-earnings ratios and earnings surprises use.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:EarningsPerShareDiluted"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Stock splits change past EPS in later filings (Alphabet 20-for-1 in 2022); such changes are stored as new versions, not adjusted."
    related_terms: [net_income, diluted_shares, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: diluted_shares
    display_name: Diluted Shares
    category: fundamentals
    short_definition: Average number of shares in the period, including shares options and convertibles could add.
    full_definition: "Read from us-gaap WeightedAverageNumberOfDilutedSharesOutstanding. It is a weighted average over the period, not the count on the last day."
    formula: "reported us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding"
    unit: shares
    example: "Apple's FY2025 10-K reports 15,004,697,000 diluted weighted average shares."
    direction: Lower over time = more per-share value for holders
    interpretation: A falling count usually reflects buybacks exceeding dilution from stock compensation.
    why_it_matters: Shows whether buybacks actually reduce the share count after dilution.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Stock splits change past counts in later filings; companies with several share classes may tag only some periods.
    related_terms: [eps_diluted, share_repurchases, stock_based_compensation]
    methodology_version: 0.1.0
    status: complete

  - term_id: cash
    display_name: Cash and Cash Equivalents
    category: fundamentals
    short_definition: Cash and very short-term liquid investments on the balance sheet date.
    full_definition: "Read from us-gaap CashAndCashEquivalentsAtCarryingValue at the period end. Marketable securities and restricted cash are not included. Banks tag cash differently (e.g. cash and due from banks); those are not substituted."
    formula: "reported us-gaap:CashAndCashEquivalentsAtCarryingValue at period end"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports cash and cash equivalents of $35.934 billion."
    direction: Higher = more liquidity, not automatically better
    interpretation: Compare with debt due within a year; large companies often hold more in marketable securities than in cash.
    why_it_matters: Shows the immediate liquidity available for operations, buybacks and debt repayment.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:CashAndCashEquivalentsAtCarryingValue"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: A point-in-time balance; it can swing around quarter ends.
    related_terms: [long_term_debt_current, commercial_paper]
    methodology_version: 0.1.0
    status: complete

  - term_id: long_term_debt_noncurrent
    display_name: Long-Term Debt (non-current)
    category: fundamentals
    short_definition: Borrowings due after more than one year, on the balance sheet date.
    full_definition: "Read from us-gaap LongTermDebtNoncurrent, or LongTermDebtAndCapitalLeaseObligations when a company reports only that (it also includes finance lease obligations). One of three debt components the platform stores; total debt is derived from them in Phase 1 (ADR-013)."
    formula: "reported us-gaap:LongTermDebtNoncurrent, else us-gaap:LongTermDebtAndCapitalLeaseObligations"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports non-current term debt of $78.328 billion."
    direction: Higher = more leverage
    interpretation: Read together with the current portion, commercial paper and cash.
    why_it_matters: Leverage changes the risk of equity and the room for buybacks.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap long-term debt concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: The fallback concept includes finance leases; banks report debt differently and may show it as unavailable.
    related_terms: [long_term_debt_current, commercial_paper, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: long_term_debt_current
    display_name: Long-Term Debt (current portion)
    category: fundamentals
    short_definition: Part of long-term borrowings that falls due within one year.
    full_definition: "Read from us-gaap LongTermDebtCurrent, or LongTermDebtAndCapitalLeaseObligationsCurrent when a company reports only that. A debt component; total debt is derived in Phase 1 (ADR-013)."
    formula: "reported us-gaap:LongTermDebtCurrent, else us-gaap:LongTermDebtAndCapitalLeaseObligationsCurrent"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports current term debt of $12.350 billion."
    direction: Higher = more debt to repay or refinance soon
    interpretation: Compare with cash and operating cash flow to judge refinancing needs.
    why_it_matters: Near-term maturities are a liquidity risk when credit markets tighten.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap current long-term debt concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Not every company tags this line separately; missing means not reported, not zero.
    related_terms: [long_term_debt_noncurrent, commercial_paper, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: commercial_paper
    display_name: Commercial Paper
    category: fundamentals
    short_definition: Short-term unsecured borrowing, usually due within 270 days.
    full_definition: "Read from us-gaap CommercialPaper at the period end. Broader short-term borrowing lines are not substituted. A debt component; total debt is derived in Phase 1 (ADR-013)."
    formula: "reported us-gaap:CommercialPaper at period end"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports commercial paper of $7.979 billion."
    direction: Higher = more short-term funding
    interpretation: Large balances need continuous rollover; watch them when credit spreads widen.
    why_it_matters: Short-term funding can disappear quickly in a credit squeeze.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:CommercialPaper"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Many companies have none; missing means not reported, not necessarily zero.
    related_terms: [long_term_debt_current, long_term_debt_noncurrent, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: operating_cash_flow
    display_name: Operating Cash Flow
    category: fundamentals
    short_definition: Cash generated by the business's operations in the period.
    full_definition: "Read from us-gaap NetCashProvidedByUsedInOperatingActivities on the cash flow statement. Negative values mean operations used cash. Quarterly filings report year-to-date periods."
    formula: "reported us-gaap:NetCashProvidedByUsedInOperatingActivities"
    unit: USD
    example: "Apple's FY2025 10-K reports operating cash flow of $111.482 billion."
    direction: Higher = more cash from operations
    interpretation: Compare with net income; a large gap can point to working-capital swings or accounting accruals.
    why_it_matters: Cash, not accounting profit, funds buybacks, dividends and investment.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:NetCashProvidedByUsedInOperatingActivities"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "For banks it moves with trading assets and loans (JPMorgan's 2025 value is negative), so it is not comparable with industrial companies."
    related_terms: [capex, net_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: capex
    display_name: Capital Expenditure
    category: fundamentals
    short_definition: Cash paid for property, plant and equipment in the period.
    full_definition: "Read from us-gaap PaymentsToAcquirePropertyPlantAndEquipment, or PaymentsToAcquireProductiveAssets when a company reports only that (NVIDIA since 2019; it also includes intangible assets). Shown as a positive payment."
    formula: "reported us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, else us-gaap:PaymentsToAcquireProductiveAssets"
    unit: USD
    example: "Apple's FY2025 10-K reports $12.715 billion of payments for property, plant and equipment."
    direction: Higher = more investment, not automatically better
    interpretation: Operating cash flow minus capex approximates free cash flow; compare capex with depreciation for growth versus maintenance.
    why_it_matters: Investment needs compete with buybacks and dividends for the same cash.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap capital expenditure concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: The fallback concept includes intangible assets; banks usually do not report capex.
    related_terms: [operating_cash_flow]
    methodology_version: 0.1.0
    status: complete

  - term_id: share_repurchases
    display_name: Share Repurchases
    category: fundamentals
    short_definition: Cash the company paid to buy back its own common stock in the period.
    full_definition: "Read from us-gaap PaymentsForRepurchaseOfCommonStock on the cash flow statement: actual cash spent, not authorizations or announcements."
    formula: "reported us-gaap:PaymentsForRepurchaseOfCommonStock"
    unit: USD
    example: "Apple's FY2025 10-K reports $90.711 billion of common stock repurchases."
    direction: Higher = more capital returned, not automatically better
    interpretation: Compare with stock-based compensation and the change in diluted shares to see the net effect.
    why_it_matters: The base of buyback intensity and net share reduction in Phase 1.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:PaymentsForRepurchaseOfCommonStock"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Cash timing can differ from trade dates; excise taxes and accelerated programs can shift amounts between periods.
    related_terms: [diluted_shares, stock_based_compensation]
    methodology_version: 0.1.0
    status: complete

  - term_id: stock_based_compensation
    display_name: Stock-Based Compensation
    category: fundamentals
    short_definition: Non-cash expense for shares and options granted to employees in the period.
    full_definition: "Read from us-gaap ShareBasedCompensation (the add-back on the cash flow statement), or AllocatedShareBasedCompensationExpense when a company reports only that."
    formula: "reported us-gaap:ShareBasedCompensation, else us-gaap:AllocatedShareBasedCompensationExpense"
    unit: USD
    example: "Apple's FY2025 10-K reports $12.863 billion of share-based compensation."
    direction: Higher = more dilution pressure
    interpretation: Buybacks first offset this dilution; only repurchases beyond it reduce the share count.
    why_it_matters: Separates real buyback benefit from buybacks that only absorb employee grants.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap share-based compensation concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: The two concepts can differ slightly (e.g. capitalized amounts or tax effects).
    related_terms: [share_repurchases, diluted_shares]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 0: macro series (M0.6) ----------
  # FRED / ALFRED series in config/macro_series.yaml; values as published, with vintages (ADR-015).
  - term_id: page_macro
    display_name: Macro
    category: navigation
    short_definition: Key US macro series with every published revision, as known at a chosen date.
    full_definition: "System page listing the series in config/macro_series.yaml from FRED / ALFRED. Each series page shows recent observations as they were public at an As known on date, the vintage each value comes from, and the first release of values revised since. Charts follow in M0.9."
    formula: "not a calculation; reads GET /macro/series and /macro/series/{id}/observations"
    unit: page
    example: "Nonfarm payrolls as known on 2026-09-30 show August 2026 at 159,075 thousand; today the revised 159,015 thousand."
    direction: N/A
    interpretation: Check what a release said at the time before comparing it with today's revised figure.
    why_it_matters: Macro signals and backtests must use first releases, not later revisions.
    source: "Milestone M0.6 (FRED / ALFRED adapter)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-06"
    update_cadence: live (each page load); FRED data refreshed daily at 10:15 SGT
    caveats: Only the series in the registry; titles and units come from FRED.
    related_terms: [vintage, point_in_time, observation_date]
    methodology_version: 0.1.0
    status: complete

  - term_id: observation_date
    display_name: Observation Date
    category: macro
    short_definition: The date FRED uses to label a value; the first day of the period it covers.
    full_definition: "Monthly values are labelled with the first of the month, quarterly with the first day of the quarter, daily with the day itself. It is not the release date: August 2026 CPI is labelled 2026-08-01 and was released on 2026-09-11."
    formula: "FRED observation date = start of the period"
    unit: date
    example: "CPI for August 2026 is the observation 2026-08-01 (334.131)."
    direction: N/A
    interpretation: Read the label as the period, and the vintage as when it became public.
    why_it_matters: Confusing the period with the release date would let a backtest see data early.
    source: "FRED API documentation (observation dates)"
    source_url: https://fred.stlouisfed.org/docs/api/fred/series_observations.html
    as_of: "2026-10-06"
    update_cadence: per release
    caveats: Daily market series skip weekends and holidays; FRED marks missing days with a dot, which is not stored.
    related_terms: [vintage, reporting_period]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_cpi
    display_name: CPI (All Items)
    category: macro
    short_definition: Consumer price index for all urban consumers, all items, seasonally adjusted.
    full_definition: "The headline US consumer price index published monthly by the Bureau of Labor Statistics, as an index level (1982-84 = 100). Inflation is its percentage change over a period."
    formula: "FRED series CPIAUCSL, value as published in the vintage shown"
    unit: Index 1982-1984=100
    example: "August 2026: 334.131, released 2026-09-11."
    direction: Faster rise = more inflation
    interpretation: Compare the change over 12 months or annualized over 3 months, not the level.
    why_it_matters: Inflation drives Fed policy, rates and equity valuations.
    source: "U.S. Bureau of Labor Statistics via FRED (CPIAUCSL)"
    source_url: https://fred.stlouisfed.org/series/CPIAUCSL
    as_of: "2026-10-06"
    update_cadence: monthly
    caveats: "Seasonal factors are revised each February, which changes earlier months."
    related_terms: [macro_core_pce, vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_core_pce
    display_name: Core PCE Price Index
    category: macro
    short_definition: Price index of personal consumption expenditures excluding food and energy.
    full_definition: "The Federal Reserve's preferred inflation gauge, published monthly by the Bureau of Economic Analysis as an index level (2017 = 100)."
    formula: "FRED series PCEPILFE, value as published in the vintage shown"
    unit: Index 2017=100
    example: "August 2026: 130.455, released 2026-09-30."
    direction: Faster rise = more underlying inflation
    interpretation: The 12-month change is compared with the Fed's 2% inflation target.
    why_it_matters: It anchors the Fed's reading of underlying inflation.
    source: "U.S. Bureau of Economic Analysis via FRED (PCEPILFE)"
    source_url: https://fred.stlouisfed.org/series/PCEPILFE
    as_of: "2026-10-06"
    update_cadence: monthly
    caveats: "Revised with every release and in annual and comprehensive updates."
    related_terms: [macro_cpi, vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_unemployment_rate
    display_name: Unemployment Rate
    category: macro
    short_definition: Share of the labor force that is unemployed, seasonally adjusted.
    full_definition: "From the monthly household survey of the Bureau of Labor Statistics, released with the jobs report."
    formula: "FRED series UNRATE, value as published in the vintage shown"
    unit: Percent
    example: "September 2026: 4.2%, released 2026-10-02."
    direction: Higher = weaker labor market
    interpretation: A rise of half a point or more from its recent low has often come with recessions.
    why_it_matters: The labor market is half of the Fed's dual mandate.
    source: "U.S. Bureau of Labor Statistics via FRED (UNRATE)"
    source_url: https://fred.stlouisfed.org/series/UNRATE
    as_of: "2026-10-06"
    update_cadence: monthly
    caveats: "Seasonal factors are revised each January, which changes up to five years of history."
    related_terms: [macro_nonfarm_payrolls]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_nonfarm_payrolls
    display_name: Nonfarm Payrolls
    category: macro
    short_definition: Total employees on nonfarm payrolls in the US, in thousands, seasonally adjusted.
    full_definition: "From the monthly establishment survey of the Bureau of Labor Statistics. The monthly change is the headline jobs number; each month is revised in the next two releases and again in the annual benchmark."
    formula: "FRED series PAYEMS, value as published in the vintage shown"
    unit: Thousands of persons
    example: "August 2026: 159,075 thousand at first release (2026-09-04), revised to 159,015 thousand (2026-10-02)."
    direction: Higher = more jobs
    interpretation: Look at the monthly change and at how earlier months were revised.
    why_it_matters: Large revisions change the picture markets traded on at the time.
    source: "U.S. Bureau of Labor Statistics via FRED (PAYEMS)"
    source_url: https://fred.stlouisfed.org/series/PAYEMS
    as_of: "2026-10-06"
    update_cadence: monthly
    caveats: "First releases are often revised by tens of thousands; the annual benchmark can move the level further."
    related_terms: [macro_unemployment_rate, vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_real_gdp
    display_name: Real GDP
    category: macro
    short_definition: Inflation-adjusted gross domestic product, seasonally adjusted at an annual rate.
    full_definition: "Quarterly output of the US economy from the Bureau of Economic Analysis, in chained dollars. Each quarter is estimated three times (advance, second, third) and revised in annual updates."
    formula: "FRED series GDPC1, value as published in the vintage shown"
    unit: Billions of chained 2017 dollars, annual rate
    example: "Q2 2026: 24,408.011 billion, in the release of 2026-09-30."
    direction: Higher = larger economy
    interpretation: Growth is the annualized change from the previous quarter.
    why_it_matters: Defines expansions and recessions together with jobs data.
    source: "U.S. Bureau of Economic Analysis via FRED (GDPC1)"
    source_url: https://fred.stlouisfed.org/series/GDPC1
    as_of: "2026-10-06"
    update_cadence: quarterly
    caveats: "Comprehensive revisions can rebase the whole history to a new reference year."
    related_terms: [vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_fed_funds
    display_name: Fed Funds Rate
    category: macro
    short_definition: Monthly average of the effective federal funds rate.
    full_definition: "The rate banks charge each other for overnight reserves, which the Federal Reserve steers with its policy target range. FRED publishes the monthly average."
    formula: "FRED series FEDFUNDS, value as published in the vintage shown"
    unit: Percent
    example: "September 2026: 3.75%, released 2026-10-01."
    direction: Higher = tighter monetary policy
    interpretation: Compare with inflation for the real policy rate.
    why_it_matters: Sets the base cost of money for all other rates.
    source: "Board of Governors of the Federal Reserve System via FRED (FEDFUNDS)"
    source_url: https://fred.stlouisfed.org/series/FEDFUNDS
    as_of: "2026-10-06"
    update_cadence: monthly
    caveats: "A monthly average; the daily rate moves on the day of a policy decision."
    related_terms: [macro_treasury_2y]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_treasury_2y
    display_name: 2-Year Treasury Yield
    category: macro
    short_definition: Market yield on US Treasury securities at 2-year constant maturity.
    full_definition: "Daily yield from the Federal Reserve's H.15 release, quoted on an investment basis."
    formula: "FRED series DGS2, value as published in the vintage shown"
    unit: Percent
    example: "2026-10-01: 4.78%."
    direction: Higher = markets expect higher policy rates
    interpretation: Moves most with expectations for the Fed's next steps.
    why_it_matters: The market's view of the policy path over the next two years.
    source: "Board of Governors of the Federal Reserve System via FRED (DGS2)"
    source_url: https://fred.stlouisfed.org/series/DGS2
    as_of: "2026-10-06"
    update_cadence: daily (business days)
    caveats: "Published the next business day; holidays are missing."
    related_terms: [macro_treasury_10y, macro_curve_10y_2y, macro_fed_funds]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_treasury_10y
    display_name: 10-Year Treasury Yield
    category: macro
    short_definition: Market yield on US Treasury securities at 10-year constant maturity.
    full_definition: "Daily yield from the Federal Reserve's H.15 release, quoted on an investment basis."
    formula: "FRED series DGS10, value as published in the vintage shown"
    unit: Percent
    example: "2026-10-01: 5.24%."
    direction: Higher = tighter financial conditions
    interpretation: The benchmark discount rate for long-duration assets such as growth stocks.
    why_it_matters: Drives mortgage rates and equity valuations.
    source: "Board of Governors of the Federal Reserve System via FRED (DGS10)"
    source_url: https://fred.stlouisfed.org/series/DGS10
    as_of: "2026-10-06"
    update_cadence: daily (business days)
    caveats: "Published the next business day; holidays are missing."
    related_terms: [macro_treasury_2y, macro_curve_10y_2y]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_curve_10y_2y
    display_name: 10Y-2Y Treasury Spread
    category: macro
    short_definition: 10-year minus 2-year Treasury constant maturity yield.
    full_definition: "The slope of the Treasury yield curve. Negative values (an inverted curve) have preceded most US recessions."
    formula: "FRED series T10Y2Y, value as published in the vintage shown"
    unit: Percentage points
    example: "2026-10-02: 0.45 percentage points."
    direction: Lower or negative = more recession risk priced
    interpretation: Watch the turn from inverted back to positive as well as the inversion itself.
    why_it_matters: A widely used recession and regime indicator.
    source: "Federal Reserve Bank of St. Louis (calculated from H.15) via FRED (T10Y2Y)"
    source_url: https://fred.stlouisfed.org/series/T10Y2Y
    as_of: "2026-10-06"
    update_cadence: daily (business days)
    caveats: "Signals have long and variable lead times."
    related_terms: [macro_treasury_2y, macro_treasury_10y]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_hy_oas
    display_name: High-Yield Credit Spread
    category: macro
    short_definition: Option-adjusted spread of the ICE BofA US High Yield Index over Treasuries.
    full_definition: "The extra yield investors demand to hold US high-yield corporate bonds instead of Treasuries."
    formula: "FRED series BAMLH0A0HYM2, value as published in the vintage shown"
    unit: Percent
    example: "2026-10-02: 3.10%."
    direction: Higher = more credit stress
    interpretation: Rapid widening often comes with equity drawdowns.
    why_it_matters: A fast gauge of credit conditions and risk appetite.
    source: "ICE Data Indices via FRED (BAMLH0A0HYM2)"
    source_url: https://fred.stlouisfed.org/series/BAMLH0A0HYM2
    as_of: "2026-10-06"
    update_cadence: daily (business days)
    caveats: "ICE licensing limits FRED to about the last three years (from 2023-10-06 here); third-party copyright, personal use only."
    related_terms: [macro_vix]
    methodology_version: 0.1.0
    status: complete

  - term_id: macro_vix
    display_name: VIX
    category: macro
    short_definition: "CBOE Volatility Index: implied volatility of S&P 500 options over the next 30 days."
    full_definition: "Daily closing level of the VIX, computed by Cboe from S&P 500 option prices."
    formula: "FRED series VIXCLS, value as published in the vintage shown"
    unit: Index
    example: "2026-10-02 close: 15.31."
    direction: Higher = more expected volatility
    interpretation: Spikes mark stress; very low levels can mean complacency.
    why_it_matters: A standard measure of equity market fear.
    source: "Chicago Board Options Exchange via FRED (VIXCLS)"
    source_url: https://fred.stlouisfed.org/series/VIXCLS
    as_of: "2026-10-06"
    update_cadence: daily (business days)
    caveats: "Third-party copyright, personal use only; an index level, not a percentage."
    related_terms: [macro_hy_oas]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 0: overview indicators and system pages (M0.6, ADR-016) ----------
  - term_id: cpi_inflation_yoy
    display_name: "CPI Inflation (y/y)"
    category: macro_indicator
    short_definition: "Change in the consumer price index over the last 12 months, in percent."
    full_definition: "Computed from the CPI values known at the chosen time: the latest month against the same month a year earlier. Labelled above, at or below the Fed's 2% target after rounding to one decimal."
    formula: "(CPI latest month / CPI same month a year earlier - 1) x 100"
    unit: "percent"
    example: "August 2026: 3.4% (3.35%)."
    direction: "Higher = faster inflation"
    interpretation: "Compare with core PCE and with the 2% target; CPI usually runs above PCE."
    why_it_matters: "Headline inflation drives rate expectations and real returns."
    source: "Computed from FRED CPIAUCSL (BLS)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "monthly"
    caveats: "The Fed's 2% target refers to PCE, not CPI; the comparison is a reference point."
    related_terms: [macro_cpi, core_pce_inflation_yoy]
    methodology_version: 0.1.0
    status: complete

  - term_id: core_pce_inflation_yoy
    display_name: "Core PCE Inflation (y/y)"
    category: macro_indicator
    short_definition: "Change in the core PCE price index over the last 12 months, in percent."
    full_definition: "The Federal Reserve's preferred inflation gauge, computed from the core PCE values known at the chosen time. Labelled above, at or below the 2% target after rounding to one decimal."
    formula: "(core PCE latest month / same month a year earlier - 1) x 100"
    unit: "percent"
    example: "August 2026: 3.0% (3.01%); as known on 2026-09-30, July 2026 was 3.3%."
    direction: "Higher = faster underlying inflation"
    interpretation: "Above 2% means inflation is running over the Fed's target."
    why_it_matters: "The anchor of the Fed's inflation reading and of the real policy rate here."
    source: "Computed from FRED PCEPILFE (BEA)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "monthly"
    caveats: "Each release revises earlier months, so the value as known at a date can differ from today's."
    related_terms: [macro_core_pce, real_fed_funds_rate]
    methodology_version: 0.1.0
    status: complete

  - term_id: payrolls_monthly_change
    display_name: "Payroll Change"
    category: macro_indicator
    short_definition: "Monthly change in nonfarm payrolls: the headline jobs number, in thousands."
    full_definition: "The latest month of nonfarm payrolls minus the month before, both as known at the chosen time."
    formula: "PAYEMS latest month - PAYEMS previous month"
    unit: "thousands of jobs"
    example: "September 2026: +29K."
    direction: "Higher = more jobs added"
    interpretation: "Read with the revision to the previous month and the unemployment rate."
    why_it_matters: "The most watched monthly labor market number."
    source: "Computed from FRED PAYEMS (BLS)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "monthly"
    caveats: "The first estimate is often revised by tens of thousands in the next two releases."
    related_terms: [macro_nonfarm_payrolls, payrolls_prior_month_revision]
    methodology_version: 0.1.0
    status: complete

  - term_id: payrolls_prior_month_revision
    display_name: "Prior-Month Payroll Revision"
    category: macro_indicator
    short_definition: "How much the previous month's payrolls moved from their first release, in thousands."
    full_definition: "The previous month's payroll level as known at the chosen time minus its first released level (its earliest ALFRED vintage). Negative means revised down."
    formula: "PAYEMS previous month (current vintage) - PAYEMS previous month (first vintage)"
    unit: "thousands of jobs"
    example: "August 2026: first released at 159,075K on 2026-09-04, now 159,015K: -60K."
    direction: "Negative = earlier strength overstated"
    interpretation: "Repeated downward revisions mean the first prints were too optimistic."
    why_it_matters: "Markets trade the first release; revisions show what they got wrong."
    source: "Computed from ALFRED vintages of PAYEMS (BLS)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "monthly"
    caveats: "Needs the first vintage of that month; months published before the ALFRED archive have none."
    related_terms: [payrolls_monthly_change, vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: sahm_rule_indicator
    display_name: "Sahm Rule Indicator"
    category: macro_indicator
    short_definition: "Rise in the 3-month average unemployment rate above its low of the previous 12 months."
    full_definition: "Claudia Sahm's recession indicator: the 3-month average of the unemployment rate minus the lowest 3-month average of the previous 12 months, in percentage points. A reading of 0.50 or more has marked the start of every US recession since 1970."
    formula: "avg3(UNRATE latest) - min(avg3 over the previous 12 months)"
    unit: "percentage points"
    example: "September 2026: 0.00 pp, below the 0.50 trigger."
    direction: "Higher = labor market deteriorating"
    interpretation: "0.50 or more is labelled triggered."
    why_it_matters: "A simple, real-time recession signal."
    source: "Computed from FRED UNRATE (BLS); rule by Claudia Sahm (2019)"
    source_url: https://fred.stlouisfed.org/series/SAHMREALTIME
    as_of: "2026-10-06"
    update_cadence: "monthly"
    caveats: "A rule of thumb, not a forecast; it has given false signals, and it uses values as known then, not later revisions."
    related_terms: [macro_unemployment_rate]
    methodology_version: 0.1.0
    status: complete

  - term_id: real_gdp_growth_annualized
    display_name: "Real GDP Growth (annualized)"
    category: macro_indicator
    short_definition: "Quarter-on-quarter growth of real GDP, expressed at an annual rate, in percent."
    full_definition: "The latest quarter's real GDP against the previous quarter, compounded to a yearly rate, from the estimates known at the chosen time."
    formula: "((GDP latest quarter / GDP previous quarter)^4 - 1) x 100"
    unit: "percent"
    example: "Q2 2026: 2.2% today; as known on 2026-09-30 it was 1.5%."
    direction: "Higher = faster growth"
    interpretation: "Negative is labelled contraction."
    why_it_matters: "The broadest measure of the economy's pace."
    source: "Computed from FRED GDPC1 (BEA)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "quarterly"
    caveats: "Advance estimates are revised twice within months and again in annual updates."
    related_terms: [macro_real_gdp]
    methodology_version: 0.1.0
    status: complete

  - term_id: real_fed_funds_rate
    display_name: "Real Fed Funds Rate"
    category: macro_indicator
    short_definition: "Fed funds rate minus core PCE inflation, in percentage points."
    full_definition: "The latest monthly effective fed funds rate minus the latest core PCE inflation over 12 months, both as known at the chosen time."
    formula: "FEDFUNDS latest month - core PCE inflation (y/y)"
    unit: "percentage points"
    example: "September 2026: 3.75% - 3.01% = +0.74 pp."
    direction: "Higher = tighter policy in real terms"
    interpretation: "Positive means the policy rate is above inflation."
    why_it_matters: "Shows how restrictive monetary policy is after inflation."
    source: "Computed from FRED FEDFUNDS and PCEPILFE"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "monthly"
    caveats: "The two inputs can refer to different months (core PCE is released later)."
    related_terms: [macro_fed_funds, core_pce_inflation_yoy]
    methodology_version: 0.1.0
    status: complete

  - term_id: yield_curve_inversion
    display_name: "Yield Curve State"
    category: macro_indicator
    short_definition: "Whether the 10Y-2Y spread is below zero, and for how many trading days it has been on that side."
    full_definition: "Inverted when the 10-year minus 2-year Treasury spread is negative. The count goes back to the last change of sign in the stored data, and the date it started is shown."
    formula: "inverted = T10Y2Y < 0; streak = consecutive observations on the same side"
    unit: "label and trading days"
    example: "2026-10-02: positive for 518 trading days, since 2024-09-06."
    direction: "Inverted = recession risk priced"
    interpretation: "The turn from inverted back to positive has often come shortly before recessions."
    why_it_matters: "A widely watched regime and recession signal."
    source: "Computed from FRED T10Y2Y"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "daily (business days)"
    caveats: "If the streak reaches the first stored observation, it may be longer than shown."
    related_terms: [macro_curve_10y_2y]
    methodology_version: 0.1.0
    status: complete

  - term_id: hy_oas_percentile
    display_name: "HY Spread Percentile"
    category: macro_indicator
    short_definition: "Where today's high-yield credit spread ranks in its available history, from 0 to 100."
    full_definition: "Share of stored observations of the ICE BofA US High Yield OAS that are at or below the latest one. Labelled low below the 25th percentile and high above the 75th."
    formula: "count(values <= latest) / count(values) x 100"
    unit: "percentile"
    example: "2026-10-02: 3.10%, 57th percentile since 2023-10-06 (mid-range)."
    direction: "Higher = wider spreads, more credit stress"
    interpretation: "Low means credit is priced tightly by recent standards."
    why_it_matters: "Credit spreads often widen before equity drawdowns."
    source: "Computed from FRED BAMLH0A0HYM2 (ICE)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "daily (business days)"
    caveats: "History on FRED only goes back about three years (ICE licensing), so the ranking is short-term."
    related_terms: [macro_hy_oas, vix_percentile_1y]
    methodology_version: 0.1.0
    status: complete

  - term_id: vix_percentile_1y
    display_name: "VIX Percentile (1y)"
    category: macro_indicator
    short_definition: "Where today's VIX ranks among its closes of the last 12 months, from 0 to 100."
    full_definition: "Share of VIX closes in the last 365 days that are at or below the latest close. Labelled low below the 25th percentile and high above the 75th."
    formula: "count(closes in 12 months <= latest) / count(closes in 12 months) x 100"
    unit: "percentile"
    example: "2026-10-02: 15.31, 15th percentile (low)."
    direction: "Higher = more fear"
    interpretation: "Low can mean calm or complacency; high marks stress."
    why_it_matters: "Puts the VIX level in recent context."
    source: "Computed from FRED VIXCLS (Cboe)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/indicators.py
    as_of: "2026-10-06"
    update_cadence: "daily (business days)"
    caveats: "A one-year window ranks against recent conditions only."
    related_terms: [macro_vix, hy_oas_percentile]
    methodology_version: 0.1.0
    status: complete

  - term_id: rule_insight
    display_name: "Insight (rule-based)"
    category: macro_indicator
    short_definition: "One sentence per overview block, built from fixed rules on reported data."
    full_definition: "Each sentence is a template filled with computed indicators and the latest values known at the chosen time; labels such as above target, triggered or low come from thresholds stated in the indicator's glossary entry. The observations and vintages used are listed under the sentence. No language model writes or interprets them."
    formula: "template(indicators, thresholds); inputs listed with their vintages"
    unit: "text"
    example: "Payrolls +29K in Sep 2026; Aug 2026 revised -60K from its first release."
    direction: "N/A"
    interpretation: "A factual summary, not a forecast or a recommendation."
    why_it_matters: "Reads the dashboard in one line while staying traceable to the data."
    source: "apps/api/src/autotrading/api/overview.py (ADR-016)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/api/overview.py
    as_of: "2026-10-06"
    update_cadence: "live (each page load)"
    caveats: "Only as current as the data shown; thresholds are reference points, not signals."
    related_terms: [page_overview, vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: price_change_1d
    display_name: "Day Change"
    category: market_data
    short_definition: "Change of the last price against the previous close on the same feed, in percent."
    full_definition: "Live: the latest IEX trade against IEX's previous-day close. For a past date: the consolidated close against the close before it."
    formula: "(last price / previous close - 1) x 100"
    unit: "percent"
    example: "SPY +0.66% on 2026-10-05 (774.74 against 769.65, IEX)."
    direction: "Higher = rose more today"
    interpretation: "Read with the feed status; an IEX close can differ slightly from the official close."
    why_it_matters: "The day's move puts news and macro releases in context."
    source: "Computed from Alpaca Market Data"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/prices.py
    as_of: "2026-10-06"
    update_cadence: "every minute during US market hours"
    caveats: "Before the first trade of the day it shows the previous session's change."
    related_terms: [last_price, pct_below_52w_high]
    methodology_version: 0.1.0
    status: complete

  - term_id: pct_below_52w_high
    display_name: "Below 52-Week High"
    category: market_data
    short_definition: "How far the last price is below the highest close of the past year, in percent."
    full_definition: "The highest split-adjusted consolidated close of the last 52 weeks (or the last price, if higher), compared with the last price. For a past date, closes and splits known then only."
    formula: "(1 - last / max(closes in 52 weeks, last)) x 100"
    unit: "percent"
    example: "SPY 0.4% below its 52-week high on 2026-10-05."
    direction: "Higher = further below the high"
    interpretation: "0 means at a new 52-week high."
    why_it_matters: "A simple trend and drawdown context for a price."
    source: "Computed from Alpaca SIP daily bars"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/prices.py
    as_of: "2026-10-06"
    update_cadence: "daily (live price intraday)"
    caveats: "Split-adjusted, not dividend-adjusted."
    related_terms: [price_history, price_change_1d]
    methodology_version: 0.1.0
    status: complete

  - term_id: market_session
    display_name: "Market Session"
    category: market_data
    short_definition: "Whether the US stock market is open now, and when it next opens or last closed."
    full_definition: "NYSE regular hours, 09:30 to 16:00 New York time (13:00 on early-close days), on weekdays that are not exchange holidays. Holidays and early closes come from the NYSE calendar in config/market_calendar.yaml."
    formula: "weekday, not a holiday, 09:30 <= New York time < close"
    unit: "label"
    example: "Closed on 2026-11-26 (Thanksgiving); 13:00 close on 2026-11-27."
    direction: "N/A"
    interpretation: "Live prices update only while the session is open."
    why_it_matters: "Decides whether a quote should be live, end of day or stale."
    source: "NYSE holidays and trading hours"
    source_url: https://www.nyse.com/markets/hours-calendars
    as_of: "2026-10-06"
    update_cadence: "per session"
    caveats: "Pre-market and after-hours trading are not covered."
    related_terms: [feed_status, next_refresh]
    methodology_version: 0.1.0
    status: complete

  - term_id: price_history
    display_name: "Price History"
    category: market_data
    short_definition: "Daily closing prices of the past year, adjusted for stock splits."
    full_definition: "Consolidated (SIP) daily closes, split-adjusted. For a past date the series is re-based to the splits known then and stops at the last close that was public, so later splits and prices never leak into the view."
    formula: "split-adjusted SIP close per session, re-based to the as-of date"
    unit: "USD per share"
    example: "NVDA as known on 2024-06-07 shows closes near 1,209 USD; after its 10-for-1 split on 2024-06-10 the same days show near 121 USD."
    direction: "N/A"
    interpretation: "Compare shapes and levels within one series; dividends are not added back."
    why_it_matters: "Puts the last price in context of the past year."
    source: "Alpaca Market Data, SIP daily bars (ADR-017)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "daily (06:30 SGT)"
    caveats: "Split-adjusted only, not total return."
    related_terms: [pct_below_52w_high, last_price]
    methodology_version: 0.1.0
    status: complete

  - term_id: page_overview
    display_name: "Overview"
    category: navigation
    short_definition: "The home dashboard: the US macro picture in six blocks, with charts and rule-based insights."
    full_definition: "Inflation, labor, growth, policy rates, yield curve and risk, each with its latest values, computed indicators, a chart and one sentence built from fixed rules. Every sentence lists the observations and vintages it used, and an As known on date shows the dashboard as it could be computed then."
    formula: "not a calculation; reads GET /overview"
    unit: "page"
    example: "As known on 2026-09-30, the labor block reports August payrolls before their October revision."
    direction: "N/A"
    interpretation: "Start here for the macro picture, then open a series on the Macro page."
    why_it_matters: "One screen for the state of the economy, without look-ahead."
    source: "M0.6 overview (ADR-016)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load); FRED data refreshed daily at 10:15 SGT"
    caveats: "Insights are fixed rules on reported data, not forecasts or advice."
    related_terms: [page_macro, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: next_refresh
    display_name: "Next Refresh"
    category: data_quality
    short_definition: "When the platform will next fetch this source on its schedule."
    full_definition: "The next scheduled run of the source's daily refresh, in SGT and ET. Manual refreshes (make sec-refresh, make fred-refresh) can run at any time."
    formula: "next daily slot after now (SEC 10:00 SGT, FRED 10:15 SGT)"
    unit: "timestamp"
    example: "FRED at 10:15 SGT is 22:15 ET the previous evening."
    direction: "N/A"
    interpretation: "Data newer than the source's own release cannot arrive before this time."
    why_it_matters: "Tells you how current the data can be."
    source: "apps/api/src/autotrading/ingestion/schedule.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/ingestion/schedule.py
    as_of: "2026-10-06"
    update_cadence: "per source schedule"
    caveats: "Shown only for enabled, scheduled sources."
    related_terms: [data_freshness, data_age]
    methodology_version: 0.1.0
    status: complete

  - term_id: data_age
    display_name: "Data Age"
    category: data_quality
    short_definition: "Time since the source published the newest value shown."
    full_definition: "For a macro series, time since its newest vintage was released; for SEC data, time since the newest filing was accepted. Different from our last refresh, which is when we fetched it."
    formula: "now - publication time of the newest value"
    unit: "duration"
    example: "CPI for August 2026, released 2026-09-11: about 25 days old on 2026-10-06."
    direction: "Longer = older information"
    interpretation: "Monthly series are normally weeks old; daily ones a day or two."
    why_it_matters: "Separates a stale source from a source that simply publishes rarely."
    source: "Publication times from SEC and ALFRED (ADR-013, ADR-015)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "continuous"
    caveats: "Date-only releases count from the end of that day in New York."
    related_terms: [next_refresh, data_freshness, vintage]
    methodology_version: 0.1.0
    status: complete

  - term_id: page_progress
    display_name: "Build Progress"
    category: navigation
    short_definition: "Live view of the build: milestones, acceptance checks, current step, open decisions and the log."
    full_definition: "Parsed on every page load from the project documents (milestones, ROADMAP, STATUS and DECISIONS), so updates appear as soon as the documents change."
    formula: "not a calculation; reads GET /progress"
    unit: "page"
    example: "M0.6 shows 2 of 2 acceptance checks while its PR is pending."
    direction: "N/A"
    interpretation: "See what is done, what is in progress and what needs your decision."
    why_it_matters: "Keeps the build visible without reading the repository."
    source: "docs/STATUS.md and docs/milestones"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load)"
    caveats: "Reflects the documents, which are updated at the end of each step."
    related_terms: [milestone_status, open_decision, dev_log]
    methodology_version: 0.1.0
    status: complete

  - term_id: milestone_status
    display_name: "Milestone Status"
    category: navigation
    short_definition: "Acceptance checks ticked for a milestone, and whether it is done, in progress or not started."
    full_definition: "Done when every acceptance check is ticked and its PR is merged; in progress when some are ticked or it is the current sub-milestone; otherwise not started."
    formula: "ticked checkboxes / all checkboxes under the milestone"
    unit: "count"
    example: "M0.5: 3 of 3, done."
    direction: "Higher = closer to done"
    interpretation: "A milestone counts as done only after its PR is merged."
    why_it_matters: "Shows where Phase 0 stands."
    source: "docs/milestones/M0_foundation.md"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load)"
    caveats: "Milestones without checkboxes (e.g. reports) depend on STATUS only."
    related_terms: [page_progress]
    methodology_version: 0.1.0
    status: complete

  - term_id: open_decision
    display_name: "Open Decision"
    category: navigation
    short_definition: "A decision only you can make, with when it is needed and what happens until then."
    full_definition: "Rows of the open decisions table in DECISIONS.md (OD-n): the question, the milestone that needs it, and the default the build follows until you decide."
    formula: "from docs/decisions/DECISIONS.md"
    unit: "label"
    example: "OD-9: verify Alpaca eligibility from Singapore, needed before M0.7."
    direction: "N/A"
    interpretation: "Decisions due soon can block the next milestone."
    why_it_matters: "Nothing that needs your approval is decided silently."
    source: "docs/decisions/DECISIONS.md"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "per decision"
    caveats: "Shows the first sentence of each decision; the document has the details."
    related_terms: [page_progress]
    methodology_version: 0.1.0
    status: complete

  - term_id: dev_log
    display_name: "Development Log"
    category: navigation
    short_definition: "Dated entries of what each step delivered, newest first."
    full_definition: "The first sentence of each row in the log of docs/STATUS.md, written at the end of every step."
    formula: "from docs/STATUS.md"
    unit: "text"
    example: "2026-10-06, M0.6: Local acceptance passed."
    direction: "N/A"
    interpretation: "Read the full entry in STATUS.md for numbers and known gaps."
    why_it_matters: "A short audit trail of the build."
    source: "docs/STATUS.md"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/STATUS.md
    as_of: "2026-10-06"
    update_cadence: "per step"
    caveats: "Text is quoted from the document; numbers in it are not metrics."
    related_terms: [page_progress]
    methodology_version: 0.1.0
    status: complete

  # ---------- Later phases: v2 seed terms (02 §32.1) ----------
  - term_id: buyback_intensity
    display_name: Buyback Intensity
    category: corporate_action
    short_definition: Actual repurchases relative to market cap or FCF.
    formula: "Repurchase Value / Market Cap (or / FCF)"
    unit: "%"
    direction: Higher = more intensive, not automatically better
    interpretation: Scale of capital returned through repurchases.
    why_it_matters: Separates real buyback activity from announcements.
    caveats: Does not by itself imply undervaluation or future outperformance.
    related_terms: [net_share_reduction]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: net_share_reduction
    display_name: Net Share Reduction
    category: corporate_action
    short_definition: Share repurchase effect net of issuance and dilution.
    formula: "Buyback shares - dilution shares (SBC, issuance, option exercise)"
    unit: shares or %
    direction: Higher = greater per-share benefit
    interpretation: The buyback effect that actually reaches shareholders.
    why_it_matters: Gross buybacks can hide heavy SBC dilution.
    caveats: Depends on consistent diluted share counts across filings.
    related_terms: [buyback_intensity]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: thesis_score
    display_name: Thesis Score
    category: score
    short_definition: Strength of the economic or investment thesis.
    formula: "model-specific 0-100; versioned rule"
    unit: score 0-100
    direction: Higher = better
    interpretation: How well evidence supports the causal story.
    why_it_matters: Answers "why", separate from "when".
    caveats: Model output, not certainty.
    related_terms: [timing_score, execution_score, risk_score]
    update_cadence: per signal update
    methodology_version: 0.1.0
    status: seed

  - term_id: timing_score
    display_name: Timing Score
    category: score
    short_definition: Strength of current market confirmation.
    formula: "model-specific 0-100; versioned rule"
    unit: score 0-100
    direction: Higher = better
    interpretation: Whether price, volume or options currently support acting.
    why_it_matters: Answers "when", separate from valuation.
    caveats: Not a valuation measure.
    related_terms: [thesis_score, market_confirmation]
    update_cadence: daily / intraday
    methodology_version: 0.1.0
    status: seed

  - term_id: execution_score
    display_name: Execution Score
    category: score
    short_definition: Order quality based on liquidity, spread and risk.
    formula: "model-specific 0-100; versioned rule"
    unit: score 0-100
    direction: Higher = better
    interpretation: How cleanly a trade could be executed now.
    why_it_matters: Avoids good ideas with bad execution.
    caveats: Not a prediction of returns.
    related_terms: [thesis_score, risk_score]
    update_cadence: intraday
    methodology_version: 0.1.0
    status: seed

  - term_id: risk_score
    display_name: Risk Score
    category: score
    short_definition: Severity of risk a trade adds to the portfolio.
    formula: "model-specific 0-100; versioned rule"
    unit: score 0-100
    direction: Higher = worse
    interpretation: Higher values call for smaller size or no trade.
    why_it_matters: Feeds the risk gate, which can veto.
    caveats: Never average directly with positive-direction scores.
    related_terms: [thesis_score, var, expected_shortfall]
    update_cadence: per portfolio snapshot
    methodology_version: 0.1.0
    status: seed

  - term_id: disclosure_lag
    display_name: Disclosure Lag
    category: provenance
    short_definition: Delay between trade date and filing date.
    formula: "Filing Date - Trade Date"
    unit: days
    direction: Higher = staler
    interpretation: How old the information was when it became public.
    why_it_matters: Congress PTRs can be weeks old when published.
    caveats: Does not tell you the filer's current holdings.
    related_terms: [reported_trade]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: market_confirmation
    display_name: Market Confirmation
    category: signal
    short_definition: Extent to which price, volume or options support a thesis.
    formula: "model-specific; versioned rule"
    unit: score
    direction: Higher = more confirmation
    interpretation: The market is behaving consistently with the thesis.
    why_it_matters: Required for L3 trade candidates.
    caveats: Strong confirmation may mean the move is already priced in.
    related_terms: [timing_score, catalyst]
    update_cadence: daily / intraday
    methodology_version: 0.1.0
    status: seed

  - term_id: catalyst
    display_name: Catalyst
    category: signal
    short_definition: Future identifiable event that can reprice an asset.
    formula: "event + expected date window"
    unit: event/date
    direction: N/A
    interpretation: What could make the market recognize the thesis.
    why_it_matters: Defines the expected time window for a thesis.
    caveats: A catalyst is possible, not certain.
    related_terms: [invalidation, market_confirmation]
    update_cadence: per event
    methodology_version: 0.1.0
    status: seed

  - term_id: invalidation
    display_name: Invalidation
    category: risk
    short_definition: Condition that makes a thesis fail.
    formula: "explicit monitorable rule or threshold"
    unit: rule
    direction: N/A
    interpretation: If this happens, the thesis is wrong and the position is reviewed.
    why_it_matters: Every thesis must state what would prove it wrong.
    caveats: Must be monitorable with available data.
    related_terms: [catalyst]
    update_cadence: continuous
    methodology_version: 0.1.0
    status: seed

  - term_id: regime
    display_name: Regime
    category: macro
    short_definition: Current macro and market stress state.
    formula: "state machine: NORMAL | ELEVATED | HIGH | CRISIS"
    unit: state
    direction: N/A
    interpretation: Higher-stress states reduce new risk and raise hedging.
    why_it_matters: Changes position sizing and strategy eligibility.
    caveats: Detects fragility, does not predict black swans.
    related_terms: [tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: tail_risk
    display_name: Tail Risk
    category: risk
    short_definition: Low-probability, high-impact loss or fragility risk.
    formula: "risk class from stress indicators"
    unit: risk class
    direction: N/A
    interpretation: Describes vulnerability to extreme moves.
    why_it_matters: Drives hedging and gross exposure limits.
    caveats: Not a forecast of a specific event.
    related_terms: [regime, expected_shortfall]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: look_ahead_bias
    display_name: Look-ahead Bias
    category: methodology
    short_definition: Future information leaking into a historical test.
    formula: "validation failure"
    unit: concept
    direction: N/A
    interpretation: Inflates backtest results unrealistically.
    why_it_matters: Backtests with this bias cannot be trusted.
    caveats: Often subtle (e.g. using restated data or period end instead of filing date).
    related_terms: [point_in_time, survivorship_bias]
    update_cadence: N/A
    methodology_version: 0.1.0
    status: seed

  - term_id: survivorship_bias
    display_name: Survivorship Bias
    category: methodology
    short_definition: Excluding companies that were delisted or acquired.
    formula: "validation failure"
    unit: concept
    direction: N/A
    interpretation: Makes historical performance look better than reality.
    why_it_matters: Backtests need universes that include dead names.
    caveats: Requires a dataset with delisted securities (OD-7).
    related_terms: [look_ahead_bias, point_in_time]
    update_cadence: N/A
    methodology_version: 0.1.0
    status: seed

  - term_id: var
    display_name: VaR
    category: risk
    short_definition: Loss threshold not expected to be exceeded at a stated confidence over a horizon.
    formula: "distribution-dependent; method and confidence shown"
    unit: currency or %
    direction: Higher = more risk
    interpretation: A reference loss level, not the worst case.
    why_it_matters: Common portfolio risk limit input.
    caveats: Underestimates tail losses under non-normal returns.
    related_terms: [expected_shortfall, risk_score]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: expected_shortfall
    display_name: Expected Shortfall
    category: risk
    short_definition: Average loss beyond the VaR threshold.
    formula: "conditional tail loss; method and confidence shown"
    unit: currency or %
    direction: Higher = more risk
    interpretation: How bad losses are when they exceed VaR.
    why_it_matters: Better captures tail risk than VaR alone.
    caveats: Depends on distribution assumptions and sample.
    related_terms: [var, tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: gross_exposure
    display_name: Gross Exposure
    category: risk
    short_definition: Absolute long plus short market value relative to capital.
    formula: "sum(abs(market values)) / capital"
    unit: "%"
    direction: Higher = more leverage
    interpretation: Total size of positions regardless of direction.
    why_it_matters: Controls leverage.
    caveats: Says nothing about direction; see net exposure.
    related_terms: [net_exposure]
    update_cadence: per portfolio snapshot
    methodology_version: 0.1.0
    status: seed

  - term_id: net_exposure
    display_name: Net Exposure
    category: risk
    short_definition: Long minus short market value relative to capital.
    formula: "(long - short) / capital"
    unit: "%"
    direction: Higher = more directional (long)
    interpretation: How directional the portfolio is.
    why_it_matters: Main driver of market sensitivity.
    caveats: Ignores beta differences between positions.
    related_terms: [gross_exposure]
    update_cadence: per portfolio snapshot
    methodology_version: 0.1.0
    status: seed

  - term_id: implied_volatility
    display_name: Implied Volatility (IV)
    category: options
    short_definition: Volatility implied by option prices.
    formula: "inferred from option price via pricing model"
    unit: "% annualized"
    direction: Higher = more implied vol
    interpretation: Market's priced expectation of future movement.
    why_it_matters: Context for options trades, hedges and expected move.
    caveats: Affected by liquidity and model choice; differs from realized volatility.
    related_terms: [iv_percentile, skew]
    update_cadence: intraday
    methodology_version: 0.1.0
    status: seed

  - term_id: iv_percentile
    display_name: IV Percentile
    category: options
    short_definition: Current IV's percentile within its historical distribution.
    formula: "percentile(IV history over fixed window)"
    unit: "%"
    direction: Higher = more expensive relative context
    interpretation: Whether options are pricey versus their own history.
    why_it_matters: Helps choose between buying and selling volatility.
    caveats: Window length must be fixed and shown.
    related_terms: [implied_volatility]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: skew
    display_name: Skew
    category: options
    short_definition: Shape of implied volatility across strikes.
    formula: "surface-derived; method shown"
    unit: vol points
    direction: Context dependent
    interpretation: Steep downside skew signals demand for crash protection.
    why_it_matters: Reveals tail-risk pricing.
    caveats: Definitions vary; always show the method.
    related_terms: [implied_volatility, tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: reported_trade
    display_name: Reported Trade
    category: positioning
    short_definition: A publicly disclosed trade event (government or insider filing).
    formula: "official disclosure record"
    unit: event
    direction: N/A
    interpretation: Something was traded in the past and disclosed later.
    why_it_matters: Slow-moving idea input, never live copy-trading.
    caveats: Not a current position. Amounts are often ranges.
    related_terms: [disclosure_lag]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: policy_status
    display_name: Policy Status
    category: policy
    short_definition: Lifecycle stage of a policy action.
    formula: "state machine: statement | proposal | signed | effective | implementation | challenged_modified | expired_replaced"
    unit: state
    direction: N/A
    interpretation: Separates talk from enforceable rules.
    why_it_matters: Only effective or implemented policies enter causal models with full weight.
    caveats: Status can change through courts or revisions.
    related_terms: [catalyst]
    update_cadence: per official update
    methodology_version: 0.1.0
    status: seed
