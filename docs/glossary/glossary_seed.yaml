  - term_id: page_news
    display_name: "News"
    category: navigation
    short_definition: "English news and official releases about the universe, copies of one story collapsed."
    full_definition: "System page listing news from GDELT (discovery across many publishers) and official RSS feeds (SEC, Federal Reserve, BEA, the White House, and the newsrooms of Apple, NVIDIA, Microsoft, Meta and Google). Each row is one story with its copies; titles link to the original article. Filters: company, type (official, company announcement, media), source and tier; As known on shows what was public then. Only titles, links, times and short summaries are stored, never article text."
    formula: "not a calculation; reads GET /news"
    unit: "page"
    example: "Filtering NVDA shows the 2026-10-02 buyback story once, with the sites that carried it."
    direction: "N/A"
    interpretation: "Read the lead headline, then check its tier and how many independent stories exist."
    why_it_matters: "News explains moves and flags events; collapsing copies keeps one story from looking like many."
    source: "Milestone M0.8 (news adapter), minimal page pulled forward from M0.9"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load); GDELT hourly, feeds every 30 minutes"
    caveats: "GDELT can lag; company matching uses names in titles and can miss or mismatch. Tier 4 publishers are unverified leads."
    related_terms: [duplicate_group, story_count, source_tier, news_time_basis]
    methodology_version: 0.1.1
    status: complete

  - term_id: news_time_basis
    display_name: "News Time"
    category: data_quality
    short_definition: "Which clock a news time comes from: the publisher's, or when GDELT first saw the article."
    full_definition: "Feeds give the publisher's own publication time (publisher). GDELT gives only the time it first saw an article (first seen), which is never earlier than publication. Either way the time counts as when the item became known, so a past date never shows later news."
    formula: "enum: publisher | first_seen"
    unit: "label"
    example: "SEC press release published 2026-10-05 08:47 ET (publisher); an Nvidia article first seen by GDELT at 2026-10-02 08:45 UTC (first seen)."
    direction: "N/A"
    interpretation: "A first-seen time can be minutes to days after the article appeared."
    why_it_matters: "Point-in-time views must not show news before it was available."
    source: "ADR-018; GDELT DOC 2.0 seendate"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "per ingest"
    caveats: "GDELT's index can lag; its first-seen time then trails publication."
    related_terms: [point_in_time, page_news]
    methodology_version: 0.1.0
    status: complete

  - term_id: story_count
    display_name: "Stories"
    category: data_quality
    short_definition: "Number of distinct stories: duplicate groups, not articles."
    full_definition: "Counts each duplicate group once. Shown next to the number of articles, so syndication is visible: many articles in few stories means the same news repeated."
    formula: "count(distinct duplicate_group_id)"
    unit: "count"
    example: "NVDA news on 2026-10-02: one buyback story carried by several sites counts as 1 story."
    direction: "Higher = more distinct news"
    interpretation: "Use stories, not articles, when judging how widely something is reported."
    why_it_matters: "Independence counting (M0.8): a repost chain is one source, not many."
    source: "Milestone M0.8; GET /news"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/api/news.py
    as_of: "2026-10-06"
    update_cadence: "live (each page load)"
    caveats: "Depends on the duplicate grouping, which can over- or under-group."
    related_terms: [duplicate_group, page_news]
    methodology_version: 0.1.0
    status: complete

  - term_id: page_audit_log
    display_name: "Audit Log"
    category: navigation
    short_definition: "Every change the system made to its registries and facts: who, what, when, before and after."
    full_definition: "System page reading the append-only audit log written by database triggers. Inserts, updates and deletes of registry rows (sources, companies, instruments, identifiers, company relationships, macro series, dead letters) and supersedes of fact rows appear newest first, with the actor, the table, the object and, for an update, each changed field old and new. Filters: table, action, actor and dates. Read-only."
    formula: "not a calculation; reads GET /audit-log"
    unit: "page"
    example: "Filtering sources shows GDELT enabled on 2026-10-06 by config:sources.yaml: enabled false to true, rate limit 0.2 to 0.1 requests per second."
    direction: "N/A"
    interpretation: "Check what changed and who changed it before trusting a number that moved."
    why_it_matters: "An audit trail is a Phase 0 deliverable: no silent changes to sources or facts."
    source: "Milestone M0.9 (audit log viewer, ADR-019)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load)"
    caveats: "New fact versions (revisions) are inserts in their own tables, not audit rows; news, filings and quotes are append-only and not audited."
    related_terms: [audit_action, audit_actor, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: page_reconciliation
    display_name: "Reconciliation"
    category: navigation
    short_definition: "Each company's latest 10-K and 10-Q checked against the filing's own XBRL."
    full_definition: "System page listing, for every universe company, its latest 10-K and 10-Q reconciled with the XBRL instance SEC extracts from that filing: how many reported values were checked, matched, mismatched, missing or extra, and whether the balance identity, quarterly and split checks passed. Each filing opens its item list with the filing value and ours. Read-only."
    formula: "not a calculation; reads GET /reconciliation and /reconciliation/{accession}"
    unit: "page"
    example: "Apple's FY2025 10-K: 58 values checked, 58 matched, balance identity ok: pass."
    direction: "N/A"
    interpretation: "Start with fail and warn rows; open the filing to see which value and period differ."
    why_it_matters: "Evidence that stored financials equal what each company filed (Phase 1 exit criterion)."
    source: "Milestone M1.1 (filing reconciliation, ADR-021)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M1_fundamentals.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load); filings reconciled after each SEC refresh"
    caveats: "Only filings read from their own XBRL (each company's latest 10-K and 10-Q, and class-sum filings) are reconciled."
    related_terms: [filing_reconciliation, reconciliation_status, balance_identity]
    methodology_version: 0.1.0
    status: complete

  - term_id: filing_reconciliation
    display_name: "Filing Reconciliation"
    category: data_quality
    short_definition: "A filing's own XBRL values compared with the values we store for the same metric and period."
    full_definition: "For every mapped metric and period the filing reports (without dimensions, with the same concept priority as company facts, plus class sums), our value as known at the filing's acceptance time is compared with the filing's. Values that changed in a later filing are counted as restated later, not as errors. Also checks the balance identity, quarters differenced from year-to-date values against the reported quarter, and split-like restatements."
    formula: "per metric and period: filing value vs stored value as known at acceptance"
    unit: "label"
    example: "Apple FY2025 revenue: filing 416,161,000,000 USD, stored 416,161,000,000 USD (10-K 0000320193-25-000079): match."
    direction: "N/A"
    interpretation: "A mismatch, missing or extra value is a data problem to investigate; restated later is expected history."
    why_it_matters: "Proves the store reflects the filings, independently of SEC's company facts API."
    source: "SEC EDGAR filing XBRL instances (www.sec.gov/Archives)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/reconciliation.py
    as_of: "2026-10-06"
    update_cadence: "after each SEC refresh, once per filing and methodology version"
    caveats: "Company-specific concepts and dimensional facts beyond share classes are not compared."
    related_terms: [reconciliation_status, balance_identity, accession_number]
    methodology_version: 0.1.0
    status: complete

  - term_id: reconciliation_status
    display_name: "Reconciliation Status"
    category: data_quality
    short_definition: "The outcome of a filing reconciliation: pass, warn or fail."
    full_definition: "fail: a value mismatched, was missing or extra, or the balance identity failed. warn: only warnings, e.g. a quarter differenced from the values known at the filing differs from the reported quarter beyond rounding (an earlier quarter revised inside a later 10-Q), or a split-like restatement no recorded split explains. pass: everything agreed. Item statuses: match, mismatch, missing, extra, restated later, ok, fail, flag."
    formula: "fail if any mismatch, missing, extra or failed identity; else warn if any flag; else pass"
    unit: "label"
    example: "JPMorgan's Q2 2020 10-Q: warn, because Q1 2020 was revised inside it."
    direction: "N/A"
    interpretation: "fail needs action; warn needs a look; restated later alone still passes."
    why_it_matters: "Separates data errors from known timing effects."
    source: "Milestone M1.1 (ADR-021)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/reconciliation.py
    as_of: "2026-10-06"
    update_cadence: "per reconciliation"
    caveats: "A quarter is allowed one rounding unit of difference (Meta rounds each figure to millions)."
    related_terms: [filing_reconciliation]
    methodology_version: 0.1.0
    status: complete

  - term_id: balance_identity
    display_name: "Balance Identity"
    category: data_quality
    short_definition: "Total assets equal total liabilities plus equity on every balance-sheet date."
    full_definition: "Checked from the filing's own XBRL on every date it reports both us-gaap Assets and LiabilitiesAndStockholdersEquity. A failure means the filing's XBRL itself is inconsistent or was read wrongly."
    formula: "Assets = LiabilitiesAndStockholdersEquity"
    unit: "label"
    example: "Apple at 2025-09-27: assets and liabilities plus equity both 359,241,000,000 USD: ok."
    direction: "N/A"
    interpretation: "Should always hold; a failure points at the reader or the filing."
    why_it_matters: "A basic sanity check that the balance sheet was read completely."
    source: "SEC EDGAR filing XBRL instances"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/reconciliation.py
    as_of: "2026-10-06"
    update_cadence: "per reconciliation"
    caveats: "Not every filing tags both totals on every date; dates without both are skipped."
    related_terms: [filing_reconciliation]
    methodology_version: 0.1.0
    status: complete

  - term_id: audit_action
    display_name: "Audit Action"
    category: data_quality
    short_definition: "What happened to a row: insert, update, delete, or supersede (a fact replaced by a correction)."
    full_definition: "Written by the database trigger. insert: a new registry row. update: changed fields, each with its old and new value. delete: the removed row is kept in the log. supersede: a fact row was marked superseded by a correction. Each entry carries hashes of the row before and after."
    formula: "enum: insert | update | delete | supersede"
    unit: "label"
    example: "On 2026-10-06 the BLS feed's source row was updated: enabled true to false, access disabled."
    direction: "N/A"
    interpretation: "Updates and deletes on registries deserve a look; inserts are normal ingestion."
    why_it_matters: "Shows exactly how configuration and data changed over time."
    source: "Migration 0001 audit trigger (ADR-007)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "per change"
    caveats: "Fields such as updated_at and version change with every update."
    related_terms: [page_audit_log, audit_actor]
    methodology_version: 0.1.0
    status: complete

  - term_id: audit_actor
    display_name: "Actor"
    category: data_quality
    short_definition: "Who made a change: an ingestion job, a config sync, or a database user."
    full_definition: "Set per transaction by the code that writes: ingest:<source> for an ingestion job (ingest:sec_edgar), config:<file> for make migrate syncing a config file (config:sources.yaml), otherwise the database user."
    formula: "ingest:<source> | config:<file> | database user"
    unit: "label"
    example: "ingest:alpaca_iex created the ETF instruments such as XLK on 2026-10-06; config:sources.yaml records registry edits."
    direction: "N/A"
    interpretation: "An unexpected actor on a registry change is worth checking."
    why_it_matters: "Ties every change to the process that made it."
    source: "repositories/audit.py set_actor"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/repositories/audit.py
    as_of: "2026-10-06"
    update_cadence: "per change"
    caveats: "A single-user system: the actor is a process, not a person."
    related_terms: [page_audit_log, audit_action]
    methodology_version: 0.1.0
    status: complete

  - term_id: first_release_overlay
    display_name: "First Release"
    category: macro
    short_definition: "The value as first published, drawn next to the value known at the chosen date."
    full_definition: "For each observation, the value of its first vintage (ALFRED). Where a later vintage changed it, the macro chart shows both lines and marks the point; where nothing changed, the lines coincide. With As known on, only vintages public by then count."
    formula: "value of the earliest vintage per observation date"
    unit: "series units"
    example: "Nonfarm payrolls, August 2026: first released 159,075 thousand on 2026-09-04, revised to 159,015 thousand on 2026-10-02."
    direction: "N/A"
    interpretation: "A gap between the lines is a revision; large or repeated revisions mean early figures are less reliable."
    why_it_matters: "Signals and backtests must use what was known at the time, not later revisions."
    source: "FRED / ALFRED vintages (ADR-015)"
    source_url: https://alfred.stlouisfed.org/
    as_of: "2026-10-06"
    update_cadence: "per release"
    caveats: "ALFRED's archive starts at a different date per series; earlier values show their archive start as first release."
    related_terms: [vintage, point_in_time, page_macro]
    methodology_version: 0.1.0
    status: complete

