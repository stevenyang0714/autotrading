  # ---------- Phase 0: SEC XBRL fundamentals (M0.5) ----------
  # Values as reported in 10-K / 10-Q XBRL, unadjusted. Concept priority per metric:
  # apps/api/src/autotrading/adapters/sec/concepts.py (ADR-013).
  - term_id: revenue
    display_name: Revenue
    category: fundamentals
    short_definition: Total sales the company reported for the period, before any costs.
    full_definition: "The top line of the income statement as tagged in the company's XBRL filing. The platform reads, in priority order, us-gaap RevenueFromContractWithCustomerExcludingAssessedTax (ASC 606, since 2018), Revenues, SalesRevenueNet (before 2018) and, for banks, RevenuesNetOfInterestExpense. Quarterly filings also report year-to-date periods; each period is stored separately."
    formula: "reported value of the highest-priority revenue concept in the filing, per period"
    unit: USD
    example: "Apple's FY2025 10-K (year ended 2025-09-27) reports revenue of $416.161 billion."
    direction: Higher = larger business; growth matters more than level
    interpretation: Compare like periods (quarter with quarter, year with year) and look at the change, not the level alone.
    why_it_matters: Revenue growth is the base of most fundamental and earnings analysis.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap revenue concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Concept changes across years (e.g. ASC 606 in 2018) can shift what is included; the source concept is kept with every value.
    related_terms: [gross_profit, operating_income, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: gross_profit
    display_name: Gross Profit
    category: fundamentals
    short_definition: Revenue minus the direct cost of the goods and services sold.
    full_definition: "Read from us-gaap GrossProfit as the company tagged it. Many companies, such as Alphabet, Meta and banks, do not report a gross profit line; the platform then shows it as unavailable and does not compute it from other lines."
    formula: "reported us-gaap:GrossProfit; equals revenue - cost of revenue when reported"
    unit: USD
    example: "Apple's FY2025 10-K reports gross profit of $195.201 billion."
    direction: Higher = more profit before operating expenses
    interpretation: Divide by revenue for gross margin; a falling margin can mean pricing pressure or rising input costs.
    why_it_matters: Shows how much each sale contributes before overheads, research and marketing.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:GrossProfit"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Not reported by every company; cost classification differs between companies.
    related_terms: [revenue, operating_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: operating_income
    display_name: Operating Income
    category: fundamentals
    short_definition: Profit from the core business after operating expenses, before interest and taxes.
    full_definition: "Read from us-gaap OperatingIncomeLoss as reported. Negative values are operating losses. Banks such as JPMorgan do not report this line; it is then unavailable."
    formula: "reported us-gaap:OperatingIncomeLoss"
    unit: USD
    example: "Apple's FY2025 10-K reports operating income of $133.050 billion."
    direction: Higher = more profitable operations
    interpretation: Divide by revenue for operating margin; compare with prior periods to see operating leverage.
    why_it_matters: Separates the profitability of the business from financing and tax effects.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:OperatingIncomeLoss"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: One-off charges are included as reported; no adjustments are made.
    related_terms: [revenue, net_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_income
    display_name: Net Income
    category: fundamentals
    short_definition: Profit attributable to the company's shareholders after all costs, interest and taxes.
    full_definition: "Read from us-gaap NetIncomeLoss, the amount attributable to the parent's shareholders. Profit including non-controlling interests (ProfitLoss) is a different concept and is not used."
    formula: "reported us-gaap:NetIncomeLoss"
    unit: USD
    example: "Apple's FY2025 10-K reports net income of $112.010 billion."
    direction: Higher = more profit for shareholders
    interpretation: Check one-off items and tax effects before reading a change as a trend.
    why_it_matters: The base of earnings per share and of most valuation multiples.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:NetIncomeLoss"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "A later filing may restate a past period (e.g. Apple's FY2008 net income was restated in a January 2010 10-K/A); both versions are kept."
    related_terms: [eps_diluted, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: eps_diluted
    display_name: Diluted EPS
    category: fundamentals
    short_definition: Net income per share, counting shares that options and convertibles could add.
    full_definition: "Read from us-gaap EarningsPerShareDiluted in USD per share as reported. Values tagged with another unit are ignored."
    formula: "reported us-gaap:EarningsPerShareDiluted (net income / diluted weighted average shares)"
    unit: USD per share
    example: "Apple's FY2025 10-K reports diluted EPS of $7.46."
    direction: Higher = more profit per share
    interpretation: Growth in EPS faster than net income means the share count is shrinking.
    why_it_matters: The per-share profit that price-to-earnings ratios and earnings surprises use.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:EarningsPerShareDiluted"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Stock splits change past EPS in later filings (Alphabet 20-for-1 in 2022); such changes are stored as new versions, not adjusted."
    related_terms: [net_income, diluted_shares, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: diluted_shares
    display_name: Diluted Shares
    category: fundamentals
    short_definition: Average number of shares in the period, including shares options and convertibles could add.
    full_definition: "Read from us-gaap WeightedAverageNumberOfDilutedSharesOutstanding. It is a weighted average over the period, not the count on the last day."
    formula: "reported us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding"
    unit: shares
    example: "Apple's FY2025 10-K reports 15,004,697,000 diluted weighted average shares."
    direction: Lower over time = more per-share value for holders
    interpretation: A falling count usually reflects buybacks exceeding dilution from stock compensation.
    why_it_matters: Shows whether buybacks actually reduce the share count after dilution.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Stock splits change past counts in later filings; companies with several share classes may tag only some periods.
    related_terms: [eps_diluted, share_repurchases, stock_based_compensation]
    methodology_version: 0.1.0
    status: complete

  - term_id: eps_basic
    display_name: Basic EPS
    category: fundamentals
    short_definition: Net income per share, counting only shares outstanding.
    full_definition: "Read from us-gaap EarningsPerShareBasic in USD per share as reported. Values tagged with another unit are ignored. Used to tell whether anything dilutes: where diluted EPS equals basic EPS for a period, the basic share count stands in for a diluted count the company does not tag (ADR-025 B11)."
    formula: "reported us-gaap:EarningsPerShareBasic (net income / basic weighted average shares)"
    unit: USD per share
    example: "ExxonMobil's FY2025 10-K reports basic and diluted EPS of $6.70."
    direction: Higher = more profit per share
    interpretation: Equal to diluted EPS when options and convertibles add no shares.
    why_it_matters: The gap to diluted EPS shows how much potential dilution there is.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:EarningsPerShareBasic"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-10"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Stock splits change past EPS in later filings; such changes are stored as new versions and adjusted to the As known on basis where compared."
    related_terms: [eps_diluted, basic_shares]
    methodology_version: 0.1.0
    status: complete

  - term_id: basic_shares
    display_name: Basic Shares
    category: fundamentals
    short_definition: Average number of shares outstanding in the period, without potential dilution.
    full_definition: "Read from us-gaap WeightedAverageNumberOfSharesOutstandingBasic. A weighted average over the period, not the count on the last day. Used as the diluted count only where the company tags no diluted count and its diluted EPS equals its basic EPS for the same period (ADR-025 B11)."
    formula: "reported us-gaap:WeightedAverageNumberOfSharesOutstandingBasic"
    unit: shares
    example: "ExxonMobil reports 4,298,000,000 basic weighted average shares for 2024."
    direction: Lower over time = more per-share value for holders
    interpretation: Below the diluted count by the shares options and convertibles could add.
    why_it_matters: The only weighted share count ExxonMobil tags after 2013.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:WeightedAverageNumberOfSharesOutstandingBasic"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-10"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Stock splits change past counts in later filings; companies with several share classes may tag only some periods.
    related_terms: [diluted_shares, eps_basic]
    methodology_version: 0.1.0
    status: complete

  - term_id: cash
    display_name: Cash and Cash Equivalents
    category: fundamentals
    short_definition: Cash and very short-term liquid investments on the balance sheet date.
    full_definition: "Read from us-gaap CashAndCashEquivalentsAtCarryingValue at the period end. Marketable securities and restricted cash are not included. Banks tag cash differently (e.g. cash and due from banks); those are not substituted."
    formula: "reported us-gaap:CashAndCashEquivalentsAtCarryingValue at period end"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports cash and cash equivalents of $35.934 billion."
    direction: Higher = more liquidity, not automatically better
    interpretation: Compare with debt due within a year; large companies often hold more in marketable securities than in cash.
    why_it_matters: Shows the immediate liquidity available for operations, buybacks and debt repayment.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:CashAndCashEquivalentsAtCarryingValue"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: A point-in-time balance; it can swing around quarter ends.
    related_terms: [long_term_debt_current, commercial_paper]
    methodology_version: 0.1.0
    status: complete

  - term_id: long_term_debt_noncurrent
    display_name: Long-Term Debt (non-current)
    category: fundamentals
    short_definition: Borrowings due after more than one year, on the balance sheet date.
    full_definition: "Read from us-gaap LongTermDebtNoncurrent, or LongTermDebtAndCapitalLeaseObligations when a company reports only that (it also includes finance lease obligations). One of three debt components the platform stores; total debt is derived from them in Phase 1 (ADR-013)."
    formula: "reported us-gaap:LongTermDebtNoncurrent, else us-gaap:LongTermDebtAndCapitalLeaseObligations"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports non-current term debt of $78.328 billion."
    direction: Higher = more leverage
    interpretation: Read together with the current portion, commercial paper and cash.
    why_it_matters: Leverage changes the risk of equity and the room for buybacks.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap long-term debt concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: The fallback concept includes finance leases; banks report debt differently and may show it as unavailable.
    related_terms: [long_term_debt_current, commercial_paper, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: long_term_debt_current
    display_name: Long-Term Debt (current portion)
    category: fundamentals
    short_definition: Part of long-term borrowings that falls due within one year.
    full_definition: "Read from us-gaap LongTermDebtCurrent, or LongTermDebtAndCapitalLeaseObligationsCurrent when a company reports only that. A debt component; total debt is derived in Phase 1 (ADR-013)."
    formula: "reported us-gaap:LongTermDebtCurrent, else us-gaap:LongTermDebtAndCapitalLeaseObligationsCurrent"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports current term debt of $12.350 billion."
    direction: Higher = more debt to repay or refinance soon
    interpretation: Compare with cash and operating cash flow to judge refinancing needs.
    why_it_matters: Near-term maturities are a liquidity risk when credit markets tighten.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap current long-term debt concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Not every company tags this line separately; missing means not reported, not zero.
    related_terms: [long_term_debt_noncurrent, commercial_paper, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: commercial_paper
    display_name: Commercial Paper
    category: fundamentals
    short_definition: Short-term unsecured borrowing, usually due within 270 days.
    full_definition: "Read from us-gaap CommercialPaper at the period end. Broader short-term borrowing lines are not substituted. A debt component; total debt is derived in Phase 1 (ADR-013)."
    formula: "reported us-gaap:CommercialPaper at period end"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports commercial paper of $7.979 billion."
    direction: Higher = more short-term funding
    interpretation: Large balances need continuous rollover; watch them when credit spreads widen.
    why_it_matters: Short-term funding can disappear quickly in a credit squeeze.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:CommercialPaper"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Many companies have none; missing means not reported, not necessarily zero.
    related_terms: [long_term_debt_current, long_term_debt_noncurrent, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: operating_cash_flow
    display_name: Operating Cash Flow
    category: fundamentals
    short_definition: Cash generated by the business's operations in the period.
    full_definition: "Read from us-gaap NetCashProvidedByUsedInOperatingActivities on the cash flow statement. Negative values mean operations used cash. Quarterly filings report year-to-date periods."
    formula: "reported us-gaap:NetCashProvidedByUsedInOperatingActivities"
    unit: USD
    example: "Apple's FY2025 10-K reports operating cash flow of $111.482 billion."
    direction: Higher = more cash from operations
    interpretation: Compare with net income; a large gap can point to working-capital swings or accounting accruals.
    why_it_matters: Cash, not accounting profit, funds buybacks, dividends and investment.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:NetCashProvidedByUsedInOperatingActivities"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "For banks it moves with trading assets and loans (JPMorgan's 2025 value is negative), so it is not comparable with industrial companies."
    related_terms: [capex, net_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: capex
    display_name: Capital Expenditure
    category: fundamentals
    short_definition: Cash paid for property, plant and equipment in the period.
    full_definition: "Read from us-gaap PaymentsToAcquirePropertyPlantAndEquipment, or PaymentsToAcquireProductiveAssets when a company reports only that (NVIDIA since 2019; it also includes intangible assets). Shown as a positive payment."
    formula: "reported us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, else us-gaap:PaymentsToAcquireProductiveAssets"
    unit: USD
    example: "Apple's FY2025 10-K reports $12.715 billion of payments for property, plant and equipment."
    direction: Higher = more investment, not automatically better
    interpretation: Operating cash flow minus capex approximates free cash flow; compare capex with depreciation for growth versus maintenance.
    why_it_matters: Investment needs compete with buybacks and dividends for the same cash.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap capital expenditure concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: The fallback concept includes intangible assets; banks usually do not report capex.
    related_terms: [operating_cash_flow]
    methodology_version: 0.1.0
    status: complete

  - term_id: share_repurchases
    display_name: Share Repurchases
    category: fundamentals
    short_definition: Cash the company paid to buy back its own common stock in the period.
    full_definition: "Read from us-gaap PaymentsForRepurchaseOfCommonStock on the cash flow statement: actual cash spent, not authorizations or announcements."
    formula: "reported us-gaap:PaymentsForRepurchaseOfCommonStock"
    unit: USD
    example: "Apple's FY2025 10-K reports $90.711 billion of common stock repurchases."
    direction: Higher = more capital returned, not automatically better
    interpretation: Compare with stock-based compensation and the change in diluted shares to see the net effect.
    why_it_matters: The base of buyback intensity and net share reduction in Phase 1.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:PaymentsForRepurchaseOfCommonStock"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: Cash timing can differ from trade dates; excise taxes and accelerated programs can shift amounts between periods.
    related_terms: [diluted_shares, stock_based_compensation]
    methodology_version: 0.1.0
    status: complete

  - term_id: stock_based_compensation
    display_name: Stock-Based Compensation
    category: fundamentals
    short_definition: Non-cash expense for shares and options granted to employees in the period.
    full_definition: "Read from us-gaap ShareBasedCompensation (the add-back on the cash flow statement), or AllocatedShareBasedCompensationExpense when a company reports only that."
    formula: "reported us-gaap:ShareBasedCompensation, else us-gaap:AllocatedShareBasedCompensationExpense"
    unit: USD
    example: "Apple's FY2025 10-K reports $12.863 billion of share-based compensation."
    direction: Higher = more dilution pressure
    interpretation: Buybacks first offset this dilution; only repurchases beyond it reduce the share count.
    why_it_matters: Separates real buyback benefit from buybacks that only absorb employee grants.
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap share-based compensation concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-05"
    update_cadence: per filing (10-Q, 10-K)
    caveats: The two concepts can differ slightly (e.g. capitalized amounts or tax effects).
    related_terms: [share_repurchases, diluted_shares]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: financial data completion (M1.1, ADR-021) ----------
  - term_id: shares_outstanding
    display_name: "Shares Outstanding (balance sheet)"
    category: fundamentals
    short_definition: "Common shares outstanding at the balance sheet date."
    full_definition: "Read from us-gaap CommonStockSharesOutstanding at the period end. Where a filing reports only one figure per share class (Meta's Class A and B), the classes are added from the filing's own XBRL, and the cell says so (sum of classes, ADR-021). Treasury shares are not included."
    formula: "reported us-gaap:CommonStockSharesOutstanding, else the sum of its common share classes in the filing"
    unit: shares
    example: "Apple's balance sheet at 2025-09-27 reports 14,773,260,000 shares outstanding."
    direction: "Lower over time = net share reduction, not automatically better"
    interpretation: "Compare across years to see whether buybacks actually shrink the share count after employee grants."
    why_it_matters: "The share count behind market capitalization and the net share reduction of the buyback engine."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:CommonStockSharesOutstanding; class sums from the filing's XBRL (www.sec.gov/Archives)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Splits change the count; the split-adjusted value is shown beside the reported one. Class sums are only made for inline XBRL filings since mid-2019."
    related_terms: [shares_outstanding_cover, diluted_shares]
    methodology_version: 0.1.0
    status: complete

  - term_id: shares_outstanding_cover
    display_name: "Shares Outstanding (cover page)"
    category: fundamentals
    short_definition: "Common shares outstanding on the latest practicable date before the filing, from its cover page."
    full_definition: "Read from dei EntityCommonStockSharesOutstanding: the count the company states on the cover of its 10-K or 10-Q, as of a date a few weeks after the period end. Where only per-class figures are tagged (Alphabet, Meta), the common classes are added from the filing's XBRL (ADR-021)."
    formula: "reported dei:EntityCommonStockSharesOutstanding, else the sum of its common share classes in the filing"
    unit: shares
    example: "Apple's FY2025 10-K cover reports 14,776,353,000 shares outstanding as of 2025-10-17."
    direction: "N/A"
    interpretation: "More recent than the balance-sheet count; the date shown is the cover date, not the period end."
    why_it_matters: "The most recent official share count available when the filing becomes public."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), dei:EntityCommonStockSharesOutstanding; class sums from the filing's XBRL (www.sec.gov/Archives)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Its date differs per filing, so it is shown as the latest value with its date rather than in the balance-sheet columns."
    related_terms: [shares_outstanding, diluted_shares]
    methodology_version: 0.1.0
    status: complete

  - term_id: shares_repurchased
    display_name: "Shares Repurchased"
    category: fundamentals
    short_definition: "Number of its own common shares the company bought back in the period."
    full_definition: "Read from us-gaap StockRepurchasedAndRetiredDuringPeriodShares, StockRepurchasedDuringPeriodShares or TreasuryStockSharesAcquired, in that order, from the statement of stockholders' equity. It counts shares actually bought, not authorized."
    formula: "reported us-gaap:StockRepurchasedAndRetiredDuringPeriodShares, else StockRepurchasedDuringPeriodShares, else TreasuryStockSharesAcquired"
    unit: shares
    example: "Apple's FY2025 10-K reports 402,000,000 shares repurchased and retired."
    direction: "Higher = more shares bought, not automatically better"
    interpretation: "Compare with shares issued to employees; only the excess reduces the share count."
    why_it_matters: "Separates actual repurchases from authorizations and announcements (errata E7)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap share repurchase concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Companies with several share classes tag repurchases per class (Alphabet, Meta and JPMorgan in recent filings); those stay unavailable. Split-adjusted beside the reported value."
    related_terms: [share_repurchases, shares_outstanding]
    methodology_version: 0.1.0
    status: complete

  - term_id: repurchase_authorized
    display_name: "Buyback Authorization"
    category: fundamentals
    short_definition: "Amount the board authorized for share repurchases, as of the authorization date."
    full_definition: "Read from srt StockRepurchaseProgramAuthorizedAmount1 (used since 2021), else us-gaap StockRepurchaseProgramAuthorizedAmount1 or StockRepurchaseProgramAuthorizedAmount. The date is the date the filing tags, usually the board approval. Programs tagged per program or class are not added together."
    formula: "reported srt:StockRepurchaseProgramAuthorizedAmount1, else us-gaap authorization concepts"
    unit: USD
    example: "NVIDIA's FY2025 10-K reports a $38.7 billion authorization dated 2025-01-26 (srt tag)."
    direction: "N/A"
    interpretation: "An authorization is permission, not spending; compare it with repurchases actually made."
    why_it_matters: "An announcement alone can reach WATCH at most in the buyback engine (errata E7)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), srt / us-gaap repurchase program concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Apple, Microsoft and Alphabet do not tag a current total authorization; Apple's tag is a cumulative total last tagged in 2021. It only corroborates the announcements read from 8-Ks and press releases (M1.4a), which are known when made rather than at the next 10-Q."
    related_terms: [repurchase_remaining, share_repurchases]
    methodology_version: 0.2.0
    status: complete

  - term_id: repurchase_remaining
    display_name: "Remaining Buyback Authorization"
    category: fundamentals
    short_definition: "Authorized buyback amount not yet used, at the date the filing states."
    full_definition: "Read from us-gaap StockRepurchaseProgramRemainingAuthorizedRepurchaseAmount1, else StockRepurchaseProgramRemainingAuthorizedRepurchaseAmount."
    formula: "reported us-gaap:StockRepurchaseProgramRemainingAuthorizedRepurchaseAmount1, else …Amount"
    unit: USD
    example: "Meta's 2025 10-K reports $25.03 billion remaining at 2025-12-31."
    direction: "N/A"
    interpretation: "Large remaining capacity relative to market value allows sustained buybacks; it is not a commitment."
    why_it_matters: "One input of the buyback WATCH state (remaining authorization versus market capitalization)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap remaining authorization concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Several companies (Apple, Microsoft, Alphabet, JPMorgan) do not tag it; missing means not reported."
    related_terms: [repurchase_authorized, share_repurchases]
    methodology_version: 0.1.0
    status: complete

  - term_id: depreciation_amortization
    display_name: "Depreciation and Amortization"
    category: fundamentals
    short_definition: "Non-cash charge for the use of fixed and intangible assets in the period."
    full_definition: "Read from us-gaap DepreciationDepletionAndAmortization, DepreciationAndAmortization or DepreciationAmortizationAndAccretionNet, in that order, as added back on the cash flow statement. A depreciation-only figure is not substituted."
    formula: "reported us-gaap:DepreciationDepletionAndAmortization, else DepreciationAndAmortization, else DepreciationAmortizationAndAccretionNet"
    unit: USD
    example: "Apple's FY2025 10-K reports $11.698 billion of depreciation and amortization."
    direction: "N/A"
    interpretation: "Compare with capex: capex well above D&A means the asset base is growing."
    why_it_matters: "An input of EBITDA and of maintenance-capex estimates in valuation (M1.2, M1.3)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap depreciation and amortization concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Microsoft tags it with its own concept and Alphabet reports depreciation only; both stay unavailable rather than approximated."
    related_terms: [capex, operating_cash_flow]
    methodology_version: 0.1.0
    status: complete

  - term_id: stockholders_equity
    display_name: "Stockholders' Equity"
    category: fundamentals
    short_definition: "Book value of the shareholders' claim on the company at the balance sheet date."
    full_definition: "Read from us-gaap StockholdersEquity: equity attributable to the parent's shareholders, excluding non-controlling interests."
    formula: "reported us-gaap:StockholdersEquity at period end"
    unit: USD
    example: "Apple's balance sheet at 2025-09-27 reports stockholders' equity of $73.733 billion."
    direction: "N/A"
    interpretation: "Buybacks reduce equity; a low or negative book value can reflect years of repurchases rather than losses."
    why_it_matters: "The base of price-to-book in M1.2."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:StockholdersEquity"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "AutoZone and O'Reilly have negative equity because of long buyback programs."
    related_terms: [shares_outstanding]
    methodology_version: 0.1.0
    status: complete

  - term_id: dividends_paid
    display_name: "Dividends Paid"
    category: fundamentals
    short_definition: "Cash paid to shareholders as dividends in the period."
    full_definition: "Read from us-gaap PaymentsOfDividendsCommonStock, else PaymentsOfDividends, on the cash flow statement."
    formula: "reported us-gaap:PaymentsOfDividendsCommonStock, else us-gaap:PaymentsOfDividends"
    unit: USD
    example: "Apple's FY2025 10-K reports $15.421 billion of dividends paid."
    direction: "Higher = more cash returned, not automatically better"
    interpretation: "Together with share repurchases it is the cash returned to shareholders."
    why_it_matters: "Separates dividends from buybacks when judging capital return and its funding."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap dividend payment concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "The fallback concept can include preferred dividends (JPMorgan). AutoZone and O'Reilly pay no dividend, so it is not reported."
    related_terms: [share_repurchases, operating_cash_flow]
    methodology_version: 0.1.0
    status: complete

  - term_id: interest_expense
    display_name: "Interest Expense"
    category: fundamentals
    short_definition: "Interest cost on borrowings recognized in the period."
    full_definition: "Read from us-gaap InterestExpenseNonoperating, InterestExpense or InterestExpenseDebt, in that order."
    formula: "reported us-gaap:InterestExpenseNonoperating, else InterestExpense, else InterestExpenseDebt"
    unit: USD
    example: "Microsoft's FY2026 10-K reports $3.051 billion of interest expense."
    direction: "Higher = more financing cost"
    interpretation: "Compare with operating income (coverage) and with total debt (implied cost of debt)."
    why_it_matters: "An input of the cost of debt and interest coverage in valuation (M1.3)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap interest expense concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Apple and Lowe's do not tag a separate current figure; for a bank interest expense is an operating cost, not financing."
    related_terms: [operating_income, long_term_debt_noncurrent]
    methodology_version: 0.1.0
    status: complete

  - term_id: income_tax_expense
    display_name: "Income Tax Expense"
    category: fundamentals
    short_definition: "Income tax charged against profit in the period."
    full_definition: "Read from us-gaap IncomeTaxExpenseBenefit (current plus deferred). A negative value is a tax benefit."
    formula: "reported us-gaap:IncomeTaxExpenseBenefit"
    unit: USD
    example: "Apple's FY2025 10-K reports $20.719 billion of income tax expense."
    direction: "N/A"
    interpretation: "Divided by pre-tax income it gives the effective tax rate; one-off items can move it sharply."
    why_it_matters: "An input of the tax rate assumed in DCF valuation (M1.3)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap:IncomeTaxExpenseBenefit"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Includes deferred tax, so it is not the cash tax paid."
    related_terms: [pretax_income, net_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: pretax_income
    display_name: "Pre-Tax Income"
    category: fundamentals
    short_definition: "Profit from continuing operations before income tax."
    full_definition: "Read from us-gaap IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, else the older concept that also excludes equity-method income."
    formula: "reported us-gaap pre-tax income from continuing operations"
    unit: USD
    example: "Apple's FY2025 10-K reports $132.729 billion of income before provision for income taxes."
    direction: "Higher = more profit"
    interpretation: "Use with income tax expense for the effective tax rate."
    why_it_matters: "An input of the effective tax rate in valuation (M1.3)."
    source: "SEC EDGAR XBRL company facts (data.sec.gov), us-gaap pre-tax income concepts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/concepts.py
    as_of: "2026-10-06"
    update_cadence: per filing (10-Q, 10-K)
    caveats: "Excludes discontinued operations."
    related_terms: [income_tax_expense, net_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: free_cash_flow
    display_name: "Free Cash Flow"
    category: fundamentals
    short_definition: "Operating cash flow minus capital expenditure for the period."
    full_definition: "Derived at read time from the operating cash flow and capex the same filing period reports, as known at the As known on time. Computed only when both are reported; a company without reported capex (a bank) has none, never an estimate (ADR-021)."
    formula: "operating_cash_flow - capex (same period)"
    unit: USD
    example: "Apple FY2025: $111.482 billion operating cash flow - $12.715 billion capex = $98.767 billion."
    direction: "Higher = more cash available after investment"
    interpretation: "Compare with buybacks and dividends: returning more than free cash flow is funded by cash or debt."
    why_it_matters: "The cash a company can return or use without borrowing; the funding test of the buyback engine (M1.4)."
    source: "Derived from SEC EDGAR XBRL operating_cash_flow and capex"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/derived.py
    as_of: "2026-10-06"
    update_cadence: "per filing (10-Q, 10-K); quarters from year-to-date values"
    caveats: "Capex fallbacks include intangible assets (NVIDIA); leases and acquisitions are not deducted."
    related_terms: [operating_cash_flow, capex]
    methodology_version: 0.1.0
    status: complete

  - term_id: total_debt
    display_name: "Total Debt"
    category: fundamentals
    short_definition: "Long-term debt (non-current and current portion) plus commercial paper on the balance sheet date."
    full_definition: "Derived at read time from the stored debt components. Non-current long-term debt is required. The current portion and commercial paper count as 0 when the balance sheet does not report them, and the value says which ones were counted as 0 (Steven's decision D4, ADR-021). Leases are not added beyond what the long-term debt fallback concept includes."
    formula: "long_term_debt_noncurrent + long_term_debt_current + commercial_paper (unreported short items as 0)"
    unit: USD
    example: "Apple at 2025-09-27: $78.328 billion + $12.350 billion + $7.979 billion = $98.657 billion."
    direction: "Higher = more leverage"
    interpretation: "Read with cash (net debt) and with free cash flow; check which components were counted as 0."
    why_it_matters: "The debt in enterprise value and in the balance-sheet check of the buyback engine."
    source: "Derived from SEC EDGAR XBRL debt components"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/derived.py
    as_of: "2026-10-06"
    update_cadence: "per filing (10-Q, 10-K)"
    caveats: "Short-term borrowings other than commercial paper are not included; banks have no comparable figure and show none."
    related_terms: [long_term_debt_noncurrent, long_term_debt_current, commercial_paper, net_debt]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_debt
    display_name: "Net Debt"
    category: fundamentals
    short_definition: "Total debt minus cash and cash equivalents on the balance sheet date."
    full_definition: "Derived at read time: total debt (above) minus cash and cash equivalents. Requires both. Marketable securities are not subtracted, so companies holding large securities portfolios show more net debt than a broader definition would."
    formula: "total_debt - cash"
    unit: USD
    example: "Apple at 2025-09-27: $98.657 billion - $35.934 billion = $62.723 billion."
    direction: "Higher = more leverage; negative = more cash than debt"
    interpretation: "Negative net debt means cash exceeds debt; compare with free cash flow to judge how fast debt could be repaid."
    why_it_matters: "The bridge from market capitalization to enterprise value (M1.2)."
    source: "Derived from SEC EDGAR XBRL debt components and cash"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/derived.py
    as_of: "2026-10-06"
    update_cadence: "per filing (10-Q, 10-K)"
    caveats: "Cash only: Apple's and Alphabet's marketable securities are not subtracted."
    related_terms: [total_debt, cash]
    methodology_version: 0.1.0
    status: complete

  - term_id: quarterly_derived_value
    display_name: "Quarterly Value (from year to date)"
    category: fundamentals
    short_definition: "A single quarter's value worked out from year-to-date figures in 10-Qs and the 10-K."
    full_definition: "10-Qs report flows year to date. Q1 is the three-month value; Q2 = six months - three months; Q3 = nine months - six months; Q4 = full year - nine months. Each quarter shows the two filings behind it. EPS and diluted shares are not differenced: only the three-month values the company reports are shown, and Q4 stays empty (ADR-021)."
    formula: "Q1 = YTD3; Q2 = YTD6 - YTD3; Q3 = YTD9 - YTD6; Q4 = FY - YTD9"
    unit: USD
    example: "Apple FY2025 revenue: Q2 = $219.659 billion (six months) - $124.300 billion (Q1) = $95.359 billion."
    direction: "N/A"
    interpretation: "The four quarters of a fiscal year add up to the annual figure by construction; a differenced quarter can absorb a restatement of an earlier quarter."
    why_it_matters: "Cash flows are only reported year to date, so quarterly cash flow and free cash flow need this."
    source: "Derived from SEC EDGAR XBRL year-to-date values"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/quarters.py
    as_of: "2026-10-06"
    update_cadence: "per filing (10-Q, 10-K)"
    caveats: "Fiscal years of 52 or 53 weeks give one 14-week quarter; a missing year-to-date value leaves its quarters empty."
    related_terms: [trailing_twelve_months, operating_cash_flow]
    methodology_version: 0.1.0
    status: complete

  - term_id: trailing_twelve_months
    display_name: "Trailing Twelve Months (TTM)"
    category: fundamentals
    short_definition: "The sum of the four latest consecutive quarters of a flow."
    full_definition: "Adds the four latest quarters (quarterly_derived_value) when they follow one another without a gap. Only flows (revenue, profit, cash flows) are summed; EPS and share counts are not."
    formula: "sum of the last 4 consecutive quarterly values"
    unit: USD
    example: "Apple revenue TTM to 2025-12-27: $95.359 + $94.036 + $102.466 + $143.756 billion = $435.617 billion."
    direction: "N/A"
    interpretation: "Smooths seasonality and is more current than the last fiscal year."
    why_it_matters: "The base of trailing multiples in valuation (M1.2)."
    source: "Derived from SEC EDGAR XBRL quarterly values"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/quarters.py
    as_of: "2026-10-06"
    update_cadence: "per filing (10-Q, 10-K)"
    caveats: "Empty when one of the four quarters cannot be derived."
    related_terms: [quarterly_derived_value]
    methodology_version: 0.1.0
    status: complete

  - term_id: split_adjusted
    display_name: "Split-Adjusted Value"
    category: fundamentals
    short_definition: "A per-share amount or share count restated to today's share basis after later stock splits."
    full_definition: "A reported value is on the share basis of its filing date. For every split effective after that filing and by the As known on time, share counts are multiplied and per-share amounts divided by the split ratio. The reported value stays visible; the adjusted one is shown beside it with the splits applied (ADR-021)."
    formula: "share counts x product(split ratios after the filing); per-share amounts / product(split ratios)"
    unit: label
    example: "Apple FY2017 diluted EPS: reported $9.21 in 2017; after the 2020 4-for-1 split, $9.21 / 4 = $2.3025."
    direction: "N/A"
    interpretation: "Use the adjusted value to compare per-share history across a split; the reported value shows what investors saw at the time."
    why_it_matters: "Without it, a split looks like a 75% fall in EPS and a fourfold rise in shares."
    source: "Splits from Alpaca corporate actions (2016 on) and config/splits.yaml (earlier, citing the 8-K)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/splits.py
    as_of: "2026-10-06"
    update_cadence: "on read"
    caveats: "A split is effective from the start of its ex-date in New York; an As known on date before it shows no adjustment."
    related_terms: [split_event, eps_diluted, diluted_shares]
    methodology_version: 0.1.0
    status: complete

  - term_id: split_event
    display_name: "Stock Split"
    category: corporate_actions
    short_definition: "A change in the number of shares, e.g. 4 new shares for each old one, from an ex-date on."
    full_definition: "Stored per instrument and ex-date with the ratio (new shares for old shares). Splits since 2016 come from Alpaca corporate actions; earlier ones from a reviewed list that cites the company's 8-K (Apple 7-for-1 in 2014). A stock dividend of one share per share counts as 2-for-1. Effective from the start of the ex-date in New York."
    formula: "new_rate / old_rate shares per share"
    unit: label
    example: "Apple 4-for-1, ex-date 2020-08-31 (Alpaca); Apple 7-for-1, ex-date 2014-06-09 (8-K 0001193125-14-228798)."
    direction: "N/A"
    interpretation: "A split changes the share count and per-share amounts, not the company's value."
    why_it_matters: "Needed to compare per-share history and prices across the split."
    source: "Alpaca Market Data corporate actions; SEC EDGAR 8-K (reviewed list)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/splits.yaml
    as_of: "2026-10-06"
    update_cadence: "daily, with the daily bars"
    caveats: "Alpaca's history starts in 2016; a split restatement no recorded split explains is flagged on the Reconciliation page."
    related_terms: [split_adjusted]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: valuation inputs (M1.2, ADR-022) ----------
  - term_id: valuation_price
    display_name: "Valuation Price"
    category: market_data
    short_definition: "The daily closing price a valuation uses: the last end-of-day consolidated (SIP) close public at the As known on time."
    full_definition: "The raw (unadjusted) close of the last session whose bar was public by the As known on time. Only a close stored as end_of_day is used; a fixture or demo close, a close older than five calendar days, and any intraday IEX quote never feed a valuation, and every multiple then shows Data unavailable with the reason (errata E4)."
    formula: "last raw daily close with published_at <= T and feed_status end_of_day, not older than 5 days"
    unit: "USD/share"
    example: "Apple on 2026-10-06: the 2026-10-05 close, $332.89."
    direction: "N/A"
    interpretation: "Check its date: a valuation is as of that close, not of the live quote."
    why_it_matters: "Mixing a live single-venue quote with filed fundamentals would make multiples jump with every trade."
    source: "Alpaca Market Data daily bars (SIP)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily, 06:30 SGT"
    caveats: "Daily bars start on 2016-01-04; earlier dates have no valuation."
    related_terms: [market_cap, pe_ratio_ttm]
    methodology_version: 0.1.0
    status: complete

  - term_id: market_cap
    display_name: "Market Capitalization"
    category: valuation
    short_definition: "Share price times shares outstanding: the market value of the equity."
    full_definition: "The valuation price times the most recently dated share count known then: cover-page or balance-sheet shares, whichever is later, moved to the price's split basis. Companies with several share classes count every common class (Alphabet: Class A, B and C at the Class A price; Meta: Class A and B) (ADR-022, V2)."
    formula: "valuation_price x latest shares outstanding (split-adjusted to the price date)"
    unit: "USD"
    example: "Apple: $332.89 x 14,594,180,000 shares (cover page, 2026-07-17) = $4.858 trillion."
    direction: "N/A"
    interpretation: "The size of the company in the market; the base of P/B and FCF yield."
    why_it_matters: "Every equity multiple starts from it."
    source: "Derived from the valuation price and SEC XBRL share counts"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily (price) and per filing (shares)"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4). Alphabet's Class C trades at a slightly different price than Class A."
    related_terms: [valuation_price, shares_outstanding, enterprise_value]
    methodology_version: 0.1.0
    status: complete

  - term_id: enterprise_value
    display_name: "Enterprise Value"
    category: valuation
    short_definition: "Market capitalization plus net debt: the value of the whole business, debt included."
    full_definition: "Market capitalization plus total debt minus cash at the latest balance-sheet date with both. Debt components a balance sheet does not report count as 0 and are named. Banks have no comparable debt figure, so JPMorgan has none."
    formula: "market_cap + total_debt - cash"
    unit: "USD"
    example: "Apple: $4.858 trillion + $44.8 billion net debt (2026-06-27) = $4.903 trillion."
    direction: "N/A"
    interpretation: "Compare companies with different debt levels on operating measures (EBITDA, revenue)."
    why_it_matters: "Debt holders have a claim on the business too; EV multiples include it."
    source: "Derived from market cap and SEC XBRL debt and cash"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily (price) and per filing"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4). Cash excludes marketable securities."
    related_terms: [market_cap, net_debt, ev_to_ebitda, ev_to_sales]
    methodology_version: 0.1.0
    status: complete

  - term_id: eps_diluted_ttm
    display_name: "Diluted EPS, Trailing Twelve Months"
    category: valuation
    short_definition: "Diluted earnings per share over the last twelve months, from reported EPS."
    full_definition: "Last fiscal year EPS + this year's year-to-date EPS - last year's year-to-date EPS of the same length, all as reported, each moved to the price's split basis; right after a 10-K, the fiscal-year EPS alone (ADR-022, V1). EPS is not strictly additive (share counts change), so this is close to, not exactly, the EPS of the twelve months."
    formula: "FY EPS + YTD EPS (this year) - YTD EPS (last year)"
    unit: "USD/share"
    example: "Apple to 2026-06-27: FY2025 EPS + nine months of FY2026 - nine months of FY2025 = $8.72."
    direction: "Higher = more earnings per share"
    interpretation: "The denominator of P/E and the numerator of earnings yield."
    why_it_matters: "More current than the last fiscal year, without estimating quarters EPS does not report."
    source: "Derived from SEC XBRL diluted EPS"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "per filing (10-Q, 10-K)"
    caveats: "Small non-additivity error; split-adjusted to the price date."
    related_terms: [pe_ratio_ttm, earnings_yield, eps_diluted]
    methodology_version: 0.1.0
    status: complete

  - term_id: ebitda_ttm
    display_name: "EBITDA, Trailing Twelve Months"
    category: valuation
    short_definition: "Operating income plus depreciation and amortization over the last four quarters."
    full_definition: "The sum of the last four quarterly values of operating income and of D&A (quarters differenced from year-to-date values). Unavailable when a company reports no operating income (JPMorgan, ExxonMobil) or no usable D&A (Microsoft, Alphabet) (ADR-022, V3)."
    formula: "operating_income_ttm + depreciation_amortization_ttm"
    unit: "USD"
    example: "Apple to 2026-06-27: $167.959 billion."
    direction: "Higher = more operating cash earnings"
    interpretation: "A proxy for operating cash earnings before capital structure and taxes."
    why_it_matters: "The denominator of EV/EBITDA."
    source: "Derived from SEC XBRL operating income and D&A"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "per filing (10-Q, 10-K)"
    caveats: "Not a GAAP measure; capex is not deducted."
    related_terms: [ev_to_ebitda, depreciation_amortization, operating_income]
    methodology_version: 0.1.0
    status: complete

  - term_id: pe_ratio_ttm
    display_name: "P/E Ratio (TTM)"
    category: valuation
    short_definition: "Share price divided by diluted EPS over the last twelve months."
    full_definition: "The valuation price divided by TTM diluted EPS. Not meaningful (n/m) when TTM EPS is zero or negative."
    formula: "valuation_price / eps_diluted_ttm"
    unit: "x"
    example: "Apple: $332.89 / $8.72 = 38.18x."
    direction: "Higher = more expensive per dollar of earnings"
    interpretation: "Compare with the company's own history and peers; growth and quality justify higher multiples."
    why_it_matters: "The most common equity valuation multiple."
    source: "Derived"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4)."
    related_terms: [eps_diluted_ttm, earnings_yield, valuation_price]
    methodology_version: 0.1.0
    status: complete

  - term_id: ev_to_ebitda
    display_name: "EV/EBITDA"
    category: valuation
    short_definition: "Enterprise value divided by EBITDA over the last twelve months."
    full_definition: "Enterprise value divided by TTM EBITDA. Not meaningful when EBITDA is zero or negative; unavailable when EBITDA is."
    formula: "enterprise_value / ebitda_ttm"
    unit: "x"
    example: "Apple: $4.903 trillion / $167.959 billion = 29.19x."
    direction: "Higher = more expensive"
    interpretation: "Comparable across capital structures; ignores capex intensity."
    why_it_matters: "A capital-structure-neutral valuation multiple."
    source: "Derived"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4)."
    related_terms: [enterprise_value, ebitda_ttm]
    methodology_version: 0.1.0
    status: complete

  - term_id: ev_to_sales
    display_name: "EV/Sales"
    category: valuation
    short_definition: "Enterprise value divided by revenue over the last twelve months."
    full_definition: "Enterprise value divided by TTM revenue (quarters differenced from year-to-date values)."
    formula: "enterprise_value / revenue_ttm"
    unit: "x"
    example: "Apple: $4.903 trillion / $466.823 billion = 10.50x."
    direction: "Higher = more expensive per dollar of sales"
    interpretation: "Useful when earnings are depressed or negative; read with margins."
    why_it_matters: "A valuation anchor that does not depend on profitability."
    source: "Derived"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4)."
    related_terms: [enterprise_value, revenue]
    methodology_version: 0.1.0
    status: complete

  - term_id: price_to_book
    display_name: "Price/Book"
    category: valuation
    short_definition: "Market capitalization divided by stockholders' equity."
    full_definition: "Market capitalization divided by stockholders' equity at the latest balance-sheet date. Not meaningful when equity is zero or negative (AutoZone, O'Reilly and Lowe's, after years of buybacks)."
    formula: "market_cap / stockholders_equity"
    unit: "x"
    example: "Apple: $4.858 trillion / $107.520 billion = 45.18x."
    direction: "Higher = more expensive relative to book value"
    interpretation: "Most meaningful for banks and asset-heavy companies; buybacks distort it."
    why_it_matters: "A balance-sheet anchor, especially for financials."
    source: "Derived"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4)."
    related_terms: [market_cap, stockholders_equity]
    methodology_version: 0.1.0
    status: complete

  - term_id: fcf_yield
    display_name: "Free Cash Flow Yield"
    category: valuation
    short_definition: "Free cash flow over the last twelve months as a percentage of market capitalization."
    full_definition: "TTM free cash flow (operating cash flow - capex, last four quarters) divided by market capitalization."
    formula: "free_cash_flow_ttm / market_cap x 100"
    unit: "percent"
    example: "Apple: $136.683 billion / $4.858 trillion = 2.81%."
    direction: "Higher = cheaper relative to cash generation"
    interpretation: "Compare with bond yields and with the buyback and dividend yield."
    why_it_matters: "Cash that could fund buybacks and dividends, relative to price; an input of the buyback engine (M1.4)."
    source: "Derived"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
    update_cadence: "daily"
    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4). Banks report no capex, so none."
    related_terms: [free_cash_flow, market_cap]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_yield
    display_name: "Earnings Yield"
    category: valuation
    short_definition: "TTM diluted EPS as a percentage of the share price: the inverse of P/E."
    full_definition: "TTM diluted EPS divided by the valuation price. Negative when TTM EPS is negative."
    formula: "eps_diluted_ttm / valuation_price x 100"
    unit: "percent"
    example: "Apple: $8.72 / $332.89 = 2.62%."
    direction: "Higher = cheaper relative to earnings"
    interpretation: "Compare directly with bond yields; works when P/E is not meaningful."
    why_it_matters: "Puts equity earnings on the same scale as interest rates."
    source: "Derived"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/valuation.py
    as_of: "2026-10-07"
