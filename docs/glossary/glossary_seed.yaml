  - term_id: disclosure_lag
    display_name: Disclosure Lag
    category: provenance
    short_definition: Delay between trade date and filing date.
    formula: "Filing Date - Trade Date"
    unit: days
    direction: Higher = staler
    interpretation: How old the information was when it became public.
    why_it_matters: Congress PTRs can be weeks old when published.
    caveats: Does not tell you the filer's current holdings.
    related_terms: [reported_trade]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: market_confirmation
    display_name: "Market Confirmation"
    category: signal
    short_definition: "Whether the market's own behavior supports a thesis."
    full_definition: "In the buyback rules (v0.1.0): the latest close above its 50-session average, or a 21-session return above SPY's (either passes). Computed from end-of-day closes known at T; part of TRADE-READY, which is unreachable in Phase 1. Other theses define their own versioned rules."
    formula: "close > 50-session average OR 21-session return - SPY return > 0"
    unit: "pass / fail"
    example: "Apple as known on 2026-10-06 (recorded SEC filings and closes): passes (+3.25% above its average, +1.21 points over SPY)."
    direction: "N/A"
    interpretation: "The market is behaving consistently with the thesis."
    why_it_matters: "Required for L3 trade candidates."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily"
    caveats: "Strong confirmation may mean the move is already priced in."
    related_terms: [close_vs_moving_average, relative_return_1m, buyback_state_trade_ready]
    methodology_version: 0.1.0
    status: complete

  - term_id: catalyst
    display_name: Catalyst
    category: signal
    short_definition: Future identifiable event that can reprice an asset.
    full_definition: "An event expected to make the market recognize (or reject) a thesis, with an expected date when one is known. A Thesis Card lists up to five; they are stated, not predicted, and do not count as evidence."
    formula: "event + expected date window"
    unit: event/date
    example: "Apple fiscal Q4 results, expected 2026-10-30."
    direction: N/A
    interpretation: What could make the market recognize the thesis.
    why_it_matters: Defines the expected time window for a thesis.
    source: "Build spec 02 §17; api/journal.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/api/journal.py
    as_of: "2026-10-11"
    caveats: A catalyst is possible, not certain.
    related_terms: [invalidation, market_confirmation, thesis_card]
    update_cadence: per event
    methodology_version: 0.1.0
    status: complete

  - term_id: invalidation
    display_name: Invalidation
    category: risk
    short_definition: Condition that makes a thesis fail.
    full_definition: "Required on every Thesis Card: the observable condition that would prove the thesis wrong. Phase 1 records it; monitoring it automatically comes with alerts in a later phase."
    formula: "explicit monitorable rule or threshold"
    unit: rule
    example: "Repurchases fall below free cash flow for two quarters."
    direction: N/A
    interpretation: If this happens, the thesis is wrong and the position is reviewed.
    why_it_matters: Every thesis must state what would prove it wrong.
    source: "Build spec 02 §17; api/journal.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/api/journal.py
    as_of: "2026-10-11"
    caveats: Must be monitorable with available data.
    related_terms: [catalyst, thesis_card]
    update_cadence: continuous
    methodology_version: 0.1.0
    status: complete

  - term_id: regime
    display_name: Regime
    category: macro
    short_definition: Current macro and market stress state.
    formula: "state machine: NORMAL | ELEVATED | HIGH | CRISIS"
    unit: state
    direction: N/A
    interpretation: Higher-stress states reduce new risk and raise hedging.
    why_it_matters: Changes position sizing and strategy eligibility.
    caveats: Detects fragility, does not predict black swans.
    related_terms: [tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: tail_risk
    display_name: Tail Risk
    category: risk
    short_definition: Low-probability, high-impact loss or fragility risk.
    formula: "risk class from stress indicators"
    unit: risk class
    direction: N/A
    interpretation: Describes vulnerability to extreme moves.
    why_it_matters: Drives hedging and gross exposure limits.
    caveats: Not a forecast of a specific event.
    related_terms: [regime, expected_shortfall]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: look_ahead_bias
    display_name: Look-ahead Bias
    category: methodology
    short_definition: Future information leaking into a historical test.
    formula: "validation failure"
    unit: concept
    direction: N/A
    interpretation: Inflates backtest results unrealistically.
    why_it_matters: Backtests with this bias cannot be trusted.
    caveats: Often subtle (e.g. using restated data or period end instead of filing date).
    related_terms: [point_in_time, survivorship_bias]
    update_cadence: N/A
    methodology_version: 0.1.0
    status: seed

  - term_id: survivorship_bias
    display_name: Survivorship Bias
    category: methodology
    short_definition: Excluding companies that were delisted or acquired.
    formula: "validation failure"
    unit: concept
    direction: N/A
    interpretation: Makes historical performance look better than reality.
    why_it_matters: Backtests need universes that include dead names.
    caveats: Requires a dataset with delisted securities (OD-7).
    related_terms: [look_ahead_bias, point_in_time]
    update_cadence: N/A
    methodology_version: 0.1.0
    status: seed

  - term_id: var
    display_name: VaR
    category: risk
    short_definition: Loss threshold not expected to be exceeded at a stated confidence over a horizon.
    formula: "distribution-dependent; method and confidence shown"
    unit: currency or %
    direction: Higher = more risk
    interpretation: A reference loss level, not the worst case.
    why_it_matters: Common portfolio risk limit input.
    caveats: Underestimates tail losses under non-normal returns.
    related_terms: [expected_shortfall, risk_score]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: expected_shortfall
    display_name: Expected Shortfall
    category: risk
    short_definition: Average loss beyond the VaR threshold.
    formula: "conditional tail loss; method and confidence shown"
    unit: currency or %
    direction: Higher = more risk
    interpretation: How bad losses are when they exceed VaR.
    why_it_matters: Better captures tail risk than VaR alone.
    caveats: Depends on distribution assumptions and sample.
    related_terms: [var, tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: gross_exposure
    display_name: Gross Exposure
    category: risk
    short_definition: Absolute long plus short market value relative to capital.
    formula: "sum(abs(market values)) / capital"
    unit: "%"
    direction: Higher = more leverage
    interpretation: Total size of positions regardless of direction.
    why_it_matters: Controls leverage.
    caveats: Says nothing about direction; see net exposure.
    related_terms: [net_exposure]
    update_cadence: per portfolio snapshot
    methodology_version: 0.1.0
    status: seed

  - term_id: net_exposure
    display_name: Net Exposure
    category: risk
    short_definition: Long minus short market value relative to capital.
    formula: "(long - short) / capital"
    unit: "%"
    direction: Higher = more directional (long)
    interpretation: How directional the portfolio is.
    why_it_matters: Main driver of market sensitivity.
    caveats: Ignores beta differences between positions.
    related_terms: [gross_exposure]
    update_cadence: per portfolio snapshot
    methodology_version: 0.1.0
    status: seed

  - term_id: implied_volatility
    display_name: Implied Volatility (IV)
    category: options
    short_definition: Volatility implied by option prices.
    formula: "inferred from option price via pricing model"
    unit: "% annualized"
    direction: Higher = more implied vol
    interpretation: Market's priced expectation of future movement.
    why_it_matters: Context for options trades, hedges and expected move.
    caveats: Affected by liquidity and model choice; differs from realized volatility.
    related_terms: [iv_percentile, skew]
    update_cadence: intraday
    methodology_version: 0.1.0
    status: seed

  - term_id: iv_percentile
    display_name: IV Percentile
    category: options
    short_definition: Current IV's percentile within its historical distribution.
    formula: "percentile(IV history over fixed window)"
    unit: "%"
    direction: Higher = more expensive relative context
    interpretation: Whether options are pricey versus their own history.
    why_it_matters: Helps choose between buying and selling volatility.
    caveats: Window length must be fixed and shown.
    related_terms: [implied_volatility]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: skew
    display_name: Skew
    category: options
    short_definition: Shape of implied volatility across strikes.
    formula: "surface-derived; method shown"
    unit: vol points
    direction: Context dependent
    interpretation: Steep downside skew signals demand for crash protection.
    why_it_matters: Reveals tail-risk pricing.
    caveats: Definitions vary; always show the method.
    related_terms: [implied_volatility, tail_risk]
    update_cadence: daily
    methodology_version: 0.1.0
    status: seed

  - term_id: reported_trade
    display_name: Reported Trade
    category: positioning
    short_definition: A publicly disclosed trade event (government or insider filing).
    formula: "official disclosure record"
    unit: event
    direction: N/A
    interpretation: Something was traded in the past and disclosed later.
    why_it_matters: Slow-moving idea input, never live copy-trading.
    caveats: Not a current position. Amounts are often ranges.
    related_terms: [disclosure_lag]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: policy_status
    display_name: Policy Status
    category: policy
    short_definition: Lifecycle stage of a policy action.
    formula: "state machine: statement | proposal | signed | effective | implementation | challenged_modified | expired_replaced"
    unit: state
    direction: N/A
    interpretation: Separates talk from enforceable rules.
    why_it_matters: Only effective or implemented policies enter causal models with full weight.
    caveats: Status can change through courts or revisions.
    related_terms: [catalyst]
    update_cadence: per official update
    methodology_version: 0.1.0
    status: seed
