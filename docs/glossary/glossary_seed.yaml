  # ---------- Later phases: v2 seed terms (02 §32.1) ----------
  - term_id: buyback_intensity
    display_name: Buyback Intensity
    category: corporate_action
    short_definition: Actual repurchases relative to market cap or FCF.
    formula: "Repurchase Value / Market Cap (or / FCF)"
    unit: "%"
    direction: Higher = more intensive, not automatically better
    interpretation: Scale of capital returned through repurchases.
    why_it_matters: Separates real buyback activity from announcements.
    caveats: Does not by itself imply undervaluation or future outperformance.
    related_terms: [net_share_reduction]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

  - term_id: net_share_reduction
    display_name: Net Share Reduction
    category: corporate_action
    short_definition: Share repurchase effect net of issuance and dilution.
    formula: "Buyback shares - dilution shares (SBC, issuance, option exercise)"
    unit: shares or %
    direction: Higher = greater per-share benefit
    interpretation: The buyback effect that actually reaches shareholders.
    why_it_matters: Gross buybacks can hide heavy SBC dilution.
    caveats: Depends on consistent diluted share counts across filings.
    related_terms: [buyback_intensity]
    update_cadence: per filing
    methodology_version: 0.1.0
    status: seed

