# Glossary Registry seed — loaded in M0.4
# Schema = 02 §22 (17 fields) + `direction` (02 §32.1) + `status`.
# status: seed     -> core fields written; NOT allowed in UI yet
#         complete -> all 17 fields filled; allowed in UI
# M0.4 must complete (full_definition, example, source, source_url, as_of) every
# term used by Phase 0 screens and flip it to `complete`. Do not change term_id or direction.
# Direction rules: Risk Score higher = worse; Source Tier lower number = stronger (errata E2).

version: 0.1.0
terms:

  # ---------- Phase 0: market data ----------
  - term_id: last_price
    display_name: "Last Price"
    category: market_data
    short_definition: "Most recent trade price received from the market data feed."
    full_definition: "The latest trade on the feed shown next to it. With the free Alpaca feed this is the latest IEX trade only, during and just after the US session; outside it, the last trade of the previous session. Day change compares it with the same feed's previous close."
    formula: "latest trade print from the provider; see feed_status"
    unit: "USD per share"
    example: "SPY 774.74 at the close on 2026-10-05 (IEX), +0.66% on the day."
    direction: "N/A"
    interpretation: "Market price at the shown as-of time, not a fair value."
    why_it_matters: "Basis for valuation gaps, timing and execution checks."
    source: "Alpaca Market Data, IEX feed (ADR-004)"
    source_url: https://docs.alpaca.markets/docs/about-market-data-api
    as_of: "2026-10-06"
    update_cadence: "every minute during US market hours"
    caveats: "Single-venue feeds (IEX) can differ from consolidated prices; always read with the feed status badge."
    related_terms: [bid, ask, feed_status, price_change_1d]
    methodology_version: 0.1.0
    status: complete

  - term_id: bid
    display_name: "Bid"
    category: market_data
    short_definition: "Highest price a buyer is currently quoting."
    full_definition: "The best bid on the feed shown next to it; with the free Alpaca feed, the best bid on IEX only."
    formula: "best bid from the provider quote"
    unit: "USD per share"
    example: "SPY bid 774.74 at the close on 2026-10-05 (IEX)."
    direction: "N/A"
    interpretation: "Approximate price available if selling immediately."
    why_it_matters: "Together with ask, defines spread and execution cost."
    source: "Alpaca Market Data, IEX feed"
    source_url: https://docs.alpaca.markets/docs/about-market-data-api
    as_of: "2026-10-06"
    update_cadence: "every minute during US market hours"
    caveats: "On one venue the spread can be much wider than the national best, especially around the open and close."
    related_terms: [ask, last_price, feed_status]
    methodology_version: 0.1.0
    status: complete

  - term_id: ask
    display_name: "Ask"
    category: market_data
    short_definition: "Lowest price a seller is currently quoting."
    full_definition: "The best ask on the feed shown next to it; with the free Alpaca feed, the best ask on IEX only."
    formula: "best ask from the provider quote"
    unit: "USD per share"
    example: "SPY ask 774.84 at the close on 2026-10-05 (IEX)."
    direction: "N/A"
    interpretation: "Approximate price available if buying immediately."
    why_it_matters: "Together with bid, defines spread and execution cost."
    source: "Alpaca Market Data, IEX feed"
    source_url: https://docs.alpaca.markets/docs/about-market-data-api
    as_of: "2026-10-06"
    update_cadence: "every minute during US market hours"
    caveats: "On one venue the spread can be much wider than the national best, especially around the open and close."
    related_terms: [bid, last_price, feed_status]
    methodology_version: 0.1.0
    status: complete

  - term_id: volume
    display_name: "Volume"
    category: market_data
    short_definition: "Number of shares traded in the period."
    full_definition: "Shares traded in the session so far on the feed shown. With the IEX feed this is IEX volume only, a small share of the consolidated market volume; daily bars use consolidated (SIP) volume."
    formula: "sum of trade sizes in the bar or session"
    unit: "shares"
    example: "SPY traded 1,091,335 shares on IEX on 2026-10-05."
    direction: "Higher = more trading activity"
    interpretation: "Context for liquidity and the strength of price moves."
    why_it_matters: "Feeds liquidity checks and market confirmation."
    source: "Alpaca Market Data (IEX for the session, SIP for daily bars)"
    source_url: https://docs.alpaca.markets/docs/about-market-data-api
    as_of: "2026-10-06"
    update_cadence: "intraday / daily"
    caveats: "Single-venue volume understates market activity; compare like with like."
    related_terms: [last_price, feed_status]
    methodology_version: 0.1.0
    status: complete

  - term_id: feed_status
    display_name: "Feed Status"
    category: market_data
    short_definition: "How live and how complete the price next to it is."
    full_definition: "Shown next to every price (errata E4). live_single_venue: market open and the IEX quote is at most 120 seconds old. stale: market open and the quote is older, or closed and the newest quote predates the close. end_of_day: market closed; the value is the last session's close. unavailable: no provider key or no data; no number is shown. fixture: recorded test data, with a DEMO DATA banner. live_consolidated and delayed are reserved for a consolidated feed (Massive, not active)."
    formula: "enum: live_consolidated | live_single_venue | delayed | end_of_day | stale | unavailable | fixture | demo"
    unit: "label"
    example: "After the close on 2026-10-05, SPY 774.74 shows end_of_day."
    direction: "N/A"
    interpretation: "Only live_consolidated is a full-market real-time price; read every other status before acting."
    why_it_matters: "Prevents single-venue, old or recorded prices from looking like the live market."
    source: "SPEC_ERRATA E4; ADR-004, ADR-006, ADR-017"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-06"
    update_cadence: "live (each page load)"
    caveats: "The 120-second rule assumes a liquid symbol; thinly traded ones can turn stale while the market is open."
    related_terms: [last_price, market_session, data_freshness]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 0: provenance and data quality ----------
  - term_id: point_in_time
    display_name: Point-in-Time
    category: methodology
    short_definition: Using only information that was public at a given time.
    full_definition: "A point-in-time view keeps, for each fact, the latest version whose publication time (e.g. an SEC acceptance time) is at or before the chosen moment, as this database holds it now. On the instrument page, \"As known on\" a date means the end of that day in Singapore time."
    formula: "per fact key: latest version with published_at <= known_at and not superseded (ADR-012)"
    unit: timestamp
    example: "As known on 2010-01-25, Apple's FY2008 net income is $4.834B; the 10-K/A that restated it to $6.119B was accepted on 2010-01-26 05:25 SGT."
    direction: N/A
    interpretation: Historical views and backtests see the data as it was public then, without later restatements.
    why_it_matters: Required to avoid look-ahead bias.
    source: "ADR-012 Knowledge time vs system time"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-05"
    update_cadence: N/A
    caveats: Only as good as the publication times the source provides; date-only times count from the end of that day in New York.
    related_terms: [vintage, look_ahead_bias, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: vintage
    display_name: Vintage
    category: provenance
    short_definition: A version of a data value as published at a specific time.
    full_definition: "For macro series, ALFRED records each value with the date it was first published (its real-time start). When a later release revises the value, the new figure is a new vintage and the earlier one stays queryable. On the Macro page, Released is the vintage date of the value shown and Revised marks a value that changed since its first release."
    formula: "ALFRED realtime_start of the value; counted as public from the end of that day in New York (ADR-012, ADR-015)"
    unit: date
    example: "Nonfarm payrolls for August 2026: first released on 2026-09-04 as 159,075 thousand, revised on 2026-10-02 to 159,015 thousand."
    direction: N/A
    interpretation: Revised data creates a new vintage; old vintages stay queryable.
    why_it_matters: Lets the system reproduce what the market knew on any date.
    source: "ALFRED (Archival FRED), Federal Reserve Bank of St. Louis; ADR-015"
    source_url: https://alfred.stlouisfed.org/
    as_of: "2026-10-06"
    update_cadence: per release
    caveats: ALFRED's archive starts at a different date per series; values first published before that carry the archive start as their vintage, which is later than the real release.
    related_terms: [point_in_time, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: restated_flag
    display_name: Restated
    category: provenance
    short_definition: Marks a financial value that replaced an earlier reported value for the same period.
    full_definition: "Set when a later filing reports a different value for the same company, metric, unit and period. The earlier version is kept and shown next to the restated one, and a point-in-time view before the later filing still returns the earlier value."
    formula: "true when a later filing reports a different value for the same metric and period"
    unit: boolean
    example: "Apple's FY2008 net income: $4.834B in the 10-K of 2009-10-27, restated to $6.119B in the 10-K/A of 2010-01-25."
    direction: N/A
    interpretation: The figure changed after first publication; earlier version retained.
    why_it_matters: Restatements can signal accounting changes and affect backtests.
    source: "ADR-012 and ADR-013 (SEC version rules)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-05"
    update_cadence: per filing
    caveats: Small differences can come from XBRL tagging, not true restatements; stock splits also change past per-share values.
    related_terms: [vintage, filing_date, accession_number]
    methodology_version: 0.1.0
    status: complete

  - term_id: filing_date
    display_name: Filing Date
    category: provenance
    short_definition: When a filing was accepted by the SEC and became public.
    full_definition: "Shown as the EDGAR acceptance time, in SGT and ET. Filings accepted after 17:30 ET carry the next business day as their official filing date, so the acceptance time is the earlier and more precise moment."
    formula: "EDGAR acceptanceDateTime (UTC); if missing, end of the filing date in New York"
    unit: timestamp
    example: "Apple's FY2025 10-K was accepted on 2025-10-31 at 06:01 ET (18:01 SGT)."
    direction: N/A
    interpretation: Information was not public before this time.
    why_it_matters: Point-in-time logic uses publication time, not period end.
    source: "SEC submissions API (data.sec.gov); ADR-013"
    source_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    as_of: "2026-10-05"
    update_cadence: per filing
    caveats: A few old filings only have a date; those count from the end of that day in New York.
    related_terms: [accession_number, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: accession_number
    display_name: Accession Number
    category: provenance
    short_definition: SEC's unique identifier for a filing.
    full_definition: "Ten digits of the filer agent's CIK, two of the year and a six-digit sequence. Every value on the instrument page links to the EDGAR index page of the filing with this number."
    formula: "from SEC submissions metadata"
    unit: identifier
    example: "0001193125-10-012091 is Apple's 10-K/A of January 2010."
    direction: N/A
    interpretation: Click-through link to the exact source document.
    why_it_matters: Makes every financial fact traceable to its filing.
    source: "SEC submissions API (data.sec.gov)"
    source_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    as_of: "2026-10-05"
    update_cadence: per filing
    caveats: Amendments have their own accession numbers.
    related_terms: [filing_date, restated_flag]
    methodology_version: 0.1.0
    status: complete

  - term_id: reporting_period
    display_name: Reporting Period
    category: provenance
    short_definition: The period a financial value describes, shown by its end date.
    full_definition: "Income and cash-flow values cover a span (here a fiscal year of 350 to 380 days, which fits 52/53-week years); balance-sheet values are as of one day. Columns are labelled by the period end date the company reported."
    formula: "period_start..period_end from the XBRL fact; fiscal year = 350-380 days"
    unit: date range
    example: "Apple's fiscal year 2025 runs from 2024-09-29 to 2025-09-27."
    direction: N/A
    interpretation: Compare columns of the same length; fiscal years do not always match calendar years.
    why_it_matters: The period end is not when the value became public; that is the filing time.
    source: "SEC XBRL company facts (start/end of each fact)"
    source_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    as_of: "2026-10-05"
    update_cadence: per filing
    caveats: A change of fiscal year end can create a short transition period, which the annual table leaves out.
    related_terms: [filing_date, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: predecessor_issuer
    display_name: Predecessor Issuer
    category: provenance
    short_definition: An earlier company whose filings form part of a stock's history.
    full_definition: "When a company reorganizes (e.g. under a new holding company), the new issuer files under a new CIK. The platform links the earlier issuer with the SEC filing that records the change and shows its figures for periods the new issuer has not reported, labelled with the earlier issuer's name."
    formula: "curated link in config/universe.yaml with an SEC filing as evidence (ADR-014)"
    unit: label
    example: "XOM: Exxon Mobil Corp (CIK 0000034088) until 2026-07-01, then ExxonMobil Holdings Corp (CIK 0002115436)."
    direction: N/A
    interpretation: Values marked with a predecessor were reported by the earlier company, not restated by the new one.
    why_it_matters: Keeps the multi-year history of a stock usable after a corporate reorganization.
    source: "ADR-014 Successor issuers"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-05"
    update_cadence: per corporate reorganization
    caveats: Links are added by hand from SEC filings; the new issuer's values win where both reported the same period.
    related_terms: [accession_number, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: confidence
    display_name: Confidence
    category: data_quality
    short_definition: Parsing or extraction confidence attached to an observation.
    formula: "0-1; deterministic parsers = 1.0; heuristic or model extraction = measured confidence"
    unit: ratio 0-1
    direction: Higher = more reliable extraction
    interpretation: Low values need verification before use.
    why_it_matters: Low-confidence data can be excluded from signals.
    caveats: Measures extraction quality, not whether the underlying claim is true.
    related_terms: [source_tier]
    update_cadence: per observation
    methodology_version: 0.1.0
    status: seed

  - term_id: duplicate_group
    display_name: "Duplicate Group"
    category: data_quality
    short_definition: "Copies of one news story (syndication, reposts), counted as one story."
    full_definition: "Articles with the same canonical URL are one article. Articles on different sites whose normalised titles match, or whose title words overlap by at least 85% (at least four words), within 72 hours of each other form one group; one site's own articles group only by URL. A new article joins the most similar group; groups never change afterwards."
    formula: "canonical URL equal, or Jaccard(title words) >= 0.85 within 72 hours -> duplicate_group_id"
    unit: "identifier"
    example: "On 2026-10-02 several sites carried 'Nvidia unveils record $150 billion buyback increase': one group, one story."
    direction: "N/A"
    interpretation: "Ten copies of one story count as one piece of evidence."
    why_it_matters: "Enforces evidence independence: article counts overstate how many sources confirm a story."
    source: "Milestone M0.8; domain/news.py (ADR-018)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/news.py
    as_of: "2026-10-06"
    update_cadence: "per ingest"
    caveats: "Rewritten versions of a story (different headline) are not detected; two groups are never merged later."
    related_terms: [story_count, source_tier]
    methodology_version: 0.1.1
    status: complete

  # ---------- Phase 0: complete terms used by the UI (M0.4) ----------
  # Field order: 02 §22 (17 fields) + direction + status. Changing a complete term requires a
  # methodology_version bump; `make migrate` refuses changed content under an existing version.
  - term_id: source_tier
    display_name: Source Tier
    category: provenance
    short_definition: Reliability class of a source, from Tier 1 (strongest) to Tier 4 (weakest).
    full_definition: "Every source in the registry is classed by the kind of evidence it provides. Tier 1 is primary, official or licensed data (SEC filings, FRED, licensed price feeds). Tier 2 is professional media and licensed research. Tier 3 is specialist or social commentary. Tier 4 is anonymous or unverified material. Each stored observation keeps a snapshot of its source's tier."
    formula: "Tier 1 primary official/issuer/licensed feed; Tier 2 professional media/licensed data; Tier 3 expert/social/specialist; Tier 4 unverified"
    unit: label (Tier 1 to Tier 4)
    example: SEC EDGAR is Tier 1; an anonymous repost is Tier 4.
    direction: Lower tier number = stronger evidence
    interpretation: Trade-critical facts need Tier 1 confirmation; Tier 3 and 4 are leads, never sole evidence.
    why_it_matters: Weights evidence and blocks weak-source-only signals.
    source: "Research report 01 §20 (Data Source Hierarchy); errata E2"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/spec/01_research_report_v2.md
    as_of: "2026-10-05"
    update_cadence: per source configuration
    caveats: A tier describes the source type, not the author's personal credibility.
    related_terms: [license_status, access_status]
    methodology_version: 0.1.0
    status: complete

  - term_id: license_status
    display_name: License Status
    category: provenance
    short_definition: Whether we are permitted to store and display a source's data, and how.
    full_definition: "The usage rights attached to a source's data. public: public-domain or openly licensed data. licensed_personal: licensed for this single user's personal use, with no redistribution. licensed_redistribution: licensed for display to others. restricted: usable under provider terms with limits, for example some series carry third-party copyright. unknown: not yet reviewed."
    formula: "enum: public | licensed_personal | licensed_redistribution | restricted | unknown"
    unit: label
    example: FRED is restricted because some series carry third-party copyright; SEC EDGAR is public.
    direction: N/A
    interpretation: Shows the usage rights attached to the data.
    why_it_matters: Prevents unlicensed storage or display (ADR-001, no redistribution).
    source: "Build spec 02 §4 and §27.1; ADR-001; config/sources.yaml"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/sources.yaml
    as_of: "2026-10-05"
    update_cadence: per source configuration
    caveats: Provider terms change; re-verify periodically and before paying for or enabling a source.
    related_terms: [access_status, source_tier]
    methodology_version: 0.1.0
    status: complete

  - term_id: access_status
    display_name: Access Status
    category: provenance
    short_definition: Whether the platform currently has working access to a source.
    full_definition: "Operational access to a source, separate from its license. active: credentials and terms are in place and the adapter may run. no_credentials: a required key is missing. disabled: deliberately switched off, for example a paid feed awaiting its license check. pending_review: access has not been verified yet."
    formula: "enum: active | no_credentials | disabled | pending_review"
    unit: label
    example: Massive stays disabled until its license check is recorded (ADR-004).
    direction: N/A
    interpretation: Only active sources are expected to deliver data.
    why_it_matters: Explains why a source has no data without treating it as a failure.
    source: "config/sources.yaml; ADR-004"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/sources.yaml
    as_of: "2026-10-05"
    update_cadence: per source configuration
    caveats: Access says nothing about data quality; see Data Freshness.
    related_terms: [license_status, data_freshness]
    methodology_version: 0.1.0
    status: complete

  - term_id: data_freshness
    display_name: Data Freshness
    category: data_quality
    short_definition: Time since the latest successful update compared with its expected cadence.
    full_definition: "For each enabled source, the time since its last successful ingestion run is compared with the source's freshness SLA. fresh: within the SLA. stale: older than the SLA, or never succeeded. failing: the most recent finished run failed or was dead-lettered. Sources that are not enabled are not judged and show Not enabled."
    formula: "now - last_successful_ingest; compared to source freshness SLA -> fresh | stale | failing (not judged when the source is disabled)"
    unit: state
    example: SEC EDGAR has a 2-day SLA, so a last success 3 days ago shows stale.
    direction: Longer age = staler
    interpretation: stale means the value is older than it should be for its source; failing means the latest attempt did not work.
    why_it_matters: Stale inputs can block signals and execution eligibility.
    source: "Milestone M0.3 freshness monitor; apps/api/src/autotrading/domain/freshness.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/freshness.py
    as_of: "2026-10-05"
    update_cadence: continuous (computed on each request)
    caveats: Some sources update only per filing or weekly, so their SLA is long.
    related_terms: [freshness_sla, ingestion_status, as_of]
    methodology_version: 0.1.0
    status: complete

  - term_id: freshness_sla
    display_name: Freshness SLA
    category: data_quality
    short_definition: Longest acceptable time between successful updates of a source.
    full_definition: "A service-level target set per source in config/sources.yaml. If no ingestion run has succeeded within this window, the source turns stale."
    formula: "freshness_sla_seconds per source, shown as a duration"
    unit: duration
    example: GDELT news has a 2-hour SLA; SEC EDGAR has 2 days.
    direction: Shorter = stricter
    interpretation: The SLA reflects how often the source publishes, not how often we would like it to.
    why_it_matters: Drives the stale and fresh judgement for each source.
    source: config/sources.yaml
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/sources.yaml
    as_of: "2026-10-05"
    update_cadence: per source configuration
    caveats: Intraday sources will get market-hours-aware SLAs in M0.7.
    related_terms: [data_freshness, update_cadence]
    methodology_version: 0.1.0
    status: complete

  - term_id: rate_limit
    display_name: Rate Limit
    category: data_quality
    short_definition: Most requests per second the platform will send to a source.
    full_definition: "A per-source token bucket shared by all workers. Requests are sent at the sustained rate; up to the burst size can go out at once after a quiet period. Requests beyond that wait for a token."
    formula: "token bucket: rate_limit_per_second, burst = rate_limit_burst"
    unit: requests per second
    example: SEC EDGAR is limited to 5 requests per second, well under SEC's 10.
    direction: Lower = gentler on the provider
    interpretation: Set below the provider's published limit to stay a polite client.
    why_it_matters: Exceeding provider limits can get access blocked (errata E8).
    source: "config/sources.yaml; errata E8; apps/api/src/autotrading/ingestion/rate_limit.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/sources.yaml
    as_of: "2026-10-05"
    update_cadence: per source configuration
    caveats: Provider limits change; re-check them before enabling a source.
    related_terms: [update_cadence, access_status]
    methodology_version: 0.1.0
    status: complete

  - term_id: update_cadence
    display_name: Update Cadence
    category: data_quality
    short_definition: How often a source publishes new data.
    full_definition: "The publication rhythm of a source: intraday, daily, weekly, monthly, per filing or per release. Ingestion schedules and the freshness SLA follow it."
    formula: "enum: intraday | daily | weekly | monthly | per_filing | per_release"
    unit: label
    example: SEC EDGAR is per filing; FRED is daily.
    direction: N/A
    interpretation: A per-filing source can be quiet for days without being stale.
    why_it_matters: Sets the expectation for how current a source's data can be.
    source: config/sources.yaml
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/sources.yaml
    as_of: "2026-10-05"
    update_cadence: per source configuration
    caveats: Individual series inside a source can update on their own schedules.
    related_terms: [freshness_sla, data_freshness]
    methodology_version: 0.1.0
    status: complete

  - term_id: ingestion_status
    display_name: Ingestion Status
    category: data_quality
    short_definition: State of one data-ingestion run for a source.
    full_definition: "Each ingestion run moves through queued, running and one final state. succeeded: data stored. skipped: an identical run (same source, job, parameters and window) had already succeeded, so nothing was fetched again. failed: the attempt raised an error and may be retried. dead_lettered: every retry failed."
    formula: "enum: queued | running | succeeded | failed | dead_lettered | skipped"
    unit: label
    example: Running the same SEC filing job twice records succeeded, then skipped.
    direction: N/A
    interpretation: skipped is healthy; dead_lettered needs attention.
    why_it_matters: Shows whether the latest data actually arrived and whether a failure needs attention.
    source: apps/api/src/autotrading/ingestion/runner.py
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/ingestion/runner.py
    as_of: "2026-10-05"
    update_cadence: per run
    caveats: A failed run may still be retried; only dead_lettered is final.
    related_terms: [data_freshness, dead_letter]
    methodology_version: 0.1.0
    status: complete

  - term_id: ingestion_note
    display_name: Run Note
    category: data_quality
    short_definition: Something a run noticed or corrected about its source, kept with the run.
    full_definition: "A job records a note when it had to correct its source or wants a data-quality observation kept with the run. Since 2026-10-06 SEC's filing index returns many acceptance times late by the New York offset (4 h EDT, 5 h EST), so each new filing is timed from its own EDGAR header; the note counts how many JSON times differed and how many filings were stored date-only (ADR-013 amendment)."
    formula: "free text written by the job (ingestion_runs.notes)"
    unit: label
    example: "2 new filings timed from their EDGAR headers; 1 JSON times were late by the New York offset."
    direction: N/A
    interpretation: A note means the source disagreed with itself or with a stronger record; the stored data follows the stronger record.
    why_it_matters: Publication times decide what was known when; a silent source error would leak into every point-in-time query.
    source: apps/api/src/autotrading/adapters/sec/acceptance.py
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/adapters/sec/acceptance.py
    as_of: "2026-10-06"
    update_cadence: per run
    caveats: Only jobs that check their source write notes; no note does not prove the source is error-free.
    related_terms: [ingestion_status, filing_date]
    methodology_version: 0.1.1
    status: complete

  - term_id: dead_letter
    display_name: Dead Letter
    category: data_quality
    short_definition: An ingestion job that still failed after its last automatic retry.
    full_definition: "Failed ingestion jobs are retried with exponential backoff. When the last retry fails, the job is moved to the dead-letter queue and recorded with its parameters, attempt count and redacted error, until someone resolves it."
    formula: "run status = dead_lettered after max_retries with exponential backoff"
    unit: count
    example: A provider outage that outlasts all 5 retries produces one dead letter per affected job.
    direction: Higher = more unresolved failures
    interpretation: Each open dead letter is data that did not arrive and needs a look.
    why_it_matters: Missing data can make a source stale and block signals that depend on it.
    source: apps/api/src/autotrading/ingestion/actors.py
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/ingestion/actors.py
    as_of: "2026-10-05"
    update_cadence: per run
    caveats: Resolving a dead letter is a manual, audited action.
    related_terms: [ingestion_status, data_freshness]
    methodology_version: 0.1.0
    status: complete

  - term_id: as_of
    display_name: As-of
    category: provenance
    short_definition: Timestamp the displayed value refers to.
    full_definition: "The moment a value describes, such as a filing's acceptance time or a run's finish time. Stored in UTC and shown in Singapore time with US Eastern time alongside (ADR-005)."
    formula: "provider or filing timestamp, stored UTC, shown SGT and ET"
    unit: timestamp
    example: A run that finished at 01:30 UTC shows as 09:30 SGT and 21:30 ET the previous day.
    direction: N/A
    interpretation: The value describes the world at this time, not now.
    why_it_matters: Avoids mixing current and historical information.
    source: "ADR-005 (time policy)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/decisions/DECISIONS.md
    as_of: "2026-10-05"
    update_cadence: per observation
    caveats: Differs from ingested time, which is when we received it.
    related_terms: [data_freshness, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: planned_phase
    display_name: Planned Phase
    category: navigation
    short_definition: The roadmap phase in which a dashboard first shows real content.
    full_definition: "Dashboards are built phase by phase. Until its phase ships, a dashboard shows this label and no data, live or simulated. The mapping is kept in docs/milestones/ROADMAP.md."
    formula: "first phase with real content (ROADMAP dashboard -> phase map)"
    unit: phase (1 to 6)
    example: Earnings is planned for Phase 1; Options and Vol for Phase 5.
    direction: N/A
    interpretation: A planned dashboard is empty on purpose, not broken.
    why_it_matters: Prevents placeholder numbers from being mistaken for data.
    source: docs/milestones/ROADMAP.md (dashboard to phase map)
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/ROADMAP.md
    as_of: "2026-10-05"
    update_cadence: per release
    caveats: Phases can move when the roadmap changes.
    related_terms: [page_data_health]
    methodology_version: 0.1.0
    status: complete

  - term_id: page_data_health
    display_name: Data Health
    category: navigation
    short_definition: Status of every data source, its latest ingestion runs and open failures.
    full_definition: "System page showing the source registry: tier, license, access, freshness against the SLA, rate limit, the latest ingestion runs and any open dead letters. Pulled forward from M0.9 to M0.4."
    formula: "not a calculation; reads GET /data-health, /ingestion-runs and /dead-letters"
    unit: page
    example: A source that is not enabled shows Not enabled instead of a freshness state.
    direction: N/A
    interpretation: Start here when data looks missing or old.
    why_it_matters: Makes data problems visible before they reach signals.
    source: "Milestone M0.4 (Data Health page)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-05"
    update_cadence: live (each page load)
    caveats: Shows only sources in the registry; sources are added through config/sources.yaml.
    related_terms: [data_freshness, ingestion_status, dead_letter]
    methodology_version: 0.1.0
    status: complete

  # ---------- Navigation: dashboards (02 §21, errata E13) ----------
  - term_id: page_instruments
    display_name: Instruments
    category: navigation
    short_definition: Universe stocks with their prices, SEC-reported fundamentals and news as known at a chosen date.
    full_definition: "System page listing the equities in config/universe.yaml. Each stock page shows its latest price with feed status and one year of daily closes (M0.7), valuation and fair value (M1.2, M1.3a), the Research Record (M1.3b), buybacks (M1.4a), the last three fiscal years, quarters and recent balance sheets from SEC XBRL filings, every value linked to its filing, and recent news stories (M0.8), with an As known on date to see what was public at that time."
    formula: "not a calculation; reads GET /instruments, /instruments/{ticker}/fundamentals, /instruments/{ticker}/prices and /news"
    unit: page
    example: "Choosing As known on 2010-01-25 on AAPL shows FY2008 net income before Apple's 2010 restatement."
    direction: N/A
    interpretation: Start here to check a company's reported numbers and where they came from.
    why_it_matters: Every later signal builds on these values; this page shows them with their sources.
    source: "Milestone M0.5b (minimal instrument page)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/milestones/M0_foundation.md
    as_of: "2026-10-06"
