    caveats: "Only an end-of-day consolidated close feeds it; with a fixture, demo or stale close it shows Data unavailable (errata E4)."
    related_terms: [pe_ratio_ttm, eps_diluted_ttm]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: fair value (M1.3a, ADR-023) ----------
  - term_id: fair_value_dcf
    display_name: "DCF Fair Value per Share"
    category: valuation
    short_definition: "A model's value per share from discounting owner free cash flow: enterprise value minus net debt, divided by shares."
    full_definition: "Enterprise DCF, two-stage, annual, discounted at year end. Owner free cash flow of the last four quarters grows at the scenario rate for five years, then the rate fades linearly to the terminal growth over years 6-10; the terminal value at year 10 is FCF10 x (1 + terminal growth) / (discount rate - terminal growth). The present values add up to an enterprise value; net debt (M1.2) is subtracted and the result divided by shares outstanding (M1.2). Every input is what was public at the As known on time, and the assumption version is named, so the same pair always gives the same value (ADR-023)."
    formula: "(sum of PV(FCF years 1-10) + PV(terminal value) - net_debt) / shares_outstanding"
    unit: "USD/share"
    example: "Apple on 2026-10-07, default assumptions: owner FCF $122.98 billion, discount rate 10.31%: bear $93.30, base $123.76, bull $163.35 a share."
    direction: "N/A"
    interpretation: "What the cash flows are worth if the assumptions hold; compare the range with the price, and read the reverse DCF to see what the price assumes."
    why_it_matters: "A price only means cheap or dear against an estimate of value; the model makes that estimate explicit and repeatable."
    source: "Derived from SEC XBRL cash flows, debt, cash and shares, FRED DGS10 and the assumption version"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "per filing, daily (Treasury yield), and when the assumptions change"
    caveats: "Model output, not fact: small changes in the discount rate or terminal growth move it a lot. Not meaningful when owner free cash flow is not positive. Banks (JPMorgan) have no comparable capex or net debt, so it is unavailable for them. One discount rate, no mid-year convention."
    related_terms: [owner_fcf, discount_rate, scenario_range, reverse_dcf_growth, valuation_assumptions, model_output]
    methodology_version: 0.1.0
    status: complete

  - term_id: owner_fcf
    display_name: "Owner Free Cash Flow"
    category: valuation
    short_definition: "Operating cash flow minus capital expenditure minus stock-based compensation, the last four quarters: the DCF's starting cash flow."
    full_definition: "Free cash flow after treating stock-based compensation as a cost, since paying staff in shares dilutes owners as surely as paying cash. Each part is the sum of the last four quarters (quarters derived from year-to-date values, ADR-021), and all three must cover the same quarters. An assumption version can leave SBC in (ADR-023 F2)."
    formula: "operating_cash_flow_ttm - capex_ttm - stock_based_compensation_ttm"
    unit: "USD"
    example: "Apple, four quarters to 2026-06-27: $122.98 billion."
    direction: "Higher = more cash for owners"
    interpretation: "The base the DCF grows; compare it with net income to see how much profit turns into cash."
    why_it_matters: "A DCF is only as good as the cash flow it starts from."
    source: "Derived from SEC XBRL cash flow statements"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "per filing"
    caveats: "ExxonMobil reports no separate SBC line, so with SBC subtracted it is unavailable; an assumption version for XOM can leave SBC out. One year of heavy capex (AI data centres in 2025-26) lowers it sharply."
    related_terms: [free_cash_flow, stock_based_compensation, fair_value_dcf]
    methodology_version: 0.1.0
    status: complete

  - term_id: discount_rate
    display_name: "Discount Rate"
    category: valuation
    short_definition: "The yearly return the DCF requires: the 10-year Treasury yield known then plus the equity risk premium."
    full_definition: "The latest 10-year constant-maturity Treasury yield (FRED DGS10) public at the As known on time, plus the equity risk premium of the assumption version. One rate for the whole company, not a weighted cost of capital (ADR-023)."
    formula: "DGS10 (latest observation known at T) + equity_risk_premium"
    unit: "percent"
    example: "2026-10-07: 5.31% (DGS10, 2026-10-05) + 5% = 10.31%."
    direction: "Higher = lower fair value"
    interpretation: "A higher rate means future cash is worth less today; the DCF is most sensitive to it."
    why_it_matters: "Ties the valuation to the interest rates of the day."
    source: "FRED DGS10 (Board of Governors) and the assumption version"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "daily (Treasury yield)"
    caveats: "No company-specific beta or debt cost."
    related_terms: [macro_treasury_10y, equity_risk_premium, fair_value_dcf]
    methodology_version: 0.1.0
    status: complete

  - term_id: equity_risk_premium
    display_name: "Equity Risk Premium"
    category: valuation
    short_definition: "The extra yearly return over Treasuries the DCF asks of a stock; an assumption, 2% to 10%."
    full_definition: "Set in each assumption version (default 5%, not reviewed). Added to the 10-year Treasury yield to give the discount rate."
    formula: "assumption; discount_rate = DGS10 + equity_risk_premium"
    unit: "percent"
    example: "Default: 5%."
    direction: "Higher = lower fair value"
    interpretation: "How much compensation for risk you demand; one point changes most DCF values by a fifth or more."
    why_it_matters: "The single most influential assumption next to growth."
    source: "Assumption version (Steven's, or the built-in default)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "when the assumptions change"
    caveats: "A judgement, not a market observation."
    related_terms: [discount_rate, valuation_assumptions]
    methodology_version: 0.1.0
    status: complete

  - term_id: terminal_growth
    display_name: "Terminal Growth"
    category: valuation
    short_definition: "The growth rate the DCF assumes forever after year 10; an assumption, -2% to 5%."
    full_definition: "Years 6-10 fade linearly from the scenario growth to this rate; the terminal value grows at it forever. It must stay at least one point below the discount rate, or the DCF is unavailable."
    formula: "terminal value = FCF10 x (1 + g) / (r - g)"
    unit: "percent"
    example: "Default: 2.5%."
    direction: "Higher = higher fair value"
    interpretation: "Around long-run nominal GDP growth; much above it implies the company outgrows the economy forever."
    why_it_matters: "The terminal value is usually more than half of a DCF."
    source: "Assumption version"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "when the assumptions change"
    caveats: "Close to the discount rate it makes the value explode; hence the one-point rule."
    related_terms: [fair_value_dcf, valuation_assumptions]
    methodology_version: 0.1.0
    status: complete

  - term_id: scenario_range
    display_name: "Scenario Range"
    category: valuation
    short_definition: "The DCF value per share under bear, base and bull growth, which differ only in the growth of years 1-5."
    full_definition: "Three DCFs with the same discount rate, terminal growth and cash flow; only the first five years' growth differs (default 0%, 5% and 10%). The spread shows how much the value depends on growth."
    formula: "fair_value_dcf at growth_bear, growth_base, growth_bull"
    unit: "USD/share"
    example: "Apple on 2026-10-07: $93.30 to $163.35, base $123.76."
    direction: "N/A"
    interpretation: "A price above the bull value needs more than the bull growth to be justified."
    why_it_matters: "One number hides how uncertain it is; the range does not."
    source: "Derived (fair_value_dcf)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "as fair_value_dcf"
    caveats: "Not probabilities: bear and bull are assumptions, not the worst and best cases."
    related_terms: [fair_value_dcf, implied_upside]
    methodology_version: 0.1.0
    status: complete

  - term_id: implied_upside
    display_name: "Implied Upside"
    category: valuation
    short_definition: "How far the base DCF value is above (or below) the valuation price."
    full_definition: "Base value per share divided by the valuation price, minus one. Unavailable when the price is a fixture, demo or stale close (errata E4), or when there is no DCF value."
    formula: "(base value / valuation_price - 1) x 100"
    unit: "percent"
    example: "Apple on 2026-10-07: $123.76 / $333.04 - 1 = -62.84%."
    direction: "Higher = cheaper against the model"
    interpretation: "Negative means the price is above the base value."
    why_it_matters: "Puts the model and the market on one scale."
    source: "Derived (fair_value_dcf, valuation_price)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "daily"
    caveats: "Only as good as the assumptions; read with the reverse DCF."
    related_terms: [margin_of_safety, fair_value_dcf, valuation_price]
    methodology_version: 0.1.0
    status: complete

  - term_id: margin_of_safety
    display_name: "Margin of Safety"
    category: valuation
    short_definition: "How far the price is below the base DCF value, as a share of that value."
    full_definition: "(Base value - price) / base value. Positive: the price is below the value by that share; negative: above it. Unavailable without a usable valuation price or a positive base value."
    formula: "(base value - valuation_price) / base value x 100"
    unit: "percent"
    example: "Apple on 2026-10-07: ($123.76 - $333.04) / $123.76 = -169.10%."
    direction: "Higher = more room for error"
    interpretation: "Value investors look for a positive margin before buying; how much depends on how sure the value is."
    why_it_matters: "A buffer against being wrong about the assumptions."
    source: "Derived (fair_value_dcf, valuation_price)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "daily"
    caveats: "Measured against the base scenario only."
    related_terms: [implied_upside, fair_value_dcf]
    methodology_version: 0.1.0
    status: complete

  - term_id: reverse_dcf_growth
    display_name: "Reverse DCF Implied Growth"
    category: valuation
    short_definition: "The growth in years 1-5 that makes the base DCF value equal the price: what the market is assuming."
    full_definition: "Everything else as in the base scenario (cash flow, discount rate, fade, terminal growth), solved by bisection between -50% and +100% a year. None when the price is outside that range or unusable."
    formula: "g such that fair_value_dcf(g) = valuation_price"
    unit: "percent a year"
    example: "Apple on 2026-10-07: 23.32% a year for five years."
    direction: "N/A"
    interpretation: "Compare it with the company's past growth: a price that needs far more growth than history is optimistic."
    why_it_matters: "Turns a price into an assumption you can judge."
    source: "Derived (fair_value_dcf, valuation_price)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "daily"
    caveats: "Depends on the discount rate and terminal growth of the version."
    related_terms: [fair_value_dcf, scenario_range]
    methodology_version: 0.1.0
    status: complete

  - term_id: multiple_percentile
    display_name: "Multiple Percentile (own history)"
    category: valuation
    short_definition: "Where today's multiple ranks in the company's own month-end history since 2016, each month as known then."
    full_definition: "Each M1.2 multiple is recomputed at the end of every month since January 2016 from the facts, close and splits public then. The percentile is the share of those month ends at or below today's value; the median is that history's middle value. Months without a value (no close, unavailable or n/m) are left out."
    formula: "count(history <= current) / count(history) x 100"
    unit: "percentile (0-100)"
    example: "Apple on 2026-10-07: P/E 38.19, median 26.67, 95th percentile of 129 month ends."
    direction: "P/E, EV/EBITDA, EV/sales, P/B: higher = dearer than usual; FCF and earnings yield: higher = cheaper than usual"
    interpretation: "Relative to the company's own past, not to peers."
    why_it_matters: "A multiple means little alone; against its history it shows whether the market is paying more than usual."
    source: "Derived (M1.2 multiples at each month end)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "daily"
    caveats: "History starts when the inputs do: Alphabet's EPS before 2019 and some FCF quarters are not reported in a usable form, so fewer months count. Business changes make old multiples less comparable."
    related_terms: [pe_ratio_ttm, ev_to_ebitda, fcf_yield]
    methodology_version: 0.1.0
    status: complete

  - term_id: valuation_assumptions
    display_name: "Valuation Assumptions"
    category: valuation
    short_definition: "A numbered, append-only set of DCF assumptions per company: equity risk premium, terminal growth, bear/base/bull growth, SBC treatment."
    full_definition: "Saved on the instrument page with a one-line reason; each save is a new version (never an edit) and is recorded in the Audit Log. A fair value names its version, so it can be recomputed exactly. Without a saved version the built-in default applies (5% premium, 2.5% terminal, 0/5/10% growth, SBC subtracted; not reviewed). By default a fair value uses the latest version saved by its As known on time (ADR-023 F4)."
    formula: "version n+1 = new parameters + reason"
    unit: "N/A"
    example: "Illustration: saving base growth 7% for AAPL with the reason \"services growth\" creates AAPL v1; earlier versions and the default stay selectable."
    direction: "N/A"
    interpretation: "Read the reason and date with the result: a value is only as good as the assumptions behind it."
    why_it_matters: "Makes judgement explicit and auditable instead of hidden in a spreadsheet."
    source: "Steven, saved in the web app (localhost only)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "when Steven saves a version"
    caveats: "The default is a neutral starting point, not a recommendation."
    related_terms: [fair_value_dcf, equity_risk_premium, terminal_growth, model_output]
    methodology_version: 0.1.0
    status: complete

  - term_id: model_output
    display_name: "Model Output, Not Fact"
    category: valuation
    short_definition: "A number computed from assumptions, not reported by a company or a market."
    full_definition: "Fair values, scenario ranges, implied upside, margin of safety and reverse-DCF growth depend on the assumption version; they are labelled so they are never read as reported facts (02 §32.2). Each names its method, assumptions, model date and data date."
    formula: "N/A"
    unit: "N/A"
    example: "\"DCF base $123.76\" is model output; \"revenue $416.16 billion\" is a reported fact."
    direction: "N/A"
    interpretation: "Question the assumptions before the number."
    why_it_matters: "Mixing estimates with facts is how analysis goes wrong unnoticed."
    source: "Platform convention (02 §32.2)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/fair_value.py
    as_of: "2026-10-08"
    update_cadence: "N/A"
    caveats: "N/A"
    related_terms: [valuation_assumptions, fair_value_dcf]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: research record (M1.3b, ADR-024) ----------
  - term_id: revenue_growth
    display_name: "Revenue Growth"
    category: fundamentals
    short_definition: "Revenue against the same length of period a year earlier."
    full_definition: "Revenue of the period divided by revenue of the period a year earlier, minus one. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. TTM growth compares the last four quarters with the four before them."
    formula: "revenue / revenue a year earlier - 1"
    unit: "percent"
    example: "Apple FY2025: $416.161B / $391.035B - 1 = 6.43%."
    direction: "Higher = growing faster"
    interpretation: "How fast the business is getting bigger."
    why_it_matters: "Growth drives most of a company's value; the DCF's growth assumptions should be read against it."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Acquisitions, divestitures and 53-week years distort it; unavailable without the earlier period."
    related_terms: [revenue, trailing_twelve_months]
    methodology_version: 0.1.0
    status: complete

  - term_id: gross_margin
    display_name: "Gross Margin"
    category: fundamentals
    short_definition: "Gross profit as a share of revenue."
    full_definition: "Gross profit divided by revenue for the same period. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time."
    formula: "gross_profit / revenue"
    unit: "percent"
    example: "Apple FY2025: $195.201B / $416.161B = 46.91%."
    direction: "Higher = more pricing power per sale"
    interpretation: "What is left of each dollar of sales after the direct cost of the goods or services."
    why_it_matters: "A durable high gross margin is a common sign of a competitive advantage."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Alphabet, Meta and JPMorgan report no gross profit, so it is Data unavailable for them; companies classify costs differently."
    related_terms: [gross_profit, revenue, operating_margin]
    methodology_version: 0.1.0
    status: complete

  - term_id: operating_margin
    display_name: "Operating Margin"
    category: fundamentals
    short_definition: "Operating income as a share of revenue."
    full_definition: "Operating income divided by revenue for the same period. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time."
    formula: "operating_income / revenue"
    unit: "percent"
    example: "Apple FY2025: $133.050B / $416.161B = 31.97%."
    direction: "Higher = more profitable operations"
    interpretation: "Profit from the business itself, before interest and tax, per dollar of sales."
    why_it_matters: "Shows operating leverage and cost discipline over time."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "JPMorgan and ExxonMobil report no operating income, so it is Data unavailable for them."
    related_terms: [operating_income, revenue, gross_margin, net_margin]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_margin
    display_name: "Net Margin"
    category: fundamentals
    short_definition: "Net income as a share of revenue."
    full_definition: "Net income divided by revenue for the same period. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time."
    formula: "net_income / revenue"
    unit: "percent"
    example: "Apple FY2025: $112.010B / $416.161B = 26.92%."
    direction: "Higher = more profit per sale"
    interpretation: "What reaches shareholders from each dollar of sales, after interest and tax."
    why_it_matters: "Links revenue to earnings per share."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "One-off gains, losses and tax items move it; compare with the operating margin."
    related_terms: [net_income, revenue, operating_margin]
    methodology_version: 0.1.0
    status: complete

  - term_id: effective_tax_rate
    display_name: "Effective Tax Rate"
    category: fundamentals
    short_definition: "Income tax expense as a share of pretax income."
    full_definition: "Income tax expense divided by pretax income for the same period. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. Not meaningful when pretax income is not positive. A tax benefit with positive pretax income gives a negative rate, kept as reported and noted."
    formula: "income_tax_expense / pretax_income"
    unit: "percent"
    example: "Apple FY2025: $20.719B / $132.729B = 15.61%."
    direction: "N/A"
    interpretation: "The share of profit paid in tax; it sets NOPAT for ROIC."
    why_it_matters: "Tax changes move earnings without any change in the business."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Includes deferred tax, so it is not cash tax; one-off items (repatriation, settlements) can make one year unusual."
    related_terms: [income_tax_expense, pretax_income, nopat]
    methodology_version: 0.1.0
    status: complete

  - term_id: nopat
    display_name: "NOPAT"
    category: fundamentals
    short_definition: "Net operating profit after tax: operating income taxed at the effective tax rate."
    full_definition: "Operating income multiplied by one minus the effective tax rate of the same period (ADR-024 R2). The profit the business earns for all its capital providers, before interest."
    formula: "operating_income x (1 - income_tax_expense / pretax_income)"
    unit: "USD"
    example: "Apple FY2025: $133.050B x (1 - 15.61%) = $112.281B."
    direction: "Higher = more after-tax operating profit"
    interpretation: "The numerator of ROIC."
    why_it_matters: "Comparable across companies with different debt levels."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Uses the period's effective rate, including one-off tax items; unavailable without operating income (JPMorgan, ExxonMobil)."
    related_terms: [roic, operating_income, effective_tax_rate]
    methodology_version: 0.1.0
    status: complete

  - term_id: invested_capital
    display_name: "Invested Capital"
    category: fundamentals
    short_definition: "Stockholders' equity plus total debt minus cash on a balance-sheet date."
    full_definition: "The capital tied up in operations: stockholders' equity + total debt - cash and cash equivalents (ADR-024 R2). Debt components a balance sheet does not report count as 0 and are named (D4). ROIC uses the average of the opening and closing values."
    formula: "stockholders_equity + total_debt - cash"
    unit: "USD"
    example: "Apple: $133.636B on 2024-09-28 and $136.456B on 2025-09-27."
    direction: "N/A"
    interpretation: "How much capital the business uses; the denominator of ROIC."
    why_it_matters: "Return on capital only means something against the capital employed."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Cash excludes marketable securities, so cash-rich companies (Apple, Alphabet) show more invested capital than an analyst netting all investments would. Banks have no comparable debt figure."
    related_terms: [roic, total_debt, net_debt, stockholders_equity]
    methodology_version: 0.1.0
    status: complete

  - term_id: roic
    display_name: "Return on Invested Capital (ROIC)"
    category: fundamentals
    short_definition: "NOPAT as a share of average invested capital."
    full_definition: "NOPAT divided by the average of opening and closing invested capital (ADR-024 R2). The opening balance is that of the day before the period starts: the prior fiscal year end, or for TTM the quarter end a year earlier. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. Not meaningful when pretax income or either invested capital is not positive."
    formula: "nopat / ((invested_capital_open + invested_capital_close) / 2)"
    unit: "percent"
    example: "Apple FY2025: $112.281B / average($133.636B, $136.456B) = 83.14%."
    direction: "Higher = more profit per dollar of capital"
    interpretation: "Above the cost of capital, growth creates value; below it, growth destroys value."
    why_it_matters: "The single best summary of business quality and capital allocation."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Very high for companies with little invested capital (Apple, AutoZone); unavailable without operating income (JPMorgan, ExxonMobil)."
    related_terms: [nopat, invested_capital, roe]
    methodology_version: 0.1.0
    status: complete

  - term_id: roe
    display_name: "Return on Equity (ROE)"
    category: fundamentals
    short_definition: "Net income as a share of average stockholders' equity."
    full_definition: "Net income divided by the average of opening and closing stockholders' equity. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. Not meaningful when either equity is not positive (AutoZone, O'Reilly and Lowe's have negative equity after years of buybacks)."
    formula: "net_income / ((stockholders_equity_open + stockholders_equity_close) / 2)"
    unit: "percent"
    example: "Apple FY2025: $112.010B / average($56.950B, $73.733B) = 171.42%."
    direction: "Higher = more profit per dollar of equity"
    interpretation: "Return to shareholders' book capital; leverage raises it."
    why_it_matters: "Read with ROIC: a high ROE from debt is not the same as a high ROE from the business."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Buybacks shrink equity and inflate ROE; n/m with negative equity."
    related_terms: [roic, net_income, stockholders_equity]
    methodology_version: 0.1.0
    status: complete

  - term_id: fcf_conversion
    display_name: "FCF Conversion"
    category: fundamentals
    short_definition: "Free cash flow as a share of net income."
    full_definition: "Free cash flow (operating cash flow - capex) divided by net income. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. Not meaningful when net income is not positive."
    formula: "free_cash_flow / net_income"
    unit: "percent"
    example: "Apple FY2025: $98.767B / $112.010B = 88.18%."
    direction: "Higher = earnings backed by cash"
    interpretation: "Around or above 100% means reported profit turns into cash."
    why_it_matters: "Low conversion can flag aggressive accounting or heavy investment."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Heavy capex years (data centres) lower it without any accounting issue; JPMorgan reports no capex."
    related_terms: [free_cash_flow, net_income, owner_fcf]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_debt_to_ebitda
    display_name: "Net Debt / EBITDA"
    category: fundamentals
    short_definition: "Net debt at the period end divided by the period's EBITDA."
    full_definition: "Net debt (total debt - cash) on the period's last balance-sheet date divided by EBITDA (operating income + D&A) of the period. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. Negative means net cash. Not meaningful when EBITDA is not positive."
    formula: "net_debt / (operating_income + depreciation_amortization)"
    unit: "x"
    example: "Apple FY2025: $62.723B / $144.748B = 0.43x."
    direction: "Lower = stronger balance sheet"
    interpretation: "Years of operating earnings needed to pay off net debt."
    why_it_matters: "The most common measure of balance-sheet strength."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "Unavailable without D&A (Microsoft, Alphabet) or operating income (JPMorgan, ExxonMobil); cash excludes marketable securities."
    related_terms: [net_debt, ebitda_ttm, enterprise_value]
    methodology_version: 0.1.0
    status: complete

  - term_id: cash_returned
    display_name: "Cash Returned to Shareholders"
    category: fundamentals
    short_definition: "Share repurchases plus dividends paid in the period."
    full_definition: "Share repurchases plus dividends paid (ADR-024 R3). Dividends of a period with no dividend figure at all count as 0 and are named (AutoZone and O'Reilly pay none); a period with some dividend figures but not the whole period is unavailable. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time."
    formula: "share_repurchases + dividends_paid"
    unit: "USD"
    example: "Apple FY2025: $90.711B + $15.421B = $106.132B."
    direction: "N/A"
    interpretation: "How much cash went back to owners."
    why_it_matters: "Shows the capital allocation choice between reinvesting and returning cash."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "JPMorgan's dividend figure may include preferred dividends. Buyback mechanics (intensity, net share reduction) are M1.4."
    related_terms: [share_repurchases, dividends_paid, cash_returned_to_fcf]
    methodology_version: 0.1.0
    status: complete

  - term_id: cash_returned_to_fcf
    display_name: "Cash Returned / FCF"
    category: fundamentals
    short_definition: "Buybacks plus dividends as a share of free cash flow."
    full_definition: "Cash returned to shareholders divided by free cash flow (ADR-024 R3). Above 100% means returns exceed the cash the business generated, funded from cash or debt. Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time. Not meaningful when free cash flow is not positive."
    formula: "cash_returned / free_cash_flow"
    unit: "percent"
    example: "Apple FY2025: $106.132B / $98.767B = 107.46%."
    direction: "N/A"
    interpretation: "Whether returns are paid from the business's own cash generation."
    why_it_matters: "Persistent returns above free cash flow need debt or cash on hand."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "One year of heavy capex or a large acquisition makes it jump; read several years."
    related_terms: [cash_returned, free_cash_flow]
    methodology_version: 0.1.0
    status: complete

  - term_id: diluted_shares_change
    display_name: "Diluted Share Change"
    category: fundamentals
    short_definition: "Change in weighted diluted shares against a year earlier."
    full_definition: "Weighted average diluted shares of the period divided by those of the period a year earlier, minus one, both moved to the split basis of the As known on time (ADR-021). For TTM: the latest reported quarter against the same quarter a year earlier. A company that tags no diluted count but reports diluted EPS equal to basic EPS for the period uses its basic weighted shares, labelled (ADR-025 B11; ExxonMobil since 2014). Per fiscal year as reported in the 10-K, and for the last four quarters (TTM) from year-to-date 10-Q values (ADR-021), each with the facts known at the As known on time."
    formula: "diluted_shares / diluted_shares a year earlier - 1 (split-adjusted)"
    unit: "percent"
    example: "Apple FY2025: 15.005B / 15.408B - 1 = -2.62%."
    direction: "Lower = shareholders own more of the company"
    interpretation: "Negative means buybacks outran dilution from stock compensation."
    why_it_matters: "Per-share value grows faster than the business when the share count falls."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-10"
    update_cadence: "per filing"
    caveats: "Not net share reduction (M1.4). A weighted average over the period, so a buyback late in the year shows fully only in the next one."
    related_terms: [diluted_shares, basic_shares, share_repurchases, stock_based_compensation]
    methodology_version: 0.2.0
    status: complete

  - term_id: research_record
    display_name: "Research Record"
    category: fundamentals
    short_definition: "A company's economics, quality and capital allocation for the last four quarters and five fiscal years."
    full_definition: "The per-company record of 02 \u00a73 on the instrument page (M1.3b, ADR-024): revenue growth and margins; ROIC, ROE, effective tax rate, FCF conversion and net debt / EBITDA; free cash flow and where it went (buybacks, dividends, SBC, cash returned / FCF) and the change in diluted shares. Every value shows its inputs and the filings behind them, as known at the As known on time."
    formula: "not a single calculation; reads GET /instruments/{ticker}/research"
    unit: "N/A"
    example: "Apple FY2025: operating margin 31.97%, ROIC 83.14%, cash returned 107.46% of free cash flow."
    direction: "N/A"
    interpretation: "Read the trend over five years, then the latest four quarters."
    why_it_matters: "Valuation only means something against the economics of the business."
    source: "Derived from SEC XBRL filings (domain/research.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/research.py
    as_of: "2026-10-09"
    update_cadence: "per filing"
    caveats: "A missing input leaves a value unavailable with the input named; nothing is estimated. Banks lack most of these measures."
    related_terms: [roic, roe, operating_margin, cash_returned]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: buybacks (M1.4a, ADR-025) ----------
  - term_id: buyback_record
    display_name: "Buyback Record"
    category: corporate_action
    short_definition: "A company's buyback authorizations, actual repurchases and net share reduction, kept apart."
    full_definition: "The instrument page section of M1.4a (ADR-025): announcements of new or increased authorizations, plans and remaining amounts from 8-Ks and press releases; the authorization the 10-Q or 10-K tags; and per period the dollars and shares repurchased, intensity, funding, SBC offset, debt-funded flag, net share reduction and diluted share change. An announcement is not a repurchase, and a repurchase is not a share-count reduction (02 §5)."
    formula: "not a single calculation; reads GET /instruments/{ticker}/buybacks"
    unit: "N/A"
    example: "Apple: a $100 billion authorization increase on 2026-04-30; $90.711 billion repurchased in FY2025; 343.5 million fewer shares outstanding."
    direction: "N/A"
    interpretation: "Read the three parts together: what the board allowed, what was spent, and what shareholders actually gained."
    why_it_matters: "Buybacks are often announced loudly and executed quietly, or offset by stock compensation."
    source: "SEC 8-K documents, issuer press releases and XBRL filings (ADR-025)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback.py
    as_of: "2026-10-10"
    update_cadence: "per filing"
    caveats: "8-Ks are read from 2021 on; press releases only for the five issuers with a newsroom feed."
    related_terms: [repurchase_announcement, share_repurchases, net_share_reduction, buyback_intensity]
    methodology_version: 0.1.0
    status: complete

  - term_id: repurchase_announcement
    display_name: "Repurchase Announcement"
    category: corporate_action
    short_definition: "A new or increased buyback authorization, a buyback plan, or a remaining amount, as an issuer states it."
    full_definition: "A sentence of an 8-K (body or EX-99 exhibit) or an issuer press release whose dollar amount is tied to an authorization ('authorized / approved [an additional] $X ... repurchase'), a plan ('plans to repurchase $X', which counts as an announcement, B9) or a remaining amount ('$X remaining under the authorization'). Repurchases already made, debt and tender offers never count. The same kind and amount within 30 days is one event (an 8-K and its press release, or a later filing repeating the stated date), dated by the stated or earliest publication date; every source is kept as evidence. Only the sentence (at most 300 characters) and the link are stored."
    formula: "rule-based sentence match (extractor 0.1.0)"
    unit: "USD"
    example: "Apple 8-K, 2024-05-02: 'our Board has authorized an additional $110 billion for share repurchases' (increase, $110 billion)."
    direction: "N/A"
    interpretation: "Evidence that the board allowed buybacks; not evidence that any were made."
    why_it_matters: "The WATCH state needs one (M1.4b), and an announcement alone never goes further (errata E7)."
    source: "SEC 8-K documents and issuer press releases (sec.eight_k, news)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_announcements.py
    as_of: "2026-10-10"
    update_cadence: "daily"
    caveats: "Rule-based: unusual wording can be missed, and a recap without a stated date can repeat an event. 8-Ks from 2021 on; press releases for five issuers."
    related_terms: [buyback_record, repurchase_authorized, repurchase_remaining]
    methodology_version: 0.1.0
    status: complete

  - term_id: repurchase_to_fcf
    display_name: "Repurchases / FCF"
    category: corporate_action
    short_definition: "Share repurchases as a share of free cash flow."
    full_definition: "Dollars paid for share repurchases divided by free cash flow (operating cash flow - capex) of the same period. Per fiscal year as reported, and for the last four quarters (TTM) from year-to-date 10-Q values, as known at the As known on time. Not meaningful when free cash flow is not positive."
    formula: "share_repurchases / free_cash_flow"
    unit: "percent"
    example: "Apple FY2025: $90.711B / $98.767B = 91.84%."
    direction: "N/A"
    interpretation: "Up to 100% the buyback is paid from what the business generated; above it, from cash or debt."
    why_it_matters: "Buybacks funded by borrowing can create a false signal (01 §4)."
    source: "Derived from SEC XBRL filings and daily closes (domain/buyback.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback.py
    as_of: "2026-10-10"
    update_cadence: "per filing"
    caveats: "One heavy capex year raises it without any change in buyback policy."
    related_terms: [free_cash_flow, share_repurchases, debt_funded_buyback]
    methodology_version: 0.1.0
    status: complete

  - term_id: sbc_offset
    display_name: "SBC Offset"
    category: corporate_action
    short_definition: "Stock-based compensation as a share of share repurchases."
    full_definition: "Stock-based compensation expense divided by dollars paid for share repurchases. Per fiscal year as reported, and for the last four quarters (TTM) from year-to-date 10-Q values, as known at the As known on time. Not meaningful when there were no repurchases."
    formula: "stock_based_compensation / share_repurchases"
    unit: "percent"
    example: "Apple FY2025: $12.863B / $90.711B = 14.18%."
    direction: "Lower = more of the buyback reaches shareholders"
    interpretation: "How much of the buyback only replaces shares handed to employees."
    why_it_matters: "Gross buybacks can hide heavy dilution from stock compensation."
    source: "Derived from SEC XBRL filings and daily closes (domain/buyback.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback.py
    as_of: "2026-10-10"
    update_cadence: "per filing"
    caveats: "SBC is an expense, not the shares issued; net share reduction measures the result."
    related_terms: [stock_based_compensation, net_share_reduction]
    methodology_version: 0.1.0
    status: complete

  - term_id: debt_funded_buyback
    display_name: "Debt-Funded Buyback"
    category: corporate_action
    short_definition: "Whether net debt rose over the period while repurchases exceeded free cash flow."
    full_definition: "Yes when net debt at the period end is above net debt at its start and dollars repurchased exceed free cash flow; no otherwise. Unavailable when any of the four inputs is not reported (banks have no comparable net debt). Per fiscal year as reported, and for the last four quarters (TTM) from year-to-date 10-Q values, as known at the As known on time."
    formula: "net_debt_end > net_debt_start AND share_repurchases > free_cash_flow"
    unit: "yes / no"
    example: "Apple FY2025: no (repurchases $90.711B within free cash flow $98.767B)."
    direction: "Yes = a warning sign"
    interpretation: "Borrowing to buy back stock raises risk and can flatter per-share figures."
    why_it_matters: "02 §5 asks to tell debt-funded buybacks apart."
    source: "Derived from SEC XBRL filings and daily closes (domain/buyback.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback.py
    as_of: "2026-10-10"
    update_cadence: "per filing"
    caveats: "Net debt can rise for other reasons (an acquisition); read with the cash flow statement."
    related_terms: [net_debt, repurchase_to_fcf]
    methodology_version: 0.1.0
    status: complete

  - term_id: net_share_reduction_pct
    display_name: "Net Share Reduction %"
    category: corporate_action
    short_definition: "Net share reduction as a share of the shares outstanding a year earlier."
    full_definition: "Shares outstanding a year earlier minus shares outstanding now, divided by the count a year earlier, both on the split basis of the As known on time (ADR-025 B5). Per fiscal year as reported, and for the last four quarters (TTM) from year-to-date 10-Q values, as known at the As known on time."
    formula: "(shares_outstanding_open - shares_outstanding_close) / shares_outstanding_open"
    unit: "percent"
    example: "Apple FY2025: 343,526,000 / 15,116,786,000 = 2.27%."
    direction: "Higher = each share owns more of the company"
    interpretation: "The per-share gain from buybacks after all issuance."
    why_it_matters: "The number that reaches shareholders, unlike gross repurchases (01 §4)."
    source: "Derived from SEC XBRL filings and daily closes (domain/buyback.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback.py
    as_of: "2026-10-10"
    update_cadence: "per filing"
    caveats: "Balance-sheet counts at period ends; acquisitions paid in stock reduce it."
    related_terms: [net_share_reduction, diluted_shares_change]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: buyback states (M1.4b, ADR-025) ----------
  - term_id: buyback_state
    display_name: "Buyback State"
    category: corporate_action
    short_definition: "Where a company stands under the versioned buyback rules: none, WATCH, ACTIVE or HIGH-CONVICTION candidate."
    full_definition: "A deterministic rule set (rule_version, config/buyback_rules.yaml) assigns each universe company the highest state whose conditions, and those of every state below it, pass (errata E7). Each condition is pass, fail or unavailable with what is missing; missing data never passes. Evaluated daily at 11:00 SGT and at every month end since 2021 (backfilled), and stored with the rule version, every input, threshold and piece of evidence, so recomputing with the same times reproduces it (ADR-025). TRADE-READY is unreachable in Phase 1."
    formula: "highest level L such that every condition rule of WATCH..L passes"
    unit: "state"
    example: "Apple as known on 2026-10-06 (recorded SEC filings and closes): ACTIVE (a $100 billion increase on 2026-04-30, 0.61% of market cap repurchased in the June quarter, diluted shares -1.56%); not HIGH-CONVICTION, because the price is above the base DCF value and five years of FCF yields are not in the test data."
    direction: "N/A"
    interpretation: "A label for where to look, not a recommendation: none of the states triggers a trade."
    why_it_matters: "Separates announced, executed and well-funded buybacks with fixed, reviewable rules."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "Thresholds are rule v0.1.0 defaults, not validated (OD-7). No state ever triggers a buy (02 §5); an announcement alone reaches WATCH at most."
    related_terms: [buyback_record, buyback_rule_version, buyback_quality_score, condition_status]
    methodology_version: 0.1.0
    status: complete

  - term_id: buyback_state_watch
    display_name: "WATCH"
    category: corporate_action
    short_definition: "A buyback was recently authorized or planned, or a large authorization remains."
    full_definition: "Either condition passes: (1) a new or increased authorization or a yearly plan (B9) announced in an 8-K or issuer press release within the last 365 days; (2) a remaining authorization stated in such an announcement within that window, at least 2% of market cap at T. Before 2022 a missing announcement is unavailable, since 8-Ks are read from 2021-01-01 only."
    formula: "announcement within 365 days OR remaining authorization / market cap >= 2%"
    unit: "state"
    example: "NVIDIA as known on 2026-10-06 (recorded SEC filings and closes): WATCH from its 2026-09-28 release (a $150 billion increase, $235 billion remaining)."
    direction: "N/A"
    interpretation: "The board allowed buybacks; nothing says any were made."
    why_it_matters: "The first step of the ladder: evidence of intent."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "Thresholds are rule v0.1.0 defaults, not validated (OD-7). XBRL-tagged authorizations only corroborate (B1); they never qualify on their own."
    related_terms: [buyback_state, repurchase_announcement, remaining_to_market_cap]
    methodology_version: 0.1.0
    status: complete

  - term_id: buyback_state_active
    display_name: "ACTIVE"
    category: corporate_action
    short_definition: "WATCH, and the company is actually buying back stock and its diluted share count is falling."
    full_definition: "WATCH, and both: (1) repurchases in the latest reported quarter (ended at most 200 days before T) of at least 0.5% of market cap at the quarter end, or, for a mega cap (market cap then >= $500 billion, rule 0.2.0, B13), any repurchase; a quarter without repurchases fails; (2) weighted diluted shares of the latest period at least 1% below a year earlier."
    formula: "WATCH AND quarter repurchases / market cap >= 0.5% AND diluted share change <= -1%"
    unit: "state"
    example: "ExxonMobil as known on 2026-10-06 (recorded SEC filings and closes): ACTIVE (0.91% of market cap repurchased in the June quarter, diluted shares -3.63%)."
    direction: "N/A"
    interpretation: "Money is being spent on buybacks and the share count is shrinking."
    why_it_matters: "Turns an announcement into evidence from the 10-Q/10-K: an announcement alone never reaches ACTIVE (E7)."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-11"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "Thresholds are rule v0.2.0 defaults after Steven's first review, not validated (OD-7). Quarterly repurchases are differenced from year-to-date filings; market cap needs an end-of-day close near the quarter end."
    related_terms: [buyback_state, quarter_repurchase_to_market_cap, diluted_shares_change]
    methodology_version: 0.2.0
    status: complete

  - term_id: buyback_state_high_conviction
    display_name: "HIGH-CONVICTION Candidate"
    category: corporate_action
    short_definition: "ACTIVE, paid from free cash flow without much new debt, and the stock looks cheap by its own history or the DCF."
    full_definition: "ACTIVE, and: funded by FCF (TTM repurchases at most 1.2 x TTM free cash flow, and net debt up by at most 10% of |net debt a year earlier|, B7), and valuation context (FCF yield at least its own month-end median over five years, B10, or the price at least 15% below the base DCF value with the assumption version saved by T)."
    formula: "ACTIVE AND fcf_funding <= 1.2x AND net debt change <= 10% AND (fcf_yield_to_median >= 1.0 OR margin_of_safety >= 15%)"
    unit: "state"
    example: "ExxonMobil as known on 2026-10-06 (recorded SEC filings and closes): not a candidate, because net debt rose 12.61% of a year earlier's."
    direction: "N/A"
    interpretation: "A candidate for research, not a trade: Phase 2 risk checks come before any trade."
    why_it_matters: "Buybacks that are affordable and done when the stock is not expensive tend to add value."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "Thresholds are rule v0.1.0 defaults, not validated (OD-7). Banks have no comparable free cash flow or net debt: unavailable for them."
    related_terms: [buyback_state, fcf_funding, net_debt_change_yoy, fcf_yield_to_median, margin_of_safety]
    methodology_version: 0.1.0
    status: complete

  - term_id: buyback_state_trade_ready
    display_name: "TRADE-READY"
    category: corporate_action
    short_definition: "HIGH-CONVICTION, the market confirms, and a risk check passed. Unreachable in Phase 1."
    full_definition: "HIGH-CONVICTION, market confirmation (the close above its 50-session average, or a 21-session return above SPY's) and a passed risk check. The risk check arrives in Phase 2, so the rule set marks this state unreachable and the database refuses it (P1-4). Market confirmation is computed and shown."
    formula: "HIGH-CONVICTION AND (close > 50-session average OR return - SPY return > 0) AND risk check passed"
    unit: "state"
    example: "Apple as known on 2026-10-06 (recorded SEC filings and closes): market confirmation passes (close 3.25% above its average), the risk check is unavailable: not TRADE-READY."
    direction: "N/A"
    interpretation: "Not used in Phase 1."
    why_it_matters: "Keeps the ladder complete without implying a trade."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "Even in Phase 2 a state alone never places an order (02 §5)."
    related_terms: [buyback_state, market_confirmation, risk_check]
    methodology_version: 0.1.0
    status: complete

  - term_id: remaining_to_market_cap
    display_name: "Remaining Authorization / Market Cap"
    category: corporate_action
    short_definition: "The remaining buyback authorization an issuer stated, as a share of market cap at T."
    full_definition: "The latest remaining amount stated within 365 days in an 8-K or press release (a 'remaining' sentence, or an increase that states the total remaining) divided by market cap at T (the valuation price x shares outstanding)."
    formula: "stated remaining authorization / market cap at T"
    unit: "percent"
