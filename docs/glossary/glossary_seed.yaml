  - term_id: buyback_rule_version
    display_name: "Buyback Rule Version"
    category: methodology
    short_definition: "The version of the buyback state rules an assignment used."
    full_definition: "Each rule set of config/buyback_rules.yaml has a rule_version. A released version never changes: `make migrate` registers it with the sha256 of its content and refuses a change under the same version, and a unit test pins the hash (B4). Tuning a threshold means a new version through a pull request; stored assignments keep theirs."
    formula: "not a calculation; config/buyback_rules.yaml"
    unit: "version"
    example: "0.1.0: the M1.4 plan's default thresholds, approved 2026-10-10. 0.2.0 (2026-10-11, after the threshold review): period-end market cap on the latest dated share count (B12), mega caps pass ACTIVE's quarter test on any repurchase (B13) and score intensity 100 at 2% (B14)."
    direction: "N/A"
    interpretation: "Two assignments compare only under the same rule version."
    why_it_matters: "Makes every state reproducible and every threshold change visible."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/buyback_rules.yaml
    as_of: "2026-10-11"
    update_cadence: "per rule change"
    caveats: "Only the active version is evaluated daily."
    related_terms: [buyback_state, threshold_review]
    methodology_version: 0.2.0
    status: complete

  - term_id: backfilled_evaluation
    display_name: "Backfilled Evaluation"
    category: methodology
    short_definition: "A state evaluated after its As known on time, from the data public by then."
    full_definition: "Month-end states since 2021 were evaluated later (B6), from the facts, closes and announcements published by each month end as the database held them at the backfill time (system time). They show what the rules say about that date with today's collection of what was public then, not what an evaluation on that date would have seen."
    formula: "known_at < system_time"
    unit: "flag"
    example: "The 2026-03-31 state of Apple, evaluated on 2026-10-10."
    direction: "N/A"
    interpretation: "Use for history and threshold review; read with care for data collected late."
    why_it_matters: "Gives each company a state history from 2021 without waiting."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "Data collected after the month end but published before it counts; restatements published later do not."
    related_terms: [buyback_state, point_in_time]
    methodology_version: 0.1.0
    status: complete

  - term_id: threshold_review
    display_name: "Threshold Review"
    category: methodology
    short_definition: "The table of every universe company's state and inputs under the current rule version."
    full_definition: "On the Corporate Actions dashboard: each company's state, every condition's value against its threshold (pass, fail, unavailable) and the score components, as known on the chosen date, so Steven can confirm or tune the defaults (P1-9). A change becomes a new rule version."
    formula: "not a calculation; reads GET /buybacks"
    unit: "table"
    example: "Rule 0.1.0 on 2026-10-10 left AutoZone, JPMorgan and NVIDIA at WATCH: two tag shares only at year ends, and NVIDIA's $19.7B quarter was 0.39% of a $5T market cap. Rule 0.2.0 answers both (B12, B13)."
    direction: "N/A"
    interpretation: "Look for thresholds that every company passes or none can."
    why_it_matters: "The thresholds are defaults until reviewed against real companies."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-11"
    update_cadence: "per page load"
    caveats: "Review on enough history; one date can mislead."
    related_terms: [buyback_rule_version, buyback_state]
    methodology_version: 0.2.0
    status: complete

  - term_id: condition_status
    display_name: "Condition Status"
    category: methodology
    short_definition: "Whether one rule condition passes, fails or cannot be judged."
    full_definition: "pass: the value meets the threshold; fail: it does not, or the rule fails it outright (a quarter without repurchases); unavailable: an input is missing, with what is missing. Unavailable never counts as a pass. A state's conditions combine with all (ACTIVE) or any (WATCH, the valuation context)."
    formula: "value compared with the threshold"
    unit: "pass / fail / unavailable"
    example: "Apple's FCF-yield condition: unavailable (12 month ends; 36 needed)."
    direction: "N/A"
    interpretation: "Unavailable means the data is not there, not that the company failed."
    why_it_matters: "Keeps missing data from looking like a signal."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/buyback_states.py
    as_of: "2026-10-10"
    update_cadence: "daily (11:00 SGT) and month ends since 2021"
    caveats: "N/A"
    related_terms: [buyback_state]
    methodology_version: 0.1.0
    status: complete

  - term_id: mega_cap
    display_name: "Mega Cap"
    category: corporate_action
    short_definition: "A company with a market cap of at least $500 billion at the period end, in the buyback rules."
    full_definition: "In buyback rule 0.2.0 (B13, B14): market cap at the quarter or period end (the last end-of-day close by then x the latest share count dated by then) of at least $500 billion. A mega cap passes ACTIVE's quarter test on any repurchase, since even large buybacks are a small share of its value, and its repurchase intensity scores 100 at 2% instead of 4%."
    formula: "market cap at the period end >= $500 billion"
    unit: "flag"
    example: "NVIDIA ($5.0T), Apple ($4.1T), Microsoft ($2.8T), JPMorgan ($870B) and ExxonMobil ($562B) at their June 2026 quarter ends."
    direction: "N/A"
    interpretation: "Judged per period, so a company can move across the line."
    why_it_matters: "A share-of-market-cap test alone would hold back the largest buyers in dollars."
    source: "Derived by the buyback state rules (domain/buyback_states.py, config/buyback_rules.yaml)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/config/buyback_rules.yaml
    as_of: "2026-10-11"
    update_cadence: "per evaluation"
    caveats: "The line is a default, not validated (OD-7); diluted shares must still fall at least 1% for ACTIVE."
    related_terms: [buyback_state_active, quarter_repurchase_to_market_cap, buyback_score_intensity, market_cap]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 1: earnings events (M1.5, ADR-026) ----------
  - term_id: earnings_event
    display_name: "Earnings Event"
    category: earnings
    short_definition: "A company's results release: an 8-K with Item 2.02, at its EDGAR acceptance time."
    full_definition: "Every 8-K a universe company (or its predecessor issuer) filed with Item 2.02 'Results of Operations and Financial Condition' since 2021 (ADR-026 E1), timed by EDGAR's acceptance time to the second (01 §23), not only its date. Each event shows when it was released, the 10-Q or 10-K its numbers wait for, the quarter's actuals, any numeric guidance and the price reaction against SPY."
    formula: "8-K with Item 2.02, at acceptance time"
    unit: "event"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): accepted 16:30:41 ET, after the close."
    direction: "N/A"
    interpretation: "The moment new results became public."
    why_it_matters: "Reactions and look-ahead checks depend on the exact time, not the day."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "When a press release went out before the 8-K was accepted, the 8-K time is used."
    related_terms: [earnings_timing, earnings_report, earnings_reaction, filing_date]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_timing
    display_name: "Release Timing"
    category: earnings
    short_definition: "Whether a release came before the open, during the session or after the close."
    full_definition: "The acceptance time against its New York trading day: before 09:30 (pre-market), 09:30-16:00 (market hours; 13:00 on early-close days in the calendar), after the close (after hours), or a day without a session. Trading days are those with an SPY close."
    formula: "acceptance time vs the session of its New York day"
    unit: "category"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): after hours. ExxonMobil, 2025-10-31 06:31 ET: pre-market."
    direction: "N/A"
    interpretation: "Decides which close is the first one after the release."
    why_it_matters: "An after-hours release is first priced at the next session."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "Early closes before 2026 are not in the calendar and count as 16:00."
    related_terms: [earnings_event, earnings_reaction, market_session]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_report
    display_name: "Matched Report"
    category: earnings
    short_definition: "The 10-Q or 10-K whose XBRL numbers a release waits for."
    full_definition: "The first 10-Q or 10-K the issuer chain filed from two days before the release on, for a period that ended in the 100 days before it (ADR-026 E2). A release has no XBRL, so its quarter's actuals appear only once this report is public; until then the event says the report is not yet public."
    formula: "first 10-Q/10-K filed from release - 2 days, period end within 100 days before"
    unit: "filing"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): 10-Q 0000320193-26-000013, accepted 2026-05-01 06:01 ET."
    direction: "N/A"
    interpretation: "The source of the event's actual numbers."
    why_it_matters: "Keeps the actuals point-in-time: nothing before the report was public."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "A late or missing 10-Q leaves the event without actuals."
    related_terms: [earnings_event, earnings_actuals]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_actuals
    display_name: "Quarter Actuals"
    category: earnings
    short_definition: "The reported quarter's revenue, EPS, margins and free cash flow, with the quarter before and a year earlier."
    full_definition: "From the matched report's quarter: revenue; diluted EPS (the reported three-month value; a fourth quarter is never derived, ADR-013); gross, operating and net margin (part / revenue); free cash flow (operating cash flow - capex). Quarters come from year-to-date filings (ADR-021). Each is shown with the quarter before and the same quarter a year earlier, as known at the As known on time."
    formula: "quarter values from 10-Q/10-K XBRL"
    unit: "USD, USD per share, percent"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): revenue $111.184B, EPS $2.01, gross margin 49.27%."
    direction: "N/A"
    interpretation: "What the quarter actually delivered, from the filing."
    why_it_matters: "Results against the company's own past; there is no consensus to compare with (OD-3)."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "EPS of a fourth quarter is unavailable unless the company reports it."
    related_terms: [earnings_report, change_qoq, change_yoy, eps_diluted, gross_margin]
    methodology_version: 0.1.0
    status: complete

  - term_id: change_qoq
    display_name: "Change vs Prior Quarter"
    category: earnings
    short_definition: "How the quarter compares with the quarter before."
    full_definition: "For amounts (revenue, EPS, free cash flow): the quarter / the quarter before - 1, in percent; n/m when the earlier value is not positive. For margins: the difference in percentage points."
    formula: "now / prior quarter - 1 (margins: now - prior)"
    unit: "percent or percentage points"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): revenue -22.66% (after the holiday quarter)."
    direction: "Higher = growth"
    interpretation: "Momentum within the year."
    why_it_matters: "Seasonal businesses swing from quarter to quarter."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "Seasonality: compare with a year earlier for the trend."
    related_terms: [earnings_actuals, change_yoy]
    methodology_version: 0.1.0
    status: complete

  - term_id: change_yoy
    display_name: "Change vs a Year Earlier"
    category: earnings
    short_definition: "How the quarter compares with the same quarter a year earlier."
    full_definition: "For amounts (revenue, EPS, free cash flow): the quarter / the same quarter a year earlier - 1, in percent; n/m when the earlier value is not positive. For margins: the difference in percentage points."
    formula: "now / year-ago quarter - 1 (margins: now - year ago)"
    unit: "percent or percentage points"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): revenue +16.60%, EPS +21.82%, gross margin +2.22 points."
    direction: "Higher = growth"
    interpretation: "Growth with seasonality removed."
    why_it_matters: "The headline comparison of most results."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "Acquisitions and accounting changes affect it."
    related_terms: [earnings_actuals, change_qoq]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_reaction
    display_name: "Reaction vs SPY"
    category: earnings
    short_definition: "The stock's return after a release minus SPY's over the same days."
    full_definition: "From the last end-of-day close at or before the release to the first close after it (day 0), and to the 1st and 5th sessions after day 0: the stock's return minus SPY's over the same days, in percentage points (ADR-026 E4). Closes are split-adjusted and only those known at the As known on time count, so a release after the close shows nothing until the next session's close."
    formula: "(close_k / close_base - 1) - (SPY_k / SPY_base - 1)"
    unit: "percentage points"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): day 0 (2026-05-01) +3.24% vs SPY +0.28% = +2.96 points; day +5 +5.46 points."
    direction: "Higher = the market liked it more"
    interpretation: "How the market judged the results."
    why_it_matters: "Price confirmation of a thesis; also a check for look-ahead in research."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "daily"
    caveats: "Market moves on the same day are removed only as SPY's average move; no beta adjustment."
    related_terms: [earnings_event, earnings_timing, earnings_volume_ratio, relative_return_1m]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_volume_ratio
    display_name: "Volume vs 20 Sessions"
    category: earnings
    short_definition: "Day-0 trading volume against the average of the 20 sessions before the release."
    full_definition: "Shares traded on the first session after the release / the average of the 20 sessions up to the last close before it, split-adjusted."
    formula: "volume(day 0) / mean(volume, 20 sessions before)"
    unit: "x"
    example: "Apple's release of 2026-04-30 (quarter to 2026-03-28): 1.84x."
    direction: "Higher = more attention"
    interpretation: "How much trading the release caused."
    why_it_matters: "A large reaction on heavy volume is more meaningful than on light volume."
    source: "SEC 8-K Item 2.02 filings and 10-Q/10-K XBRL; Alpaca end-of-day closes (domain/earnings.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/earnings.py
    as_of: "2026-10-11"
    update_cadence: "daily"
    caveats: "Index rebalancing and option expiry days also inflate volume."
    related_terms: [earnings_reaction, volume]
    methodology_version: 0.1.0
    status: complete

  - term_id: guidance_statement
    display_name: "Guidance"
    category: earnings
    short_definition: "A company's own numeric outlook for revenue, EPS or a margin, quoted from its release."
    full_definition: "Rule-based (P1-3, ADR-026 E3, extractor 0.1.0): a sentence of an earnings 8-K exhibit with a forward word and a future period, or a bullet or table row of an outlook section whose heading names the period, stating a number or range for revenue (or sales growth), EPS or a gross, operating or net margin. 'Plus or minus' becomes a range; '(previously ...)' is ignored; expenses, capital expenditures and tax rates are not kept. Only the sentence (at most 300 characters) and the link are stored."
    formula: "rule-based sentence match"
    unit: "USD, USD per share, percent"
    example: "Meta, 2024-02-01: first quarter 2024 revenue $34.5-37 billion. NVIDIA: revenue $108.0 billion, plus or minus 2%."
    direction: "N/A"
    interpretation: "What management expects; compare with later actuals."
    why_it_matters: "Guidance changes often move the stock more than the quarter itself."
    source: "SEC 8-K exhibits (sec.earnings_release, domain/guidance.py)"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/guidance.py
    as_of: "2026-10-11"
    update_cadence: "per release"
    caveats: "Apple, Alphabet, Microsoft, JPMorgan, AutoZone and ExxonMobil give no numeric revenue, EPS or margin guidance in their releases: 'guidance not extracted'."
    related_terms: [earnings_event, consensus_estimate]
    methodology_version: 0.1.0
    status: complete

  - term_id: consensus_estimate
    display_name: "Consensus Estimate"
    category: earnings
    short_definition: "Analysts' average expectation before a release. Not available."
    full_definition: "There is no point-in-time consensus provider (OD-3, Phase 1 decision P1-2). The field is always shown as Data unavailable and never estimated, scraped or replaced by guidance (errata E6)."
    formula: "none"
    unit: "N/A"
    example: "Every event: Data unavailable."
    direction: "N/A"
    interpretation: "Results here are compared with the company's own past, not with expectations."
    why_it_matters: "Most price reactions are about the result against expectations."
    source: "Phase 1 decision P1-2 (OD-3); errata E6"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/spec/SPEC_ERRATA_v2.1.md
    as_of: "2026-10-11"
    update_cadence: "N/A"
    caveats: "Arrives only with a licensed point-in-time provider."
    related_terms: [earnings_surprise, guidance_statement]
    methodology_version: 0.1.0
    status: complete

  - term_id: earnings_surprise
    display_name: "Earnings Surprise"
    category: earnings
    short_definition: "Actual results against the consensus estimate. Not available."
    full_definition: "Needs the consensus estimate, which has no provider (OD-3): always Data unavailable, never computed against guidance or a model (errata E6)."
    formula: "actual / consensus - 1 (not computed)"
    unit: "N/A"
    example: "Every event: Data unavailable."
    direction: "N/A"
    interpretation: "Use the reaction against SPY as the market's own verdict instead."
    why_it_matters: "Surprise, not the headline number, usually drives the reaction."
    source: "Phase 1 decision P1-2 (OD-3); errata E6"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/docs/spec/SPEC_ERRATA_v2.1.md
    as_of: "2026-10-11"
    update_cadence: "N/A"
    caveats: "Arrives with a consensus provider."
    related_terms: [consensus_estimate, earnings_reaction]
    methodology_version: 0.1.0
    status: complete

  # ---------- Phase 0: macro series (M0.6) ----------
  # FRED / ALFRED series in config/macro_series.yaml; values as published, with vintages (ADR-015).
  - term_id: signal
    display_name: "Signal"
    category: signal
    short_definition: "A rule's output that an instrument deserves a look, with the rule version and the data behind it."
    full_definition: "Generated by a versioned rule, never by hand (ADR-027 J1), paper only, at its time T with its source quality, evidence independence (how many rule conditions passed) and the rows it came from; a backfilled one is marked backfilled. Two sources: S1, a buyback state assignment at ACTIVE, HIGH-CONVICTION or TRADE-READY makes one long signal of family 2 (Corporate Actions) with its Buyback Quality Score; S3 (since M2.4, ADR-032), each ETF of a newly set rotation target makes two long signals, family 5 (its trend is up, scored by its 12-1 momentum) and family 1 (the stress state allows it)."
    formula: "S1: qualifying buyback state -> one long family 2 signal; S3: new rotation target -> two long signals (family 5, family 1) per ETF"
    unit: "signal"
    example: "Apple ACTIVE under buyback rules 0.3.0: one S1 signal; XLE in the October 2026 rotation target: two S3 signals."
    direction: "N/A"
    interpretation: "A prompt to research and decide, not a recommendation; the decision is yours and is recorded either way."
    why_it_matters: "Decisions can later be compared with the signals they followed or ignored."
    source: "Buyback state assignments (M1.4b) and rotation assessments (M2.4); domain/signals.py, domain/rotation.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/signals.py
    as_of: "2026-10-16"
    update_cadence: "daily, with the buyback states (11:00 SGT) and the rotation (11:15 SGT)"
    caveats: "Earnings make no signal yet: strategy S2 needs a consensus estimate (OD-3). S3 ETFs cannot be cited in the journal yet (ADR-032 Q4). Rules are unvalidated until backtests (M2.5)."
    related_terms: [buyback_state_active, etf_rotation, execution_eligibility, thesis_card]
    methodology_version: 0.2.0
    status: complete

  - term_id: execution_eligibility
    display_name: "Execution Eligibility"
    category: signal
    short_definition: "Whether a signal may lead to an order; in Phase 1 always paper only."
    full_definition: "Every Phase 1 signal is paper_only: no risk check exists before Phase 2 (P1-4) and nothing in the system can send an order (ADR-008). The database refuses any other value."
    formula: "paper_only (Phase 1, a database check)"
    unit: "state"
    example: "Every signal on the Strategy Lab reads paper only."
    direction: "N/A"
    interpretation: "A signal can be journaled and tracked on paper, never traded."
    why_it_matters: "Separates research from execution until strategies pass validation and risk checks."
    source: "Build spec 02 §28 and errata E1; migration 0018"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/domain/signals.py
    as_of: "2026-10-11"
    update_cadence: "per phase"
    caveats: "Live trading also stays disabled in the settings (LIVE_TRADING_ENABLED is refused)."
    related_terms: [signal, paper_mode]
    methodology_version: 0.1.0
    status: complete

  - term_id: thesis_card
    display_name: "Thesis Card"
    category: journal
    short_definition: "A short written case for or against a position: thesis, 3-7 pieces of evidence, catalysts, invalidation and valuation."
    full_definition: "Written at the time it is saved (no backdating; ADR-027). Each evidence item is a system row (a reported value, filing, buyback or guidance statement, buyback state, news story or close) read as known then and stored as a snapshot; free notes are allowed but are not evidence. The valuation is the base DCF against the price as the fair value page showed it then. A change is a new version; earlier versions stay."
    formula: "thesis + evidence[3..7] + catalysts[0..5] + invalidation + valuation snapshot"
    unit: "card"
    example: "Apple, NO TRADE: buybacks shrink the share count, but the price is above the base DCF (priced in)."
    direction: "N/A"
    interpretation: "What you believed, why, and what would prove it wrong, frozen at the time."
    why_it_matters: "Makes later review honest: the card shows only what was known when it was written."
    source: "Build spec 02 §17; api/journal.py"
    source_url: https://github.com/stevenyang0714/autotrading/blob/main/apps/api/src/autotrading/api/journal.py
    as_of: "2026-10-11"
    update_cadence: "per entry"
    caveats: "Evidence cannot cite outside links (J2); single user, no sign-in."
    related_terms: [evidence_item, catalyst, invalidation, trade_decision, journal_replay]
    methodology_version: 0.1.0
    status: complete

  - term_id: evidence_item
    display_name: "Evidence Item"
    category: journal
    short_definition: "One system row cited by a Thesis Card, stored as it was known when the card was written."
    full_definition: "The card names the row; the server reads it as known at the card's time T and as the database held it at its system time S, and stores the values (J2). A row the company does not have, or that was not public at T, is refused."
    formula: "row read as of (T, S) -> snapshot"
    unit: "row"
    example: "AAPL revenue for the fiscal year to 2025-09-27 from the 10-K, value and filing as known on the card's date."
