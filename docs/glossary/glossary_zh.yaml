# Chinese hints for glossary terms (M0.6, ADR-016). Presentation only: not part of the 17
# fields of 02 §22 and not in the term's content hash, so editing a hint needs no
# methodology_version bump. English stays the primary language; these appear in tooltips and as
# small labels next to key headings. Every complete term needs an entry (tested).
# Format: term_id: {name: 中文名稱, hint: 一句中文說明}. Traditional Chinese, Taiwan usage.
version: 0.1.0
terms:
  # provenance and data quality
  point_in_time: {name: 時點資料, hint: 只使用在該時間點之前已公開的資訊，避免用到「未來的資料」。}
  vintage: {name: 版本（公布值）, hint: 某個數值在某次發布時的版本；修正後舊版本仍保留可查。}
  restated_flag: {name: 重編, hint: 後來的申報改寫了同一期間的數值，原值仍保留。}
  filing_date: {name: 申報時間, hint: SEC 受理申報、資訊公開的時間。}
  accession_number: {name: 申報編號, hint: SEC 為每份申報指定的唯一編號，可連到原始文件。}
  reporting_period: {name: 報告期間, hint: 數值所描述的期間，以期末日標示；不是公布日。}
  predecessor_issuer: {name: 前身發行人, hint: 公司改組前的原發行公司，其財報屬於這檔股票的歷史。}
  source_tier: {name: 來源等級, hint: 資料來源的可信程度，數字越小越權威（1 為官方來源）。}
  license_status: {name: 授權狀態, hint: 這份資料可以怎麼使用：公開、個人授權或受限。}
  access_status: {name: 存取狀態, hint: 是否已具備取得這個來源資料的條件（例如 API key）。}
  data_freshness: {name: 資料新鮮度, hint: 距離上次成功更新多久，和該來源的預期更新頻率比較。}
  freshness_sla: {name: 新鮮度標準, hint: 該來源可接受的最長未更新時間，超過即視為過期。}
  rate_limit: {name: 請求速率上限, hint: 平台每秒最多向該來源發出的請求數。}
  update_cadence: {name: 更新頻率, hint: 來源多久發布一次新資料。}
  ingestion_status: {name: 擷取狀態, hint: 某次資料擷取的結果：成功、略過、失敗等。}
  page_reconciliation: {name: 財報對帳, hint: 每家公司最新 10-K、10-Q 與申報檔本身的 XBRL 逐項比對的結果。}
  filing_reconciliation: {name: 申報對帳, hint: 用申報檔自己的 XBRL 數字，比對我們在受理當時存的值。}
  reconciliation_status: {name: 對帳結果, hint: pass 全部一致；warn 只有提醒；fail 有數字不一致、缺漏或多存。}
  balance_identity: {name: 資產負債恆等式, hint: 資產總額 = 負債加股東權益；不成立代表讀取或申報有問題。}
  ingestion_note: {name: 擷取備註, hint: 這次擷取對來源資料做過的檢查或校正，例如改用申報表頭的受理時間。}
  dead_letter: {name: 失敗佇列, hint: 重試多次仍失敗的擷取工作，需要人工處理。}
  as_of: {name: 資料時間, hint: 資料所反映的時間點。}
  planned_phase: {name: 預計階段, hint: 這個儀表板預計在哪個開發階段開始有內容。}
  next_refresh: {name: 下次更新, hint: 平台下一次依排程抓取這個來源的時間。}
  data_age: {name: 資料年齡, hint: 來源發布最新數值至今經過多久。}

  # pages and navigation
  page_data_health: {name: 資料健康度, hint: 所有資料來源的狀態、最近擷取紀錄與失敗項目。}
  page_instruments: {name: 個股, hint: 投資範圍內股票的財報、估值、合理價值與研究紀錄，可切換「當時已知」的版本。}
  page_macro: {name: 總經, hint: 美國主要總經序列及其每次修正，可切換「當時已知」的版本。}
  page_overview: {name: 總覽, hint: 首頁總經儀表板：六大區塊、圖表與規則式重點。}
  page_progress: {name: 開發進度, hint: 即時讀取專案文件的里程碑、驗收項目與待決事項。}
  milestone_status: {name: 里程碑狀態, hint: 驗收項目完成數，以及完成、進行中、未開始，或已提出待批准。}
  open_decision: {name: 待決事項, hint: 需要你決定的事項、需要的時間點與決定前的預設做法。}
  dev_log: {name: 開發紀錄, hint: 每個步驟完成內容的紀錄，最新在前。}

  # dashboards
  dashboard_global_monitor: {name: 全球監控, hint: 全球事件、實體與政策的總覽（Phase 3）。}
  dashboard_market_regime: {name: 市場環境, hint: 總經與市場所處的狀態判斷（Phase 2）。}
  dashboard_opportunity_radar: {name: 機會雷達, hint: 依訊號篩選出的研究候選標的（Phase 2）。}
  dashboard_fundamental_research: {name: 基本面研究, hint: 10 家公司一張表：成長、利潤率、ROIC、資本配置與估值，點公司看研究紀錄。}
  dashboard_corporate_actions: {name: 公司行動, hint: 買回、股利、分割等公司行動（Phase 1）。}
  dashboard_event_transmission: {name: 事件傳導, hint: 事件如何經由產業鏈影響資產（Phase 3）。}
  dashboard_earnings: {name: 財報季, hint: 實際財報與前期比較、財測與市場反應（Phase 1）。}
  dashboard_x_expert_watch: {name: X 專家觀察, hint: 追蹤研究者在 X 上的觀點變化（Phase 4）。}
  dashboard_policy_monitor: {name: 政策監控, hint: 政策提案到實施的生命週期（Phase 3）。}
  dashboard_congress_trades: {name: 國會交易, hint: 美國議員申報的交易與申報延遲（Phase 4）。}
  dashboard_options_vol: {name: 選擇權與波動率, hint: 選擇權分析與避險（Phase 5）。}
  dashboard_portfolio_risk: {name: 投組風險, hint: 部位風險與風險否決規則（Phase 2）。}
  dashboard_alerts_center: {name: 警示中心, hint: 所有警示與通知（Phase 1）。}
  dashboard_strategy_lab: {name: 策略實驗室, hint: 模擬交易日誌與回測（Phase 1–2）。}
  dashboard_execution: {name: 下單執行, hint: 下單預覽與模擬帳戶（Phase 5）。}

  # audit log and macro chart (M0.9)
  page_audit_log: {name: 稽核紀錄, hint: 系統對來源設定與資料的每一次變更：誰、何時、改了什麼、前後值。}
  audit_action: {name: 動作, hint: 新增、修改、刪除，或事實被更正版本取代。}
  audit_actor: {name: 操作者, hint: 做出變更的程序：資料擷取工作、設定同步或資料庫使用者。}
  first_release_overlay: {name: 首次公布值, hint: 每個數據第一次公布時的數值，和目前數值並列，差距就是修正。}

  # news (M0.8)
  duplicate_group: {name: 轉載群組, hint: 同一則新聞的各個轉載版本歸成一組，只算一則報導。}
  page_news: {name: 新聞, hint: universe 公司的英文新聞與官方發布，同一則新聞的轉載收合成一列。}
  news_time_basis: {name: 新聞時間, hint: 發布者自己的發布時間，或 GDELT 第一次看到的時間（不會早於發布）。}
  story_count: {name: 報導數, hint: 不重複的新聞則數（以轉載群組計），不是文章數。}

  # market data (M0.7)
  last_price: {name: 最新成交價, hint: 行情來源最近一筆成交價；免費方案只有 IEX 單一交易所。}
  bid: {name: 買價, hint: 目前買方出的最高價（此交易所內）。}
  ask: {name: 賣價, hint: 目前賣方出的最低價（此交易所內）。}
  volume: {name: 成交量, hint: 期間內成交的股數；IEX 只是全市場的一小部分。}
  feed_status: {name: 報價狀態, hint: 價格有多即時、多完整：單一交易所即時、收盤價、過期、無資料或測試資料。}
  price_change_1d: {name: 當日漲跌幅, hint: 最新價相對前一日收盤的變動百分比。}
  pct_below_52w_high: {name: 距 52 週高點, hint: 最新價低於過去一年最高收盤價多少百分比；0 代表創新高。}
  market_session: {name: 交易時段, hint: 美股是否開盤（紐約時間 09:30–16:00，扣除假日與提早收盤）。}
  price_history: {name: 價格走勢, hint: 過去一年經股票分割調整的每日收盤價；查過去日期時只用當時已知的資料。}

  # SEC fundamentals
  revenue: {name: 營收, hint: 公司在該期間報告的總銷售額，未扣除任何成本。}
  gross_profit: {name: 毛利, hint: 營收減去銷貨成本。}
  operating_income: {name: 營業利益, hint: 本業獲利，未計利息與稅。}
  net_income: {name: 淨利, hint: 歸屬於母公司股東的稅後淨利。}
  eps_diluted: {name: 稀釋每股盈餘, hint: 考慮選擇權與可轉債潛在稀釋後的每股獲利。}
  diluted_shares: {name: 稀釋加權股數, hint: 期間內的加權平均股數，含潛在稀釋股份。}
  cash: {name: 現金及約當現金, hint: 期末的現金與極短期、高流動性投資。}
  long_term_debt_noncurrent: {name: 長期負債（非流動）, hint: 一年後才到期的借款。}
  long_term_debt_current: {name: 一年內到期長期負債, hint: 長期借款中一年內到期的部分。}
  commercial_paper: {name: 商業本票, hint: 短期無擔保借款，通常 270 天內到期。}
  operating_cash_flow: {name: 營業現金流, hint: 本業營運在期間內產生的現金。}
  capex: {name: 資本支出, hint: 購置廠房、設備等固定資產支付的現金。}
  share_repurchases: {name: 庫藏股買回, hint: 公司實際支付買回自家股票的現金。}
  stock_based_compensation: {name: 股票酬勞, hint: 發給員工的股票與選擇權費用，屬非現金費用。}
  shares_outstanding: {name: 流通在外股數, hint: 資產負債表日的普通股流通股數；多股別公司為各股別加總。}
  shares_outstanding_cover: {name: 封面流通股數, hint: 申報封面上、接近申報日的流通股數，日期在期末之後。}
  shares_repurchased: {name: 買回股數, hint: 期間內實際買回的自家股票股數，不是授權額度。}
  repurchase_authorized: {name: 買回授權額度, hint: 董事會批准可用於買回的金額；授權不等於實際買回。}
  repurchase_remaining: {name: 剩餘買回額度, hint: 已授權但尚未用掉的買回金額，不代表一定會買。}
  depreciation_amortization: {name: 折舊與攤銷, hint: 固定資產與無形資產的非現金費用，EBITDA 的組成之一。}
  stockholders_equity: {name: 股東權益, hint: 歸屬母公司股東的帳面價值；大量買回會使它變小甚至為負。}
  dividends_paid: {name: 已付股利, hint: 期間內實際以現金發放的股利。}
  interest_expense: {name: 利息費用, hint: 借款在期間內認列的利息成本。}
  income_tax_expense: {name: 所得稅費用, hint: 期間內認列的所得稅（含遞延），不等於實際繳納的稅。}
  pretax_income: {name: 稅前淨利, hint: 繼續營業單位扣除所得稅前的利潤。}
  free_cash_flow: {name: 自由現金流, hint: 營業現金流減資本支出；兩者都有申報才計算。}
  total_debt: {name: 總負債（借款）, hint: 長期負債（含一年內到期）加商業本票；未申報的短期項目以 0 計並標示。}
  net_debt: {name: 淨負債, hint: 總負債減現金；負值代表現金多於負債。}
  quarterly_derived_value: {name: 單季值（推算）, hint: 由累計數相減得到單季，例如第二季 = 半年累計 − 第一季。}
  trailing_twelve_months: {name: 近四季合計（TTM）, hint: 最近連續四個季度的合計，只用於流量類數字。}
  split_adjusted: {name: 分割調整值, hint: 依之後的股票分割換算到目前股數基準的值，原始申報值仍並列。}
  split_event: {name: 股票分割, hint: 股數按比例改變（例如一股變四股），從除權日起生效。}
  valuation_price: {name: 估值股價, hint: 當時已公開的最後一個每日收盤價；fixture、過期或盤中報價都不用。}
  market_cap: {name: 市值, hint: 股價 × 最新流通股數（依分割換算到股價日）。}
  enterprise_value: {name: 企業價值（EV）, hint: 市值加淨負債，包含債權人的部分。}
  eps_diluted_ttm: {name: 近四季稀釋 EPS, hint: 全年 EPS + 今年累計 − 去年同期累計，皆為申報值。}
  ebitda_ttm: {name: 近四季 EBITDA, hint: 近四季營業利益加折舊攤銷。}
  pe_ratio_ttm: {name: 本益比（TTM）, hint: 股價 ÷ 近四季稀釋 EPS；EPS 為負時無意義。}
  ev_to_ebitda: {name: EV/EBITDA, hint: 企業價值 ÷ 近四季 EBITDA，不受資本結構影響。}
  ev_to_sales: {name: EV/營收, hint: 企業價值 ÷ 近四季營收。}
  price_to_book: {name: 股價淨值比, hint: 市值 ÷ 股東權益；權益為負時無意義。}
  fcf_yield: {name: 自由現金流殖利率, hint: 近四季自由現金流 ÷ 市值。}
  earnings_yield: {name: 盈餘殖利率, hint: 近四季 EPS ÷ 股價，本益比的倒數。}

  # research record (M1.3b)
  revenue_growth: {name: 營收成長率, hint: 本期營收 ÷ 一年前同長度期間的營收 − 1。}
  gross_margin: {name: 毛利率, hint: 毛利 ÷ 營收。}
  operating_margin: {name: 營業利益率, hint: 營業利益 ÷ 營收。}
  net_margin: {name: 淨利率, hint: 淨利 ÷ 營收。}
  effective_tax_rate: {name: 有效稅率, hint: 所得稅 ÷ 稅前盈餘；稅前為負時無意義。}
  nopat: {name: 稅後營業利益（NOPAT）, hint: 營業利益 ×（1 − 有效稅率）。}
  invested_capital: {name: 投入資本, hint: 股東權益 + 總負債 − 現金。}
  roic: {name: 投入資本報酬率（ROIC）, hint: NOPAT ÷ 平均投入資本（期初與期末）。}
  roe: {name: 股東權益報酬率（ROE）, hint: 淨利 ÷ 平均股東權益；權益為負時無意義。}
  fcf_conversion: {name: FCF 轉換率, hint: 自由現金流 ÷ 淨利，看獲利有沒有變成現金。}
  net_debt_to_ebitda: {name: 淨負債 / EBITDA, hint: 期末淨負債 ÷ EBITDA；負值代表淨現金。}
  cash_returned: {name: 回饋股東金額, hint: 庫藏股 + 股利；沒申報股利的期間以 0 計並標示。}
  cash_returned_to_fcf: {name: 回饋股東 / FCF, hint: 回饋股東金額 ÷ 自由現金流；超過 100% 代表動用現金或借錢。}
  diluted_shares_change: {name: 稀釋股數年增減, hint: 稀釋加權股數 ÷ 一年前 − 1，換算到同一分割基準。}
  research_record: {name: 研究紀錄, hint: 一家公司近四季與五個財年的成長、品質與資本配置，每個數字附來源申報。}

  # fair value (M1.3a)
  fair_value_dcf: {name: DCF 每股合理價值, hint: 業主自由現金流折現得企業價值，減淨負債再除以股數；模型結果，不是事實。}
  owner_fcf: {name: 業主自由現金流, hint: 近四季營業現金流 − 資本支出 − 股票薪酬（SBC）。}
  discount_rate: {name: 折現率, hint: 當時已知的 10 年期美債殖利率 + 股權風險溢酬。}
  equity_risk_premium: {name: 股權風險溢酬, hint: 股票相對美債要求的額外年報酬；假設值，2–10%。}
  terminal_growth: {name: 永續成長率, hint: 第 10 年後永遠的成長率；至少要比折現率低 1 個百分點。}
  scenario_range: {name: 情境區間, hint: bear、base、bull 三種前 5 年成長率下的每股價值。}
  implied_upside: {name: 隱含漲跌幅, hint: base 每股價值 ÷ 估值股價 − 1。}
  margin_of_safety: {name: 安全邊際, hint: (base 每股價值 − 股價) ÷ base 每股價值；負值表示股價高於模型價值。}
  reverse_dcf_growth: {name: 反向 DCF 隱含成長率, hint: 讓 base 價值等於股價所需的前 5 年年成長率，也就是市場在假設的成長。}
  multiple_percentile: {name: 倍數歷史百分位, hint: 目前倍數在 2016 年以來每個月底（當時已知資料）中的排名。}
  valuation_assumptions: {name: 估值假設版本, hint: 每家公司有編號、只能新增的 DCF 假設；每次儲存都是新版本並記入稽核紀錄。}
  model_output: {name: 模型結果，不是事實, hint: 由假設算出的數字，不是公司申報或市場報價。}

  # macro series
  observation_date: {name: 觀測日期, hint: FRED 標示數值的日期，為期間的第一天；不是公布日。}
  macro_cpi: {name: 消費者物價指數（CPI）, hint: 美國都市消費者整體物價指數，季調後。}
  macro_core_pce: {name: 核心 PCE 物價指數, hint: 排除食品與能源的個人消費支出物價指數，聯準會偏好的通膨指標。}
  macro_unemployment_rate: {name: 失業率, hint: 勞動力中失業者的比例，季調後。}
  macro_nonfarm_payrolls: {name: 非農就業人數, hint: 美國非農業部門受雇總人數（千人），月增減即「非農數字」。}
  macro_real_gdp: {name: 實質 GDP, hint: 扣除物價因素後的國內生產毛額，季調年率。}
  macro_fed_funds: {name: 聯邦基金利率, hint: 銀行間隔夜拆款的有效利率（月平均），受聯準會政策引導。}
  macro_treasury_2y: {name: 2 年期美債殖利率, hint: 2 年期固定期限美國公債殖利率，反映政策利率預期。}
  macro_treasury_10y: {name: 10 年期美債殖利率, hint: 10 年期固定期限美國公債殖利率，長期資產的折現基準。}
  macro_curve_10y_2y: {name: 10 年減 2 年利差, hint: 殖利率曲線斜率；負值即「倒掛」。}
  macro_hy_oas: {name: 高收益債利差, hint: 高收益公司債相對美債的額外殖利率（OAS）。}
  macro_vix: {name: VIX 恐慌指數, hint: S&P 500 選擇權隱含的未來 30 天波動率。}

  # overview indicators
  cpi_inflation_yoy: {name: CPI 年增率, hint: CPI 與 12 個月前相比的變動百分比。}
  core_pce_inflation_yoy: {name: 核心 PCE 年增率, hint: 核心 PCE 與 12 個月前相比的變動百分比，對照聯準會 2% 目標。}
  payrolls_monthly_change: {name: 非農月增減, hint: 最新一個月非農就業人數相對前一月的變化（千人）。}
  payrolls_prior_month_revision: {name: 前月非農修正, hint: 前一個月的非農數字相對初值被修正了多少（千人）。}
  sahm_rule_indicator: {name: 薩姆規則指標, hint: 失業率 3 個月平均高於前 12 個月低點的幅度；≥ 0.50 個百分點視為觸發。}
  real_gdp_growth_annualized: {name: 實質 GDP 年化季增率, hint: 實質 GDP 季增率換算為年率。}
  real_fed_funds_rate: {name: 實質聯邦基金利率, hint: 聯邦基金利率減去核心 PCE 年增率。}
  yield_curve_inversion: {name: 殖利率曲線狀態, hint: 10 年減 2 年利差是否為負（倒掛），以及已維持多少交易日。}
  hy_oas_percentile: {name: 高收益債利差百分位, hint: 目前利差在可取得歷史中的排名（0–100）。}
  rule_insight: {name: 規則式重點, hint: 以固定規則與門檻由資料產生的一句摘要，列出所用數據與版本；不是預測或建議。}
  vix_percentile_1y: {name: VIX 一年百分位, hint: 目前 VIX 在過去 12 個月收盤值中的排名（0–100）。}
